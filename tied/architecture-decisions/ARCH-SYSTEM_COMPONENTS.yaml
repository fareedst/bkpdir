    implementation: []
    tests: []
    code_annotations:
      - ARCH-SYSTEM_COMPONENTS
      - REQ-MAINTAINABILITY
      - REQ-USABILITY
  related_decisions:
    depends_on: *ref_0
    informs: []
    see_also: []
