ARCH-TOKEN_SYSTEM:
  ai_assistant_integration: Token-based navigation and feature discovery
  alternatives_considered:
    - cons: []
      name: See detail file
      pros: []
      rejected_reason: |-
        Feature IDs without tokens: Rejected due to lack of traceability
        Manual documentation only: Rejected due to maintenance overhead
        External tooling: Rejected due to dependency complexity
  automated_validation: Scripts validate token format, consistency, and traceability
  constraints:
    - All changes must keep `[ARCH-TOKEN_SYSTEM]` contracts (cross-layer references, validation hooks, AI navigation) satisfied before removing legacy records.
    - Governance reporting (`docs/governance/…`) must reference the new tables to maintain policy discoverability.
    - Migration must be performed in small, validated batches with checkpoints after every category to keep traceability intact.
  cross-layer_traceability: Requirements → Architecture → Implementation → Tests → Code
  cross-link_layer: For each legacy token, map to an explicit `[REQ-*]`, `[ARCH-*]`, `[IMPL-*]`, and referenced tests/files; open tasks whenever a mapping gap is detected.
  cross-references: '[REQ-DOC_016], [REQ-GOV_REGISTRY_COMPLETENESS], [ARCH-TOKEN_SYSTEM], [IMPL-TOKEN_SYSTEM]'
  cross_references:
    - REQ-DOC_016
    - REQ-GOV_DISCOVERABILITY
    - REQ-GOV_REGISTRY_COMPLETENESS
    - REQ-MAINTAINABILITY
  decision: Comprehensive semantic token system for feature traceability across all layers
  decommission_layer: After each batch migrates, replace the YAML entry with a pointer to the markdown registry until the YAML file can be removed entirely.
  implementation_approach:
    details: []
    summary: Comprehensive semantic token system for feature traceability across all layers
  inventory_layer: Parse `project-tokens.yaml` into structured batches (actions, features, semantic token metadata) and normalize identifiers to STDD-compliant names.
  metadata:
    created:
      author: MCP converter
      date: '2026-03-12'
    last_updated:
      author: MCP converter
      date: '2026-03-12'
      reason: Converted from monolithic
    last_validated:
      date: '2026-03-12'
      result: pass
      validator: MCP converter
  name: Token System Architecture
  rationale:
    benefits: []
    problems_solved: []
    why: |-
      Consolidates the single source of truth inside the STDD documentation tree for auditability.
      Ensures governance requirements ([REQ-GOV_REGISTRY_COMPLETENESS], [REQ-GOV_DISCOVERABILITY]) are enforced through one registry.
      Eliminates drift between YAML metadata and the STDD token registry.
      Enables validation scripts to reason over one canonical markdown source.
  registry_layer: Extend `tied/semantic-tokens.md` with tables that capture description, governance status, linked documents, and validation owners per token.
  related_decisions:
    depends_on:
      - REQ-DOC_016
      - REQ-GOV_DISCOVERABILITY
      - REQ-GOV_REGISTRY_COMPLETENESS
      - REQ-MAINTAINABILITY
    informs: []
    see_also: []
  status: Active
  token_format_standards:
    - 'Consistency: Same token must be used consistently across all layers'
    - 'Cross-references: Implementation tokens must reference `[ARCH-*]` and `[REQ-*]` tokens'
    - 'Format: `[TYPE:IDENTIFIER]` with UPPER_SNAKE_CASE identifiers'
  token_registry: Central registry in `semantic-tokens.md` with cross-references to all documentation layers
  token_types:
    - '`[ARCH-*]` - Architecture decision tokens in `tied/architecture-decisions/` detail YAML'
    - '`[IMPL-*]` - Implementation tokens in code comments'
    - '`[REQ-*]` - Requirements tokens in `tied/requirements/` detail YAML'
    - '`[TEST:*]` - Test specification tokens (referenced via `[REQ-*]` in test names)'
  traceability:
    code_annotations:
      - ARCH-TOKEN_SYSTEM
      - REQ-DOC_016
      - REQ-GOV_DISCOVERABILITY
      - REQ-GOV_REGISTRY_COMPLETENESS
      - REQ-MAINTAINABILITY
    implementation: []
    requirements:
      - REQ-DOC_016
      - REQ-GOV_DISCOVERABILITY
      - REQ-GOV_REGISTRY_COMPLETENESS
      - REQ-MAINTAINABILITY
    tests: []
  validation_requirements:
    - Cross-layer token consistency validation
    - Missing token detection
    - Token format compliance across all files
    - Token traceability completeness checking
