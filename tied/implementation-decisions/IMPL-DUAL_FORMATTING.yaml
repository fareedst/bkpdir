  essence_pseudocode: "# [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING]\n# Dual-mode output formatting: printf-style for backward-compat, template-style for rich data [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING]\n\n# [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure format_with_printf(formatType, args...):\nprocedure format_with_printf(formatType, args...):\n  # [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] Printf formatting path\n  formatStr = config.GetFormatString(formatType)\n  if formatStr == \"\":\n    formatStr = defaultFormats[formatType]\n  return sprintf(formatStr, args...)\n\n# [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure format_with_template(templateStr, data map):\nprocedure format_with_template(templateStr, data map):\n  # [IMPL-DUAL_FORMATTING]\
    \ [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] Template placeholder replacement\n  result = templateStr\n\n  # [IMPL-DUAL_FORMATTING] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] Replace #{key} placeholders from data map [ARCH-OUTPUT_FORMATTING]\n  for each (key, value) in data:\n    placeholder = \"#{\" + key + \"}\"\n    result = replaceAll(result, placeholder, value)\n\n  # [IMPL-DUAL_FORMATTING] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] Fill known missing placeholders with defaults [ARCH-OUTPUT_FORMATTING]\n  knownDefaults = {\"#{size_human}\": \"unknown\", \"#{size}\": \"0\", \"#{mtime}\": \"unknown\"}\n  for each (placeholder, default) in knownDefaults:\n    if result contains placeholder:\n      result = replaceAll(result, placeholder, default)\n\n  # [IMPL-DUAL_FORMATTING] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] Handle mixed printf+template strings [ARCH-OUTPUT_FORMATTING]\n  if result contains \"%s\":\n    replace first %s with data[\"path\"] or data[\"name\"]\n    replace second %s with data[\"\
    creation_time\"] if present\n\n  # [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] Go text/template fallback [REQ-OUTPUT_FORMATTING]\n  if result contains \"{{\" and not \"#{\":\n    parse and execute as Go text/template with data\n    on error: return result as-is (graceful fallback)\n\n  return result\n\n# [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure format_list_archive(path, creationTime):\nprocedure format_list_archive(path, creationTime):\n  # [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] Dual-mode list formatting\n  formatStr = config.GetFormatString(\"list_archive\")\n  if formatStr contains \"#{\":\n    # [IMPL-DUAL_FORMATTING] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] Template path with file stats [ARCH-OUTPUT_FORMATTING]\n    data = {\"path\": path, \"creation_time\": creationTime}\n    statInfo = GatherFileStatInfo(path)\n    if statInfo != nil:\n      merge statInfo fields into\
    \ data\n    else:\n      fill data with safe defaults\n    return format_with_template(formatStr, data)\n  else:\n    # [IMPL-DUAL_FORMATTING] [REQ-OUTPUT_FORMATTING] Printf fallback for backward compatibility [ARCH-OUTPUT_FORMATTING]\n    return sprintf(formatStr, path, creationTime)\n\n# [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure print_formatted(formatType, message):\nprocedure print_formatted(formatType, message):\n  # [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [IMPL-DELAYED_OUTPUT] Output routing [REQ-OUTPUT_FORMATTING]\n  if collector != nil:\n    collector.AddStdout(message, formatType)\n  else:\n    print(message)\n\n# [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure extract_pattern_data(pattern, text):\nprocedure extract_pattern_data(pattern, text):\n  # [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] Regex-based\
    \ data extraction for template processing [REQ-OUTPUT_FORMATTING]\n  re = compile(pattern)\n  matches = re.FindStringSubmatch(text)\n  result = empty map\n  for each named group in matches:\n    result[name] = match_value\n  return result\n\n# [IMPL-DUAL_FORMATTING] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure replace_placeholders(formatStr, data):\nprocedure replace_placeholders(formatStr, data):\n  # [IMPL-DUAL_FORMATTING] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] Simple #{key} replacement [ARCH-OUTPUT_FORMATTING]\n  result = formatStr\n  for each (key, value) in data:\n    result = replaceAll(result, \"#{\" + key + \"}\", value)\n  return result"
