  essence_pseudocode: "# [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] [REQ-USABILITY] — Limit list command output to newest N items\n\n# --- Flag registration (main.go) --- [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT]\n# [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [ARCH-CLI_COMMANDS] [REQ-LIST_LIMIT] [REQ-USABILITY] Register --limit as persistent flag\nprocedure register_limit_flag():\n  var listLimit int\n  rootCmd.PersistentFlags.IntVarP(&listLimit, \"limit\", \"n\", 10, \"Limit the number of items to display (0 = show all)\")\n  # Persistent so it applies to both `list` subcommand and `--list` flag on root [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT]\n\n# --- List archives (main.go: handleListCommand + ListArchivesEnhanced) --- [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT]\n# [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] [REQ-OUTPUT_FORMATTING] Limit archive listing output\nprocedure handleListCommand():\n  cwd = os.Getwd()\n  cfg = LoadConfig(cwd)\n  formatter\
    \ = NewOutputFormatter(cfg)\n  ListArchivesEnhanced(cfg, formatter, listLimit)\n\n# [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] — Block implements documented behavior for: procedure ListArchivesEnhanced(cfg, formatter, limit):\nprocedure ListArchivesEnhanced(cfg, formatter, limit):\n  # [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] Accept limit and apply after sorting\n  cwd = os.Getwd()\n  archiveDir = resolve archive directory from cfg\n  archives = ListArchives(archiveDir)\n  if archives is empty: print \"no archives found\", return\n\n  # [IMPL-LIST_LIMIT] [REQ-LIST_LIMIT] Sort most recent first [ARCH-LIST_LIMIT] [ARCH-DIFF_COMMAND] [ARCH-DIRECTORY_COMPARISON]\n  sort archives by CreationTime descending\n\n  # [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] Apply limit (0 = show all)\n  if limit > 0 and len(archives) > limit:\n    archives = archives[:limit]\n\n  # [IMPL-LIST_LIMIT] [REQ-OUTPUT_FORMATTING] Format and print each archive [ARCH-LIST_LIMIT] [ARCH-DIFF_COMMAND]\
    \ [ARCH-DIRECTORY_COMPARISON]\n  for each archive in archives:\n    output = formatter.FormatListArchiveWithExtraction(archive.Path, creationTime)\n    print output\n\n# --- List file backups (main.go: handleListFileBackupsCommand, backup.go: ListFileBackupsEnhanced) --- [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT]\n# [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] [REQ-USABILITY] Limit file backup listing output\nprocedure handleListFileBackupsCommand(args):\n  filePath = listFile or args[0]\n  cfg = LoadConfig(cwd)\n  formatter = NewOutputFormatter(cfg)\n  ListFileBackupsEnhanced(cfg, formatter, filePath, listLimit)\n\n# [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] — Block implements documented behavior for: procedure ListFileBackupsEnhanced(cfg, formatter, filePath, limit):\nprocedure ListFileBackupsEnhanced(cfg, formatter, filePath, limit):\n  backupDir = resolve backup directory from cfg\n  backups = ListFileBackups(backupDir, baseFilename)\n  if backups is\
    \ empty: print \"no backups found\", return\n\n  # Sort most recent first [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT]\n  sort backups by modification time descending\n\n  # [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] Apply limit (0 = show all)\n  if limit > 0 and len(backups) > limit:\n    backups = backups[:limit]\n\n  for each backup in backups:\n    print formatted backup info\n\n# --- CommandHandler path (main.go: HandleListArchives) --- [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT]\n# [IMPL-LIST_LIMIT] [ARCH-LIST_LIMIT] [REQ-LIST_LIMIT] Default limit for CommandHandler\nprocedure CommandHandler.HandleListArchives(args):\n  archives = ListArchives(archiveDir)\n  sort archives most-recent-first\n  limit = 10  # default for CommandHandler path\n  if limit > 0 and len(archives) > limit:\n    archives = archives[:limit]\n  format and print archives"
