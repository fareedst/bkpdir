  essence_pseudocode: "# [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Contracts-first design for extracted packages (pkg/config, pkg/fileops, pkg/git, pkg/formatter).\n\nINPUT: package boundaries from ARCH-CODE_ORGANIZATION\n# [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: OUTPUT: Go interfaces consumed by main and tests; concrete types stay internal or behind adapters\nOUTPUT: Go interfaces consumed by main and tests; concrete types stay internal or behind adapters\n\n# [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE discover_consumer_surface(providerPkg, consumerRoots):\nPROCEDURE discover_consumer_surface(providerPkg, consumerRoots):\n  # [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] Map call sites in main/pkg/tests to minimal method sets for testability\n  FOR EACH reference FROM consumerRoots\
    \ TO providerPkg:\n    record method name and argument shapes\n  END FOR\n  RETURN deduplicated method list\n\n# [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE define_interface_in_consumer(name, methods):\nPROCEDURE define_interface_in_consumer(name, methods):\n  # [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] Declare Go interface in consumer package per Go idiom\n  emit type name interface { methods... }\n  document each method with godoc linking [REQ-MAINTAINABILITY]\n\n# [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE implement_and_register(rootWire):\nPROCEDURE implement_and_register(rootWire):\n  # [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] Concrete structs satisfy interfaces; wiring only at composition root\n  FOR EACH interface I required by rootWire:\n    instantiate concrete\
    \ type T from provider package\n    assert T satisfies I at compile time\n    inject T into handlers (CLI, tests)\n  END FOR\n\n# [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE verify_with_mocks():\nPROCEDURE verify_with_mocks():\n  # [IMPL-INTERFACE_DRIVEN] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] Unit tests use fakes for each interface boundary\n  FOR EACH package under pkg/ with external deps:\n    substitute mock implementations in _test.go\n    run go test without live filesystem/git where possible\n  END FOR"
