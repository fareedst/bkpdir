  status: Active
  description: Preserve working-plan content by migrating it directly into STDD core documents and decommission the working-plan artifact. STDD requires authoritative records to live in the requirements, architecture, and implementation documents for traceability.
  rationale:
    why: STDD requires authoritative records in canonical documents for traceability; working-plan files create duplication and risk drift
