      - Content duplication between working-plan and canonical STDD documents
      - Risk of drift between supplemental files and canonical records
      - Loss of traceability when content lives outside STDD structure
    benefits:
      - All authoritative records in canonical STDD/TIED documents
      - Traceability maintained through proper token references
      - No duplication or drift risk from working-plan artifacts
