  essence_pseudocode: |-
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Git CLI integration using exec.Command("git", ...) for repository detection, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # branch/hash extraction, working-directory status, and submodule operations. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Two-layer design: pkg/git implements logic; git.go is a backward-compatible adapter. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]

    # ── Data Structures ─────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Config, Info, SubmoduleInfo, GitError supporting the Repository interface. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA Config:
    DATA Config:
      Enabled, IncludeInfo, ShowDirtyStatus       bool
      Command, WorkingDirectory                   string
      RequireCleanRepo, AutoDetectRepo            bool
      IncludeSubmodules                           bool
      IncludeBranch, IncludeHash, IncludeStatus   bool
      CommandTimeout                              string
      MaxSubmoduleDepth                           int
      # Legacy compat [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
      IncludeDirtyStatus                          bool
      GitCommand                                  string

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA Info:
    DATA Info:
      Branch, Hash  string
      IsClean       bool
      IsRepo        bool
      IsSubmodule   bool
      Submodules    []SubmoduleInfo

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA SubmoduleInfo:
    DATA SubmoduleInfo:
      Name, Path, URL, Hash, Status  string

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA GitError:
    DATA GitError:
      Operation  string
      Err        error

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: INTERFACE Repository:
    INTERFACE Repository:
      IsRepository() -> bool
      GetBranch() -> (string, error)
      GetShortHash() -> (string, error)
      IsWorkingDirectoryClean() -> (bool, error)
      GetInfo() -> (*Info, error)
      GetInfoWithStatus() -> (*Info, error)
      IsSubmodule() -> (bool, error)
      GetSubmodules() -> ([]SubmoduleInfo, error)
      GetSubmoduleStatus(path) -> (string, error)

    # ── Core Execution ──────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # All git operations go through executeGitCommand. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure DEFAULT_CONFIG() -> *Config:
    procedure DEFAULT_CONFIG() -> *Config:
      RETURN Config with sensible defaults:
        Enabled=true, Command="git", WorkingDirectory=".",
        AutoDetectRepo=true, IncludeBranch=true, IncludeHash=true,
        IncludeStatus=true, CommandTimeout="30s", MaxSubmoduleDepth=3

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure EXECUTE_GIT_COMMAND(args...) -> (string, error):
    procedure EXECUTE_GIT_COMMAND(args...) -> (string, error):
      # Resolve git command with legacy fallback [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
      gitCmd = config.Command OR config.GitCommand OR "git"
      cmd = exec.Command(gitCmd, args...)
      cmd.Dir = config.WorkingDirectory
      output, err = cmd.Output()
      IF err: RETURN "", GitError{Operation=join(args), Err=err}
      RETURN TrimSpace(output), nil

    # ── Repository Detection ────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Delegates to git rev-parse --is-inside-work-tree. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure IS_REPOSITORY() -> bool:
    procedure IS_REPOSITORY() -> bool:
      out, err = EXECUTE_GIT_COMMAND("rev-parse", "--is-inside-work-tree")
      RETURN err == nil AND out == "true"

    # ── Branch Extraction ───────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Guards with IS_REPOSITORY check, then extracts branch name. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_BRANCH() -> (string, error):
    procedure GET_BRANCH() -> (string, error):
      IF NOT IS_REPOSITORY(): RETURN "", GitError{Op="branch detection", not a repo}
      RETURN EXECUTE_GIT_COMMAND("rev-parse", "--abbrev-ref", "HEAD")

    # ── Hash Extraction ─────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Guards with IS_REPOSITORY check, then extracts short hash. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_SHORT_HASH() -> (string, error):
    procedure GET_SHORT_HASH() -> (string, error):
      IF NOT IS_REPOSITORY(): RETURN "", GitError{Op="hash extraction", not a repo}
      RETURN EXECUTE_GIT_COMMAND("rev-parse", "--short", "HEAD")

    # ── Status Detection ────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Clean when git status --porcelain returns empty output. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure IS_WORKING_DIRECTORY_CLEAN() -> (bool, error):
    procedure IS_WORKING_DIRECTORY_CLEAN() -> (bool, error):
      IF NOT IS_REPOSITORY(): RETURN false, GitError{Op="status check", not a repo}
      out, err = EXECUTE_GIT_COMMAND("status", "--porcelain")
      IF err: RETURN false, err
      RETURN len(out) == 0, nil

    # ── Aggregated Info ─────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Composes IsRepository, GetBranch, GetShortHash into Info. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_INFO() -> (*Info, error):
    procedure GET_INFO() -> (*Info, error):
      info = Info{ IsRepo = IS_REPOSITORY() }
      IF NOT info.IsRepo: RETURN info, nil
      info.Branch, err = GET_BRANCH()
      IF err: RETURN info, err
      info.Hash, err = GET_SHORT_HASH()
      IF err: RETURN info, err
      RETURN info, nil

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Extends GET_INFO with dirty status and submodule info based on config flags. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_INFO_WITH_STATUS() -> (*Info, error):
    procedure GET_INFO_WITH_STATUS() -> (*Info, error):
      info, err = GET_INFO()
      IF err OR NOT info.IsRepo: RETURN info, err
      # [IMPL-GIT_CLI] Dirty status conditional on config [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
      IF config.ShowDirtyStatus OR config.IncludeDirtyStatus:
        info.IsClean, err = IS_WORKING_DIRECTORY_CLEAN()
        IF err: RETURN info, err
      # [IMPL-GIT_CLI] Submodule info conditional on config [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
      IF config.IncludeSubmodules:
        info.IsSubmodule, err = IS_SUBMODULE()
        IF err: RETURN info, err
        info.Submodules, err = GET_SUBMODULES()
        IF err: RETURN info, err
      RETURN info, nil

    # ── Submodule Operations ────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Submodule detection, listing, and status via git CLI commands. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure IS_SUBMODULE() -> (bool, error):
    procedure IS_SUBMODULE() -> (bool, error):
      IF NOT IS_REPOSITORY(): RETURN false, nil
      out, err = EXECUTE_GIT_COMMAND("rev-parse", "--show-superproject-working-tree")
      IF err: RETURN false, nil
      RETURN TrimSpace(out) != "", nil

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_SUBMODULES() -> ([]SubmoduleInfo, error):
    procedure GET_SUBMODULES() -> ([]SubmoduleInfo, error):
      IF NOT IS_REPOSITORY(): RETURN nil, GitError{Op="submodule listing"}
      out, err = EXECUTE_GIT_COMMAND("submodule", "status", "--recursive")
      IF err: RETURN [], nil  # no submodules
      submodules = []
      FOR line IN split(out, "\n"):
        IF line == "": CONTINUE
        sub, err = PARSE_SUBMODULE_STATUS_LINE(line)
        IF err: CONTINUE  # skip malformed
        submodules.append(sub)
      RETURN submodules, nil

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_SUBMODULE_STATUS(path) -> (string, error):
    procedure GET_SUBMODULE_STATUS(path) -> (string, error):
      IF NOT IS_REPOSITORY(): RETURN "", GitError{Op="submodule status"}
      out, err = EXECUTE_GIT_COMMAND("submodule", "status", path)
      IF err: RETURN "", GitError{Op="submodule status", Err=err}
      IF len(out) == 0: RETURN "unknown", nil
      SWITCH out[0]:
        ' ': RETURN "clean"
        '+': RETURN "dirty"
        '-': RETURN "uninitialized"
        'U': RETURN "conflict"
        default: RETURN "unknown"

    # [IMPL-GIT_CLI] Parses "[status][hash] [path] [(desc)]" format. [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    procedure PARSE_SUBMODULE_STATUS_LINE(line) -> (SubmoduleInfo, error):
      IF len(line) < 2: RETURN error("invalid line")
      status = map line[0] to clean/dirty/uninitialized/conflict/unknown
      parts = Fields(line[1:])
      IF len(parts) < 2: RETURN error("invalid format")
      hash = parts[0]; path = parts[1]
      name = last path component of path
      url = GET_SUBMODULE_URL(path) or ""
      RETURN SubmoduleInfo{name, path, url, hash, status}, nil

    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_SUBMODULE_URL(path) -> (string, error):
    procedure GET_SUBMODULE_URL(path) -> (string, error):
      RETURN EXECUTE_GIT_COMMAND("config", "--file", ".gitmodules", "--get", "submodule."+path+".url")

    # ── Package-Level Convenience Functions ─────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
