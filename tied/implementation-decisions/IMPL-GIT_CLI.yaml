    # Functions: IsGitRepository, GetGitBranch, GetGitShortHash, GetGitInfo, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    #   IsGitWorkingDirectoryClean, GetGitInfoWithStatus, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    #   IsGitSubmodule, GetGitSubmodules, GetGitSubmoduleStatus [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]

    # ── Root Adapter (git.go) ───────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Thin backward-compatibility layer: type alias GitError = git.GitError; [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # each function delegates directly to pkg/git counterpart. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    # Functions: IsGitRepository, GetGitBranch, GetGitShortHash, GetGitInfo, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    #   IsGitWorkingDirectoryClean, GetGitInfoWithStatus, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
    #   IsGitSubmodule, GetGitSubmodules, GetGitSubmoduleStatus [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]
