  code_markers: '`exec.Command("git", ...)` calls, Git command parsing'
  essence_pseudocode: "# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Git CLI integration using exec.Command(\"git\", ...) for repository detection, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# branch/hash extraction, working-directory status, and submodule operations. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Two-layer design: pkg/git implements logic; git.go is a backward-compatible adapter. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n\n# ── Data Structures ─────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Config, Info, SubmoduleInfo, GitError supporting the Repository interface. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA Config:\nDATA Config:\n  Enabled, IncludeInfo,\
    \ ShowDirtyStatus       bool\n  Command, WorkingDirectory                   string\n  RequireCleanRepo, AutoDetectRepo            bool\n  IncludeSubmodules                           bool\n  IncludeBranch, IncludeHash, IncludeStatus   bool\n  CommandTimeout                              string\n  MaxSubmoduleDepth                           int\n  # Legacy compat [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n  IncludeDirtyStatus                          bool\n  GitCommand                                  string\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA Info:\nDATA Info:\n  Branch, Hash  string\n  IsClean       bool\n  IsRepo        bool\n  IsSubmodule   bool\n  Submodules    []SubmoduleInfo\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA SubmoduleInfo:\nDATA SubmoduleInfo:\n  Name, Path, URL, Hash, Status  string\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION]\
    \ [REQ-GIT_INTEGRATION] — Block implements documented behavior for: DATA GitError:\nDATA GitError:\n  Operation  string\n  Err        error\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: INTERFACE Repository:\nINTERFACE Repository:\n  IsRepository() -> bool\n  GetBranch() -> (string, error)\n  GetShortHash() -> (string, error)\n  IsWorkingDirectoryClean() -> (bool, error)\n  GetInfo() -> (*Info, error)\n  GetInfoWithStatus() -> (*Info, error)\n  IsSubmodule() -> (bool, error)\n  GetSubmodules() -> ([]SubmoduleInfo, error)\n  GetSubmoduleStatus(path) -> (string, error)\n\n# ── Core Execution ──────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# All git operations go through executeGitCommand. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\
    \ — Block implements documented behavior for: procedure DEFAULT_CONFIG() -> *Config:\nprocedure DEFAULT_CONFIG() -> *Config:\n  RETURN Config with sensible defaults:\n    Enabled=true, Command=\"git\", WorkingDirectory=\".\",\n    AutoDetectRepo=true, IncludeBranch=true, IncludeHash=true,\n    IncludeStatus=true, CommandTimeout=\"30s\", MaxSubmoduleDepth=3\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure EXECUTE_GIT_COMMAND(args...) -> (string, error):\nprocedure EXECUTE_GIT_COMMAND(args...) -> (string, error):\n  # Resolve git command with legacy fallback [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n  gitCmd = config.Command OR config.GitCommand OR \"git\"\n  cmd = exec.Command(gitCmd, args...)\n  cmd.Dir = config.WorkingDirectory\n  output, err = cmd.Output()\n  IF err: RETURN \"\", GitError{Operation=join(args), Err=err}\n  RETURN TrimSpace(output), nil\n\n# ── Repository Detection ──────────────────────────────────────────\
    \ [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Delegates to git rev-parse --is-inside-work-tree. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure IS_REPOSITORY() -> bool:\nprocedure IS_REPOSITORY() -> bool:\n  out, err = EXECUTE_GIT_COMMAND(\"rev-parse\", \"--is-inside-work-tree\")\n  RETURN err == nil AND out == \"true\"\n\n# ── Branch Extraction ───────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Guards with IS_REPOSITORY check, then extracts branch name. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_BRANCH() -> (string, error):\nprocedure GET_BRANCH() -> (string, error):\n  IF NOT IS_REPOSITORY():\
    \ RETURN \"\", GitError{Op=\"branch detection\", not a repo}\n  RETURN EXECUTE_GIT_COMMAND(\"rev-parse\", \"--abbrev-ref\", \"HEAD\")\n\n# ── Hash Extraction ─────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Guards with IS_REPOSITORY check, then extracts short hash. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_SHORT_HASH() -> (string, error):\nprocedure GET_SHORT_HASH() -> (string, error):\n  IF NOT IS_REPOSITORY(): RETURN \"\", GitError{Op=\"hash extraction\", not a repo}\n  RETURN EXECUTE_GIT_COMMAND(\"rev-parse\", \"--short\", \"HEAD\")\n\n# ── Status Detection ────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Clean when git status --porcelain returns empty output. [IMPL-GIT_CLI]\
    \ [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure IS_WORKING_DIRECTORY_CLEAN() -> (bool, error):\nprocedure IS_WORKING_DIRECTORY_CLEAN() -> (bool, error):\n  IF NOT IS_REPOSITORY(): RETURN false, GitError{Op=\"status check\", not a repo}\n  out, err = EXECUTE_GIT_COMMAND(\"status\", \"--porcelain\")\n  IF err: RETURN false, err\n  RETURN len(out) == 0, nil\n\n# ── Aggregated Info ─────────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Composes IsRepository, GetBranch, GetShortHash into Info. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_INFO() -> (*Info, error):\nprocedure GET_INFO() -> (*Info, error):\n  info = Info{ IsRepo = IS_REPOSITORY() }\n  IF NOT info.IsRepo: RETURN info, nil\n\
    \  info.Branch, err = GET_BRANCH()\n  IF err: RETURN info, err\n  info.Hash, err = GET_SHORT_HASH()\n  IF err: RETURN info, err\n  RETURN info, nil\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Extends GET_INFO with dirty status and submodule info based on config flags. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_INFO_WITH_STATUS() -> (*Info, error):\nprocedure GET_INFO_WITH_STATUS() -> (*Info, error):\n  info, err = GET_INFO()\n  IF err OR NOT info.IsRepo: RETURN info, err\n  # [IMPL-GIT_CLI] Dirty status conditional on config [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n  IF config.ShowDirtyStatus OR config.IncludeDirtyStatus:\n    info.IsClean, err = IS_WORKING_DIRECTORY_CLEAN()\n    IF err: RETURN info, err\n  # [IMPL-GIT_CLI] Submodule info conditional on config [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n  IF config.IncludeSubmodules:\n\
    \    info.IsSubmodule, err = IS_SUBMODULE()\n    IF err: RETURN info, err\n    info.Submodules, err = GET_SUBMODULES()\n    IF err: RETURN info, err\n  RETURN info, nil\n\n# ── Submodule Operations ────────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Submodule detection, listing, and status via git CLI commands. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure IS_SUBMODULE() -> (bool, error):\nprocedure IS_SUBMODULE() -> (bool, error):\n  IF NOT IS_REPOSITORY(): RETURN false, nil\n  out, err = EXECUTE_GIT_COMMAND(\"rev-parse\", \"--show-superproject-working-tree\")\n  IF err: RETURN false, nil\n  RETURN TrimSpace(out) != \"\", nil\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure\
    \ GET_SUBMODULES() -> ([]SubmoduleInfo, error):\nprocedure GET_SUBMODULES() -> ([]SubmoduleInfo, error):\n  IF NOT IS_REPOSITORY(): RETURN nil, GitError{Op=\"submodule listing\"}\n  out, err = EXECUTE_GIT_COMMAND(\"submodule\", \"status\", \"--recursive\")\n  IF err: RETURN [], nil  # no submodules\n  submodules = []\n  FOR line IN split(out, \"\\n\"):\n    IF line == \"\": CONTINUE\n    sub, err = PARSE_SUBMODULE_STATUS_LINE(line)\n    IF err: CONTINUE  # skip malformed\n    submodules.append(sub)\n  RETURN submodules, nil\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_SUBMODULE_STATUS(path) -> (string, error):\nprocedure GET_SUBMODULE_STATUS(path) -> (string, error):\n  IF NOT IS_REPOSITORY(): RETURN \"\", GitError{Op=\"submodule status\"}\n  out, err = EXECUTE_GIT_COMMAND(\"submodule\", \"status\", path)\n  IF err: RETURN \"\", GitError{Op=\"submodule status\", Err=err}\n  IF len(out) == 0: RETURN \"unknown\"\
    , nil\n  SWITCH out[0]:\n    ' ': RETURN \"clean\"\n    '+': RETURN \"dirty\"\n    '-': RETURN \"uninitialized\"\n    'U': RETURN \"conflict\"\n    default: RETURN \"unknown\"\n\n# [IMPL-GIT_CLI] Parses \"[status][hash] [path] [(desc)]\" format. [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\nprocedure PARSE_SUBMODULE_STATUS_LINE(line) -> (SubmoduleInfo, error):\n  IF len(line) < 2: RETURN error(\"invalid line\")\n  status = map line[0] to clean/dirty/uninitialized/conflict/unknown\n  parts = Fields(line[1:])\n  IF len(parts) < 2: RETURN error(\"invalid format\")\n  hash = parts[0]; path = parts[1]\n  name = last path component of path\n  url = GET_SUBMODULE_URL(path) or \"\"\n  RETURN SubmoduleInfo{name, path, url, hash, status}, nil\n\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GET_SUBMODULE_URL(path) -> (string, error):\nprocedure GET_SUBMODULE_URL(path) -> (string, error):\n  RETURN EXECUTE_GIT_COMMAND(\"config\"\
    , \"--file\", \".gitmodules\", \"--get\", \"submodule.\"+path+\".url\")\n\n# ── Package-Level Convenience Functions ─────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Each creates ephemeral Config+Repo, calls the corresponding method, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# and returns simplified results (empty/false on error). [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Functions: IsGitRepository, GetGitBranch, GetGitShortHash, GetGitInfo, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n#   IsGitWorkingDirectoryClean, GetGitInfoWithStatus, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n#   IsGitSubmodule, GetGitSubmodules, GetGitSubmoduleStatus [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n\n# ── Root Adapter (git.go) ───────────────────────────────────────── [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n\
    # [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Thin backward-compatibility layer: type alias GitError = git.GitError; [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# each function delegates directly to pkg/git counterpart. [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n# Functions: IsGitRepository, GetGitBranch, GetGitShortHash, GetGitInfo, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n#   IsGitWorkingDirectoryClean, GetGitInfoWithStatus, [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\n#   IsGitSubmodule, GetGitSubmodules, GetGitSubmoduleStatus [IMPL-GIT_CLI] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]"
