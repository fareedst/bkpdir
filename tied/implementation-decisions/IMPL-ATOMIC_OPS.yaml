      # Removes temp file without committing; prevents committed rollback. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      if committed -> error
      call cleanup()

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.Close() -> error:
    procedure AtomicWriter.Close() -> error:
      # [IMPL-ATOMIC_OPS] — Idempotent close; rolls back if not committed. [ARCH-RESOURCE_MANAGEMENT] [ARCH-TESTING_STRATEGY] [REQ-RESOURCE_MANAGEMENT]
      if already closed -> no-op
      if not committed -> Rollback()
      mark closed=true

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.cleanup() -> error:
    procedure AtomicWriter.cleanup() -> error:
