      return Write([]byte(s))

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.Commit() -> error:
    procedure AtomicWriter.Commit() -> error:
      # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      # Closes temp file then atomically renames to target; cleans up on failure. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      if already committed -> error
      if closed but tempFile not nil -> error (inconsistent state)
      close tempFile
      os.Rename(tempPath, targetPath)   # atomic on same filesystem
      on rename failure -> cleanup temp file
      mark committed=true, closed=true

