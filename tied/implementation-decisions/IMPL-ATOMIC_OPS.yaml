    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure NewAtomicWriter(targetPath) -> (*AtomicWriter, error):
    procedure NewAtomicWriter(targetPath) -> (*AtomicWriter, error):
      # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      # Creates temp file in same dir as target for same-filesystem rename. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      INPUT: targetPath string
      OUTPUT: *AtomicWriter or error
      validate targetPath via ValidatePath
      dir = directory of targetPath
      ensure dir exists (os.MkdirAll)
      create temp file in dir with pattern base+".tmp.*"
      return AtomicWriter{targetPath, tempPath, tempFile, committed=false, closed=false}

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.Write(data) -> (int, error):
    procedure AtomicWriter.Write(data) -> (int, error):
      # [IMPL-ATOMIC_OPS] — Writes bytes to the temp file; guards closed state. [ARCH-RESOURCE_MANAGEMENT] [ARCH-TESTING_STRATEGY] [REQ-RESOURCE_MANAGEMENT]
      if writer is closed -> error
      if tempFile is nil -> error
      delegate to tempFile.Write(data)

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.WriteString(s) -> (int, error):
    procedure AtomicWriter.WriteString(s) -> (int, error):
