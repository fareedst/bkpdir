      close tempFile if open
      remove tempPath (ignore not-exist errors)
      mark closed=true

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicCopy(src, dst) -> error:
    procedure AtomicCopy(src, dst) -> error:
      # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      # Copies a file atomically: validate paths, stream to AtomicWriter, set perms, commit. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      INPUT: src, dst strings
      OUTPUT: error
      validate src readable (ValidateReadable)
      validate dst path (ValidatePath)
      open src
      get src file info for permissions
      create AtomicWriter for dst (defer Close)
      io.Copy from src to writer
      chmod tempPath to match src permissions
      writer.Commit()

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriteFile(filename, data, perm) -> error:
    procedure AtomicWriteFile(filename, data, perm) -> error:
      # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      # Convenience: writes byte slice to file atomically with given permissions. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
      INPUT: filename string, data []byte, perm FileMode
      OUTPUT: error
      create AtomicWriter for filename (defer Close)
      writer.Write(data)
      chmod tempPath to perm
      writer.Commit()

    # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriteString(filename, data, perm) -> error:
    procedure AtomicWriteString(filename, data, perm) -> error:
