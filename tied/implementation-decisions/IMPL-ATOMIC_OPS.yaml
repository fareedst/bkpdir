  essence_pseudocode: "# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n# Atomic file operations: write-to-temp then rename for corruption-safe file I/O. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: TYPE AtomicWriter:\nTYPE AtomicWriter:\n  # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  # Encapsulates temp-file lifecycle for a single atomic write target. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  FIELDS: targetPath, tempPath, tempFile, isCommitted, isClosed\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: INTERFACE AtomicOp:\nINTERFACE AtomicOp:\n  # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  # Contract for atomic write/commit/rollback operations. [IMPL-ATOMIC_OPS]\
    \ [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  Write(data) -> (n, error)\n  WriteString(s) -> (n, error)\n  Commit() -> error\n  Rollback() -> error\n  Close() -> error\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure NewAtomicWriter(targetPath) -> (*AtomicWriter, error):\nprocedure NewAtomicWriter(targetPath) -> (*AtomicWriter, error):\n  # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  # Creates temp file in same dir as target for same-filesystem rename. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  INPUT: targetPath string\n  OUTPUT: *AtomicWriter or error\n  validate targetPath via ValidatePath\n  dir = directory of targetPath\n  ensure dir exists (os.MkdirAll)\n  create temp file in dir with pattern base+\".tmp.*\"\n  return AtomicWriter{targetPath, tempPath, tempFile, committed=false, closed=false}\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT]\
    \ [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.Write(data) -> (int, error):\nprocedure AtomicWriter.Write(data) -> (int, error):\n  # [IMPL-ATOMIC_OPS] — Writes bytes to the temp file; guards closed state. [ARCH-RESOURCE_MANAGEMENT] [ARCH-TESTING_STRATEGY] [REQ-RESOURCE_MANAGEMENT]\n  if writer is closed -> error\n  if tempFile is nil -> error\n  delegate to tempFile.Write(data)\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.WriteString(s) -> (int, error):\nprocedure AtomicWriter.WriteString(s) -> (int, error):\n  # [IMPL-ATOMIC_OPS] — Convenience wrapper converting string to bytes. [ARCH-RESOURCE_MANAGEMENT] [ARCH-TESTING_STRATEGY] [REQ-RESOURCE_MANAGEMENT]\n  return Write([]byte(s))\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.Commit() -> error:\n\
    procedure AtomicWriter.Commit() -> error:\n  # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  # Closes temp file then atomically renames to target; cleans up on failure. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  if already committed -> error\n  if closed but tempFile not nil -> error (inconsistent state)\n  close tempFile\n  os.Rename(tempPath, targetPath)   # atomic on same filesystem\n  on rename failure -> cleanup temp file\n  mark committed=true, closed=true\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.Rollback() -> error:\nprocedure AtomicWriter.Rollback() -> error:\n  # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  # Removes temp file without committing; prevents committed rollback. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  if committed -> error\n  call cleanup()\n\
    \n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.Close() -> error:\nprocedure AtomicWriter.Close() -> error:\n  # [IMPL-ATOMIC_OPS] — Idempotent close; rolls back if not committed. [ARCH-RESOURCE_MANAGEMENT] [ARCH-TESTING_STRATEGY] [REQ-RESOURCE_MANAGEMENT]\n  if already closed -> no-op\n  if not committed -> Rollback()\n  mark closed=true\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriter.cleanup() -> error:\nprocedure AtomicWriter.cleanup() -> error:\n  # [IMPL-ATOMIC_OPS] — Closes temp file handle and removes temp file from disk. [ARCH-RESOURCE_MANAGEMENT] [ARCH-TESTING_STRATEGY] [REQ-RESOURCE_MANAGEMENT]\n  close tempFile if open\n  remove tempPath (ignore not-exist errors)\n  mark closed=true\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented\
    \ behavior for: procedure AtomicCopy(src, dst) -> error:\nprocedure AtomicCopy(src, dst) -> error:\n  # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  # Copies a file atomically: validate paths, stream to AtomicWriter, set perms, commit. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  INPUT: src, dst strings\n  OUTPUT: error\n  validate src readable (ValidateReadable)\n  validate dst path (ValidatePath)\n  open src\n  get src file info for permissions\n  create AtomicWriter for dst (defer Close)\n  io.Copy from src to writer\n  chmod tempPath to match src permissions\n  writer.Commit()\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriteFile(filename, data, perm) -> error:\nprocedure AtomicWriteFile(filename, data, perm) -> error:\n  # [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  # Convenience: writes byte slice to\
    \ file atomically with given permissions. [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n  INPUT: filename string, data []byte, perm FileMode\n  OUTPUT: error\n  create AtomicWriter for filename (defer Close)\n  writer.Write(data)\n  chmod tempPath to perm\n  writer.Commit()\n\n# [IMPL-ATOMIC_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: procedure AtomicWriteString(filename, data, perm) -> error:\nprocedure AtomicWriteString(filename, data, perm) -> error:\n  # [IMPL-ATOMIC_OPS] — Convenience: converts string and delegates to AtomicWriteFile. [ARCH-RESOURCE_MANAGEMENT] [ARCH-TESTING_STRATEGY] [REQ-RESOURCE_MANAGEMENT]\n  return AtomicWriteFile(filename, []byte(data), perm)"
