    created:
      date: '2026-03-12'
      author: AI Agent
    last_updated:
      date: '2026-03-12'
      author: AI agent
      reason: Enriched pseudo-code, populated code_locations and traceability.tests per PROC-IMPL_CODE_TEST_SYNC
  essence_pseudocode: "# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Configurable -dirty suffix via show_git_dirty_status boolean\n\nstruct Config (relevant fields):\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] Boolean option controlling dirty suffix\n  ShowGitDirtyStatus bool  yaml:\"show_git_dirty_status\"  # default: true\n\n# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: struct ArchiveConfig (relevant fields):\nstruct ArchiveConfig (relevant fields):\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] Propagated from Config for archive naming\n  ShowGitDirtyStatus bool\n\n# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure generateFullArchiveNameFromConfig(cfg):\nprocedure generateFullArchiveNameFromConfig(cfg):\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION]\
    \ Conditionally append -dirty based on config\n  name = build prefix + timestamp\n  if cfg.IsGit and cfg.GitBranch != \"\" and cfg.GitHash != \"\":\n    name += \"=\" + cfg.GitBranch + \"=\" + cfg.GitHash\n    if not cfg.GitIsClean and cfg.ShowGitDirtyStatus:\n      name += \"-dirty\"    # Only if ShowGitDirtyStatus is true\n  if cfg.Note != \"\": name += \"=\" + cfg.Note\n  return name + \".zip\"\n\n# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure generateIncrementalArchiveName(cfg):\nprocedure generateIncrementalArchiveName(cfg):\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] Same conditional dirty for incremental names\n  name = baseName + \"_update=\" + timestamp\n  if cfg.IsGit and cfg.GitBranch != \"\" and cfg.GitHash != \"\":\n    name += \"=\" + cfg.GitBranch + \"=\" + cfg.GitHash\n    if not cfg.GitIsClean and cfg.ShowGitDirtyStatus:\n      name += \"-dirty\"\n  if cfg.Note\
    \ != \"\": name += \"=\" + cfg.Note\n  return name + \".zip\"\n\n# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure GenerateFullArchiveName(cfg, cwd, note):\nprocedure GenerateFullArchiveName(cfg, cwd, note):\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] Propagate ShowGitDirtyStatus from Config to ArchiveConfig\n  archiveConfig = ArchiveConfig{Prefix: basename(cwd), Timestamp: now(), Note: note}\n  archiveConfig.ShowGitDirtyStatus = cfg.ShowGitDirtyStatus   # propagate setting\n  if cfg.IncludeGitInfo and IsGitRepository(cwd):\n    branch, hash, isClean = GetGitInfoWithStatus(cwd)\n    archiveConfig.IsGit = true; set branch, hash, isClean\n  return GenerateArchiveName(archiveConfig)\n\n# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure mergeBasicSettings(dst, src, inheritContext, ...):\nprocedure mergeBasicSettings(dst,\
    \ src, inheritContext, ...):\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] Merge show_git_dirty_status respecting CFG-001 precedence\n  if inheritContext:\n    if explicitlySetInSrc(\"show_git_dirty_status\"):\n      dst.ShowGitDirtyStatus = src.ShowGitDirtyStatus\n    elif src.ShowGitDirtyStatus != default:\n      dst.ShowGitDirtyStatus = src.ShowGitDirtyStatus\n  else:\n    if not explicitlySetByEarlier and explicitlySetInSrc and src differs from default:\n      dst.ShowGitDirtyStatus = src.ShowGitDirtyStatus\n\n# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: procedure mergeGitSettings(dst, src, inheritContext, ...):\nprocedure mergeGitSettings(dst, src, inheritContext, ...):\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] Keep legacy ShowGitDirtyStatus in sync with Git.ShowDirtyStatus\n  if inheritContext:\n    if not explicitlySetByEarlier(\"show_git_dirty_status\"\
    ):\n      if explicitlySetInSrc or src differs from defaultGit:\n        dst.Git.ShowDirtyStatus = src.ShowGitDirtyStatus\n        dst.ShowGitDirtyStatus = src.ShowGitDirtyStatus   # keep legacy in sync\n  else:\n    if not explicitlySetByEarlier and explicitlySetInSrc and src differs from defaultGit:\n      dst.Git.ShowDirtyStatus = src.ShowGitDirtyStatus\n      dst.ShowGitDirtyStatus = src.ShowGitDirtyStatus\n\n# [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] — Block implements documented behavior for: adapter ConfigToArchiveConfigAdapter:\nadapter ConfigToArchiveConfigAdapter:\n  # [IMPL-GIT_DIRTY_CONFIG] [ARCH-GIT_INTEGRATION] [REQ-GIT_INTEGRATION] Expose ShowGitDirtyStatus via interface\n  GetShowGitDirtyStatus(): return cfg.ShowGitDirtyStatus"
