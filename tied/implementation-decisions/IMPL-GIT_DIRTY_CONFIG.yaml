  name: Configurable Git Dirty Status
  rationale:
    benefits:
      - Configurable via show_git_dirty_status boolean option
      - Defaults to true for backward compatibility
      - Users can enable/disable dirty status indicator
    problems_solved:
      - Forced -dirty suffix in archive names with no way to disable
      - Users who do not want Git dirty status in archive naming
    why: Users need control over whether the -dirty suffix appears in archive names based on Git working tree status
