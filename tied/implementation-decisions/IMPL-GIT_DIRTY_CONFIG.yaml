IMPL-GIT_DIRTY_CONFIG:
  name: Configurable Git Dirty Status
  status: Active
  description: Make the Git dirty status indicator (-dirty suffix) configurable through the configuration system, allowing users to enable/disable this feature via show_git_dirty_status boolean option
  rationale:
    why: Users need control over whether the -dirty suffix appears in archive names based on Git working tree status
    problems_solved:
    - Forced -dirty suffix in archive names with no way to disable
    - Users who do not want Git dirty status in archive naming
    benefits:
    - Configurable via show_git_dirty_status boolean option
    - Defaults to true for backward compatibility
    - Users can enable/disable dirty status indicator
  implementation_approach:
    summary: Add show_git_dirty_status boolean option to Config struct with proper merging and conditional dirty suffix logic
    details:
    - Added show_git_dirty_status boolean option to Config struct
    - Default to true for backward compatibility
    - Updated Git status detection to respect configuration
    - Modified archive naming functions to check the option before adding -dirty suffix
    - Added proper merging of the new option in mergeBasicSettings
  cross_references:
  - ARCH-GIT_INTEGRATION
  - REQ-GIT_INTEGRATION
  code_locations:
    files:
    - path: config.go
    - path: archive.go
    - path: archive_test.go
    functions:
    - mergeBasicSettings
    - mergeGitSettings
    - generateIncrementalArchiveName
    - generateFullArchiveNameFromConfig
    - GenerateFullArchiveName
    - generateFullArchiveName
    - ConfigToArchiveConfigAdapter.GetShowGitDirtyStatus
  traceability:
    architecture:
    - ARCH-GIT_INTEGRATION
    requirements:
    - REQ-GIT_INTEGRATION
    tests:
    - TestGenerateArchiveName/archive_with_dirty_git_status
    - TestGenerateArchiveName/incremental_archive_with_git_dirty_status
    code_annotations:
    - IMPL-GIT_DIRTY_CONFIG
    - ARCH-GIT_INTEGRATION
    - REQ-GIT_INTEGRATION
  related_decisions:
    depends_on: []
    supersedes: []
    see_also:
    - IMPL-GIT_CLI
    composed_with: []
