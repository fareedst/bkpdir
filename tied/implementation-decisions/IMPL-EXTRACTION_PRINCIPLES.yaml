  essence_pseudocode: "# [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n# Package extraction follows strict dependency-order layering to prevent [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n# circular dependencies and ensure each layer builds on a stable foundation. [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n\n# [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: DATA extraction_layers:\nDATA extraction_layers:\n  # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # Ordered layers define the extraction sequence; each layer depends only [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # on layers above it (lower number = extracted first). [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  layer_1_infrastructure:\n    packages: [config, errors]\n\
    \    dependencies: none (only Go stdlib)\n    rationale: \"Foundation types and error handling needed by all other layers\"\n  layer_2_utilities:\n    packages: [formatter, git, fileops]\n    dependencies: [layer_1_infrastructure]\n    rationale: \"Stateless utilities that consume config/errors but not each other\"\n  layer_3_framework:\n    packages: [cli]\n    dependencies: [layer_1_infrastructure, layer_2_utilities]\n    rationale: \"CLI framework wires utilities together; depends on both lower layers\"\n  layer_4_patterns:\n    packages: [processing, resources]\n    dependencies: [layer_1_infrastructure, layer_2_utilities]\n    rationale: \"Reusable processing patterns composed from utilities\"\n\n# [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE plan_extraction_order():\nPROCEDURE plan_extraction_order():\n  # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # Extract\
    \ packages in dependency order so each extracted package can be [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # independently compiled and tested. [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  FOR layer in extraction_layers (ascending order):\n    FOR package in layer.packages:\n      VALIDATE package has no dependencies outside its declared layer deps\n      VALIDATE package exposes interfaces, not concrete types, at boundaries\n      schedule package for extraction\n    END FOR\n  END FOR\n\n# [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: VALIDATE no_circular_dependencies():\nVALIDATE no_circular_dependencies():\n  # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # Circular dependency prevention is the primary design constraint. [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  build\
    \ import_graph from all packages\n  CHECK no cycles exist in import_graph\n  CHECK each package only imports from its declared dependency layers\n  REPORT violations with import chain details"
