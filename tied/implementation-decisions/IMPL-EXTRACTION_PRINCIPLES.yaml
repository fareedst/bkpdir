  decision: Extract in dependency order - core utilities first, then higher-level components
  design_note: Each layer builds on previous layers without circular references
  essence_pseudocode: |-
    # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
    # Package extraction follows strict dependency-order layering to prevent [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
    # circular dependencies and ensure each layer builds on a stable foundation. [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]

    # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: DATA extraction_layers:
    DATA extraction_layers:
      # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      # Ordered layers define the extraction sequence; each layer depends only [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      # on layers above it (lower number = extracted first). [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      layer_1_infrastructure:
        packages: [config, errors]
        dependencies: none (only Go stdlib)
        rationale: "Foundation types and error handling needed by all other layers"
      layer_2_utilities:
        packages: [formatter, git, fileops]
        dependencies: [layer_1_infrastructure]
        rationale: "Stateless utilities that consume config/errors but not each other"
      layer_3_framework:
        packages: [cli]
        dependencies: [layer_1_infrastructure, layer_2_utilities]
        rationale: "CLI framework wires utilities together; depends on both lower layers"
      layer_4_patterns:
        packages: [processing, resources]
        dependencies: [layer_1_infrastructure, layer_2_utilities]
        rationale: "Reusable processing patterns composed from utilities"

    # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE plan_extraction_order():
    PROCEDURE plan_extraction_order():
      # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      # Extract packages in dependency order so each extracted package can be [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      # independently compiled and tested. [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      FOR layer in extraction_layers (ascending order):
        FOR package in layer.packages:
          VALIDATE package has no dependencies outside its declared layer deps
          VALIDATE package exposes interfaces, not concrete types, at boundaries
          schedule package for extraction
        END FOR
      END FOR

    # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: VALIDATE no_circular_dependencies():
    VALIDATE no_circular_dependencies():
      # [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      # Circular dependency prevention is the primary design constraint. [IMPL-EXTRACTION_PRINCIPLES] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]
      build import_graph from all packages
      CHECK no cycles exist in import_graph
      CHECK each package only imports from its declared dependency layers
      REPORT violations with import chain details
