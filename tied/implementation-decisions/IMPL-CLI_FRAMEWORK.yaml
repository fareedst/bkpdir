  essence_pseudocode: |-
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Builder pattern with manager interfaces for CLI construction

    # --- Interface definitions (types.go) ---
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Define manager interfaces for testability and composition
    interface CommandBuilder:
      NewCommand(name, short, long) -> *cobra.Command
      WithHandler(cmd, handler) -> *cobra.Command
      WithFlags(cmd, flags[]) -> *cobra.Command
      WithSubcommands(parent, children...) -> *cobra.Command

    interface RootCommandBuilder:
      NewRootCommand(info AppInfo) -> *cobra.Command
      WithVersionTemplate(cmd, template) -> *cobra.Command
      WithGlobalFlags(cmd, flagMgr) -> *cobra.Command
      WithExampleUsage(cmd, examples) -> *cobra.Command

    interface FlagManager:
      AddGlobalFlags(cmd) -> error
      AddDryRunFlag(cmd, target) -> error
      AddNoteFlag(cmd, target) -> error
      AddConfigFlag(cmd, target) -> error

    interface ContextManager:
      Create(parent) -> (ctx, cancel)
      WithTimeout(parent, timeout) -> (ctx, cancel)
      HandleSignals(cancel)

    interface DryRunManager:
      Execute(ctx CommandContext, op DryRunOperation) -> error
      Log(ctx CommandContext, message)

    interface VersionManager:
      FormatVersion(info) -> string
      CreateVersionCommand(info) -> *cobra.Command
      CreateVersionTemplate(info) -> string

    # --- Builder implementation (builder.go) ---
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Command building via fluent builder pattern
    procedure NewCommandBuilder(flagMgr):
      # Creates DefaultCommandBuilder wrapping a FlagManager
      if flagMgr is nil: flagMgr = NewFlagManager()
      return DefaultCommandBuilder{flagManager: flagMgr}

    procedure DefaultCommandBuilder.NewCommand(name, short, long):
      # Wraps cobra.Command creation
      return &cobra.Command{Use: name, Short: short, Long: long}

    procedure DefaultCommandBuilder.WithHandler(cmd, handler):
      cmd.RunE = handler
      return cmd

    procedure DefaultCommandBuilder.WithSubcommands(parent, children...):
      for each child in children: parent.AddCommand(child)
      return parent

    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Root command building with version and global flags
    procedure NewRootCommandBuilder(flagMgr, versionMgr):
      if flagMgr is nil: flagMgr = NewFlagManager()
      if versionMgr is nil: versionMgr = NewVersionManager()
      return DefaultRootCommandBuilder{flagManager: flagMgr, versionManager: versionMgr}

    procedure DefaultRootCommandBuilder.NewRootCommand(info):
      cmd = &cobra.Command{Use: info.Name, Short: info.Short, Long: info.Long}
      cmd.Version = versionManager.FormatVersion(info.Build)
      cmd.SetVersionTemplate(versionManager.CreateVersionTemplate(info.Build))
      cmd.Run = show help if no subcommand
      return cmd

    procedure DefaultRootCommandBuilder.BuildCommand(template):
      cmd = &cobra.Command from template fields (Name, Short, Long, Example)
      if template.Handler: cmd.RunE = template.Handler
      if template.PreRun: cmd.PreRunE = template.PreRun
      if template.PostRun: cmd.PostRunE = template.PostRun
      flagMgr.AddFlags(cmd, template.FlagSet)
      for each subcmd in template.Subcommands: cmd.AddCommand(subcmd)
      return cmd

    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] CLIApp orchestrates all managers
    procedure NewCLIApp(info):
      versionMgr = NewVersionManager()
      flagMgr = NewFlagManager()
      rootBuilder = NewRootCommandBuilder(flagMgr, versionMgr)
      commandBuilder = NewCommandBuilder(flagMgr)
      contextMgr = NewContextManager()
      dryRunMgr = NewDryRunManager()
      rootCmd = rootBuilder.NewRootCommand(info)
      return CLIApp{all managers + rootCmd}

    procedure CLIApp.Execute():
      return rootCommand.Execute()

    procedure CLIApp.ExecuteWithContext():
      ctx, cancel = WithSignalHandling(nil)
      defer cancel()
      rootCommand.SetContext(ctx)
      if err = rootCommand.Execute(): print err, exit(1)

    # --- Flag management (flags.go) ---
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Consistent flag registration across commands
    procedure DefaultFlagManager.AddGlobalFlags(cmd):
      cmd.PersistentFlags: --help, --verbose

    procedure DefaultFlagManager.AddDryRunFlag(cmd, target):
      cmd.PersistentFlags: --dry-run / -d -> target

    procedure DefaultFlagManager.AddNoteFlag(cmd, target):
      cmd.Flags: --note / -n -> target

    procedure DefaultFlagManager.AddFlags(cmd, flagSet):
      conditionally add DryRun, Note, Config, Incremental, List flags from FlagSet

    # --- Context management (context.go) ---
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] [REQ-CONTEXT_SUPPORT] Context lifecycle with signal handling
    procedure DefaultContextManager.Create(parent):
      if parent is nil: parent = context.Background()
      return context.WithCancel(parent)

    procedure DefaultContextManager.WithTimeout(parent, timeout):
      parse duration from timeout string
      if parse error: return WithCancel (no timeout)
      return context.WithTimeout(parent, duration)

    procedure DefaultContextManager.HandleSignals(cancel):
      listen for SIGINT, SIGTERM on goroutine
      on signal: call cancel()

    procedure WithSignalHandling(parent):
      ctx, cancel = context.WithCancel(parent)
      goroutine: select on sigChan or ctx.Done
      return ctx, cancel

    # --- Dry-run support (dryrun.go) ---
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Dry-run mode for safe operation preview
    procedure DefaultDryRunManager.Execute(ctx, op):
      if ctx.DryRun: log(op.Describe()), return nil
      else: return op.Execute(ctx)

    procedure DefaultDryRunManager.Log(ctx, message):
      fprintf(ctx.Output, "[DRY-RUN] %s", message)

    # --- Version management (version.go) ---
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Version display and formatting
    procedure DefaultVersionManager.FormatVersion(info):
      return "{version} (compiled {date}) [{platform}]"

    procedure DefaultVersionManager.CreateVersionCommand(info):
      return cobra.Command{Use: "version", Run: print FormatVersion(info)}

    procedure DefaultVersionManager.CreateVersionTemplate(info):
      return "version {version} (compiled {date}) [{platform}]\n"

    # --- main.go command registration ---
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] [REQ-IMMUTABLE_CLI_COMMANDS] Register all commands on root
    procedure main():
      create rootCmd with Use, Short, Long, Version
      set version template
      add persistent flags: --dry-run, --config, --list, --limit, --debug
      rootCmd.AddCommand(createCmd, configCmd, templateCmd)
      rootCmd.AddCommand(fullCmd, incCmd)
      rootCmd.AddCommand(listCmd, diffCmd, backupCmd, versionCmd)
      executeWithAutoDetection(rootCmd)
