  dryrunmanager: "```go\ntype DryRunManager interface {\n    Execute(ctx CommandContext, op DryRunOperation) error\n    Log(ctx CommandContext, message string)\n}\n```"
  flagmanager: "```go\ntype FlagManager interface {\n    AddGlobalFlags(cmd *cobra.Command) error\n    AddDryRunFlag(cmd *cobra.Command, target *bool) error\n    AddNoteFlag(cmd *cobra.Command, target *string) error\n    AddConfigFlag(cmd *cobra.Command, target *bool) error\n}\n```"
  essence_pseudocode: "# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Builder pattern with manager interfaces for CLI construction\n\n# --- Interface definitions (types.go) --- [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Define manager interfaces for testability and composition\ninterface CommandBuilder:\n  NewCommand(name, short, long) -> *cobra.Command\n  WithHandler(cmd, handler) -> *cobra.Command\n  WithFlags(cmd, flags[]) -> *cobra.Command\n  WithSubcommands(parent, children...) -> *cobra.Command\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: interface RootCommandBuilder:\ninterface RootCommandBuilder:\n  NewRootCommand(info AppInfo) -> *cobra.Command\n  WithVersionTemplate(cmd, template) -> *cobra.Command\n  WithGlobalFlags(cmd, flagMgr) -> *cobra.Command\n  WithExampleUsage(cmd, examples) -> *cobra.Command\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK]\
    \ [REQ-USABILITY] — Block implements documented behavior for: interface FlagManager:\ninterface FlagManager:\n  AddGlobalFlags(cmd) -> error\n  AddDryRunFlag(cmd, target) -> error\n  AddNoteFlag(cmd, target) -> error\n  AddConfigFlag(cmd, target) -> error\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: interface ContextManager:\ninterface ContextManager:\n  Create(parent) -> (ctx, cancel)\n  WithTimeout(parent, timeout) -> (ctx, cancel)\n  HandleSignals(cancel)\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: interface DryRunManager:\ninterface DryRunManager:\n  Execute(ctx CommandContext, op DryRunOperation) -> error\n  Log(ctx CommandContext, message)\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: interface VersionManager:\ninterface VersionManager:\n  FormatVersion(info) -> string\n  CreateVersionCommand(info)\
    \ -> *cobra.Command\n  CreateVersionTemplate(info) -> string\n\n# --- Builder implementation (builder.go) --- [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Command building via fluent builder pattern\nprocedure NewCommandBuilder(flagMgr):\n  # Creates DefaultCommandBuilder wrapping a FlagManager [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n  if flagMgr is nil: flagMgr = NewFlagManager()\n  return DefaultCommandBuilder{flagManager: flagMgr}\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultCommandBuilder.NewCommand(name, short, long):\nprocedure DefaultCommandBuilder.NewCommand(name, short, long):\n  # Wraps cobra.Command creation [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n  return &cobra.Command{Use: name, Short: short, Long: long}\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements\
    \ documented behavior for: procedure DefaultCommandBuilder.WithHandler(cmd, handler):\nprocedure DefaultCommandBuilder.WithHandler(cmd, handler):\n  cmd.RunE = handler\n  return cmd\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultCommandBuilder.WithSubcommands(parent, children...):\nprocedure DefaultCommandBuilder.WithSubcommands(parent, children...):\n  for each child in children: parent.AddCommand(child)\n  return parent\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Root command building with version and global flags\nprocedure NewRootCommandBuilder(flagMgr, versionMgr):\n  if flagMgr is nil: flagMgr = NewFlagManager()\n  if versionMgr is nil: versionMgr = NewVersionManager()\n  return DefaultRootCommandBuilder{flagManager: flagMgr, versionManager: versionMgr}\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultRootCommandBuilder.NewRootCommand(info):\n\
    procedure DefaultRootCommandBuilder.NewRootCommand(info):\n  cmd = &cobra.Command{Use: info.Name, Short: info.Short, Long: info.Long}\n  cmd.Version = versionManager.FormatVersion(info.Build)\n  cmd.SetVersionTemplate(versionManager.CreateVersionTemplate(info.Build))\n  cmd.Run = show help if no subcommand\n  return cmd\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultRootCommandBuilder.BuildCommand(template):\nprocedure DefaultRootCommandBuilder.BuildCommand(template):\n  cmd = &cobra.Command from template fields (Name, Short, Long, Example)\n  if template.Handler: cmd.RunE = template.Handler\n  if template.PreRun: cmd.PreRunE = template.PreRun\n  if template.PostRun: cmd.PostRunE = template.PostRun\n  flagMgr.AddFlags(cmd, template.FlagSet)\n  for each subcmd in template.Subcommands: cmd.AddCommand(subcmd)\n  return cmd\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] CLIApp orchestrates all managers\n\
    procedure NewCLIApp(info):\n  versionMgr = NewVersionManager()\n  flagMgr = NewFlagManager()\n  rootBuilder = NewRootCommandBuilder(flagMgr, versionMgr)\n  commandBuilder = NewCommandBuilder(flagMgr)\n  contextMgr = NewContextManager()\n  dryRunMgr = NewDryRunManager()\n  rootCmd = rootBuilder.NewRootCommand(info)\n  return CLIApp{all managers + rootCmd}\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure CLIApp.Execute():\nprocedure CLIApp.Execute():\n  return rootCommand.Execute()\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure CLIApp.ExecuteWithContext():\nprocedure CLIApp.ExecuteWithContext():\n  ctx, cancel = WithSignalHandling(nil)\n  defer cancel()\n  rootCommand.SetContext(ctx)\n  if err = rootCommand.Execute(): print err, exit(1)\n\n# --- Flag management (flags.go) --- [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n# [IMPL-CLI_FRAMEWORK]\
    \ [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Consistent flag registration across commands\nprocedure DefaultFlagManager.AddGlobalFlags(cmd):\n  cmd.PersistentFlags: --help, --verbose\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultFlagManager.AddDryRunFlag(cmd, target):\nprocedure DefaultFlagManager.AddDryRunFlag(cmd, target):\n  cmd.PersistentFlags: --dry-run / -d -> target\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultFlagManager.AddNoteFlag(cmd, target):\nprocedure DefaultFlagManager.AddNoteFlag(cmd, target):\n  cmd.Flags: --note / -n -> target\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultFlagManager.AddFlags(cmd, flagSet):\nprocedure DefaultFlagManager.AddFlags(cmd, flagSet):\n  conditionally add DryRun, Note, Config, Incremental, List flags from FlagSet\n\n\
    # --- Context management (context.go) --- [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] [REQ-CONTEXT_SUPPORT] Context lifecycle with signal handling\nprocedure DefaultContextManager.Create(parent):\n  if parent is nil: parent = context.Background()\n  return context.WithCancel(parent)\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultContextManager.WithTimeout(parent, timeout):\nprocedure DefaultContextManager.WithTimeout(parent, timeout):\n  parse duration from timeout string\n  if parse error: return WithCancel (no timeout)\n  return context.WithTimeout(parent, duration)\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultContextManager.HandleSignals(cancel):\nprocedure DefaultContextManager.HandleSignals(cancel):\n  listen for SIGINT, SIGTERM on goroutine\n  on signal:\
    \ call cancel()\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure WithSignalHandling(parent):\nprocedure WithSignalHandling(parent):\n  ctx, cancel = context.WithCancel(parent)\n  goroutine: select on sigChan or ctx.Done\n  return ctx, cancel\n\n# --- Dry-run support (dryrun.go) --- [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Dry-run mode for safe operation preview\nprocedure DefaultDryRunManager.Execute(ctx, op):\n  if ctx.DryRun: log(op.Describe()), return nil\n  else: return op.Execute(ctx)\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultDryRunManager.Log(ctx, message):\nprocedure DefaultDryRunManager.Log(ctx, message):\n  fprintf(ctx.Output, \"[DRY-RUN] %s\", message)\n\n# --- Version management (version.go) --- [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n\
    # [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] Version display and formatting\nprocedure DefaultVersionManager.FormatVersion(info):\n  return \"{version} (compiled {date}) [{platform}]\"\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultVersionManager.CreateVersionCommand(info):\nprocedure DefaultVersionManager.CreateVersionCommand(info):\n  return cobra.Command{Use: \"version\", Run: print FormatVersion(info)}\n\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] — Block implements documented behavior for: procedure DefaultVersionManager.CreateVersionTemplate(info):\nprocedure DefaultVersionManager.CreateVersionTemplate(info):\n  return \"version {version} (compiled {date}) [{platform}]\\n\"\n\n# --- main.go command registration --- [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY]\n# [IMPL-CLI_FRAMEWORK] [ARCH-CLI_FRAMEWORK] [REQ-USABILITY] [REQ-IMMUTABLE_CLI_COMMANDS] Register all\
    \ commands on root\nprocedure main():\n  create rootCmd with Use, Short, Long, Version\n  set version template\n  add persistent flags: --dry-run, --config, --list, --limit, --debug\n  rootCmd.AddCommand(createCmd, configCmd, templateCmd)\n  rootCmd.AddCommand(fullCmd, incCmd)\n  rootCmd.AddCommand(listCmd, diffCmd, backupCmd, versionCmd)\n  executeWithAutoDetection(rootCmd)"
