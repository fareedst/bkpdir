    \ [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY]\nVALIDATE_NAMING(symbol):\n  IF symbol.exported: ASSERT symbol.name matches PascalCase\n  ELSE: ASSERT symbol.name matches camelCase\n  RETURN pass/fail\n\n# [IMPL-CODE_STYLE] — How formatting is enforced. [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY]\nVALIDATE_FORMATTING(file):\n  RUN go fmt on file\n  RUN revive on file\n  RETURN lint results\n\n# [IMPL-CODE_STYLE] — How documentation coverage is enforced. [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY]\nVALIDATE_DOCUMENTATION(package):\n  FOR EACH exported symbol in package:\n    ASSERT doc comment exists\n  ASSERT package-level comment exists\n  RETURN pass/fail"
