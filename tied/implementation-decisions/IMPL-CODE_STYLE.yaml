IMPL-CODE_STYLE:
  code_locations:
    files: []
    functions: []
  cross_references: []
  documentation:
    - Examples in test files
    - Exported function documentation
    - Inline comments for complex logic
    - Package-level documentation
  essence_pseudocode: |-
    # [IMPL-CODE_STYLE] — Go code style and convention rules applied across the project. [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY]

    DATA NAMING_RULES:
      exported: PascalCase
      unexported: camelCase
      acronyms: preserve case (e.g. HTTPServer, xmlParser)

    # [IMPL-CODE_STYLE] [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY] — Block implements documented behavior for: DATA FORMATTING_RULES:
    DATA FORMATTING_RULES:
      formatter: go fmt
      linter: revive
      standard: Go standard formatting

    # [IMPL-CODE_STYLE] [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY] — Block implements documented behavior for: DATA DOCUMENTATION_RULES:
    DATA DOCUMENTATION_RULES:
      package_level: every package has a doc.go or package-level comment
      exported_symbols: every exported type, function, and method has a doc comment
      complex_logic: inline comments for non-obvious logic only
      examples: test files contain usage examples

    # [IMPL-CODE_STYLE] — How naming conventions are enforced. [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY]
    VALIDATE_NAMING(symbol):
      IF symbol.exported: ASSERT symbol.name matches PascalCase
      ELSE: ASSERT symbol.name matches camelCase
      RETURN pass/fail

    # [IMPL-CODE_STYLE] — How formatting is enforced. [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY]
    VALIDATE_FORMATTING(file):
      RUN go fmt on file
      RUN revive on file
      RETURN lint results

    # [IMPL-CODE_STYLE] — How documentation coverage is enforced. [ARCH-SYSTEM_COMPONENTS] [REQ-MAINTAINABILITY]
    VALIDATE_DOCUMENTATION(package):
      FOR EACH exported symbol in package:
        ASSERT doc comment exists
      ASSERT package-level comment exists
      RETURN pass/fail
  formatting:
    - Follow Go standard formatting
    - Use `go fmt` for code formatting
    - Use `revive` linter for code quality
