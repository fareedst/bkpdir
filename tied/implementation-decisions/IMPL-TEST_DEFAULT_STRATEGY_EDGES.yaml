  essence_pseudocode: "# [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY] [REQ-CONFIGURATION] [REQ-CFG_005] — Tests default strategy (= prefix) edge cases: only applies when destination is zero value\n\nprocedure TestDefaultStrategyEdgeCases():\n  # [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY] [REQ-CONFIGURATION] [REQ-CFG_005] — validates default strategy semantics with isZeroValue check\n  save BKPDIR_CONFIG env; defer restore\n  create temp dir\n\n  subtest \"default strategy when field is zero value\":\n    # [REQ-CFG_005] — verifies =archive_dir_path applies when destination is \"\" (zero value) [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY]\n    create file1-zero.yml with archive_dir_path: \"\" (zero value)\n    create file2-default.yml with \"=archive_dir_path\": \"/custom/path\"\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.ArchiveDirPath == \"/custom/path\" (default strategy applied)\n\n  subtest \"default strategy when\
    \ field is non-zero\":\n    # [REQ-CFG_005] — verifies =archive_dir_path does NOT apply when destination has a value [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY]\n    create file1-nonzero.yml with archive_dir_path: \"/existing/path\"\n    create file2-default-nonzero.yml with \"=archive_dir_path\": \"/custom/path\"\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.ArchiveDirPath == \"/existing/path\" (first file preserved, default ignored)\n\n  subtest \"default strategy when field equals default\":\n    # [REQ-CFG_005] — verifies =archive_dir_path does NOT apply even when value equals default (not zero value) [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY]\n    create file1-equals-default.yml with archive_dir_path: \"../.bkpdir\"\n    create file2-default-equals.yml with \"=archive_dir_path\": \"/custom/path\"\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.ArchiveDirPath == \"../.bkpdir\" (equals default but not zero\
    \ → default strategy ignored)\n\n  subtest \"default strategy with array field - zero value\":\n    # [REQ-CFG_005] — verifies empty array merges with defaults first (CFG-005), making destination non-zero before default strategy evaluation [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY]\n    create file1-array-zero.yml with exclude_patterns: [] (empty)\n    create file2-array-default.yml with \"=exclude_patterns\": [\"custom1\", \"custom2\"]\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.ExcludePatterns == [\".git/\", \"vendor/\"] (defaults merged first → non-zero → default strategy NOT applied)\n\n  subtest \"default strategy with array field - non-zero\":\n    # [REQ-CFG_005] — verifies default strategy does NOT apply when array has values [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY]\n    create file1-array-nonzero.yml with exclude_patterns: [\"existing1\", \"existing2\"]\n    create file2-array-default-nonzero.yml with \"=exclude_patterns\"\
    : [\"custom1\", \"custom2\"]\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.ExcludePatterns == [\".git/\", \"vendor/\", \"existing1\", \"existing2\"] (default strategy ignored)\n\n  subtest \"default strategy with bool field - zero value\":\n    # [REQ-CFG_005] — verifies =include_git_info applies when destination is false (zero value for bool) [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY]\n    create file1-bool-zero.yml with include_git_info: false\n    create file2-bool-default.yml with \"=include_git_info\": true\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.IncludeGitInfo == true (default strategy applied)\n\n  subtest \"default strategy with bool field - non-zero\":\n    # [REQ-CFG_005] — verifies =include_git_info does NOT apply when destination is true (non-zero for bool) [IMPL-TEST_DEFAULT_STRATEGY_EDGES] [ARCH-TESTING_STRATEGY]\n    create file1-bool-nonzero.yml with include_git_info: true\n    create file2-bool-default-nonzero.yml\
    \ with \"=include_git_info\": false\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.IncludeGitInfo == true (first file preserved, default strategy ignored)\n  end"
