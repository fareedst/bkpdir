  essence_pseudocode: "# [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n# Pre-extraction preparation: interface definition, large file decomposition, [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n# dependency analysis, and comprehensive testing before any code moves. [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n\n# [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE define_interfaces_before_extraction():\nPROCEDURE define_interfaces_before_extraction():\n  # [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # Interfaces must exist before extraction so packages depend on abstractions. [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  FOR each component targeted for extraction:\n    identify all inbound dependencies (what calls this component)\n    identify all outbound dependencies (what this component calls)\n\
    \    define interface for each dependency boundary\n    replace direct struct usage with interface usage at call sites\n  END FOR\n  VALIDATE no concrete type crosses a package boundary\n\n# [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE decompose_large_files():\nPROCEDURE decompose_large_files():\n  # [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # Large files with mixed concerns must be split before extraction to [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # establish clear boundaries. [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  FOR each source_file exceeding complexity threshold:\n    identify distinct responsibilities within the file\n    split into focused files (one responsibility per file)\n    preserve package-level API (no external behavior change)\n    update internal imports within the package\n  END FOR\n\n# [IMPL-REFACTOR_PREP]\
    \ [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: PROCEDURE analyze_and_cleanup_dependencies():\nPROCEDURE analyze_and_cleanup_dependencies():\n  # [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # Dependency analysis reveals hidden coupling that would create circular [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  # imports after extraction. [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY]\n  build import_graph of current codebase\n  identify clusters of mutual imports (potential circular deps)\n  FOR each circular dependency cluster:\n    introduce interface to break the cycle\n    OR restructure to move shared code to a lower layer\n  END FOR\n\n# [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION] [REQ-MAINTAINABILITY] — Block implements documented behavior for: VALIDATE pre_extraction_readiness():\nVALIDATE pre_extraction_readiness():\n  # [IMPL-REFACTOR_PREP] [ARCH-CODE_ORGANIZATION]\
