        formatter:  {files: [formatter.go, formatter_test.go],   tokens: [REQ-OUTPUT_FORMATTING, ARCH-OUTPUT_FORMATTING, REQ-CUSTOMIZABLE_FORMAT_STRINGS]}
        git:        {files: [git.go, git_test.go],               tokens: [REQ-GIT_INTEGRATION, ARCH-GIT_INTEGRATION]}

    # [IMPL-TOKEN_COVERAGE_AUDIT] [ARCH-TOKEN_SYSTEM] [REQ-DOC_016] — Block implements documented behavior for: PROCEDURE audit_module_coverage(module):
    PROCEDURE audit_module_coverage(module):
      # [IMPL-TOKEN_COVERAGE_AUDIT] [ARCH-TOKEN_SYSTEM] [REQ-DOC_016] — Scan each module for expected token annotations
      for each file in module.files:
        scan file for [REQ-*], [ARCH-*], [IMPL-*] token comments
        compare found tokens against module.expected_tokens
        record gaps where expected tokens are missing
      if gaps found:
        # [IMPL-TOKEN_COVERAGE_AUDIT] [REQ-DOC_016] — Remediate by adding missing annotations [ARCH-TOKEN_SYSTEM] [ARCH-ARCHIVE_FORMAT] [ARCH-PROCESSING_PATTERNS]
        add missing token annotations to source and test files
        ensure test function names reference corresponding requirement tokens

    # [IMPL-TOKEN_COVERAGE_AUDIT] [ARCH-TOKEN_SYSTEM] [REQ-DOC_016] — Block implements documented behavior for: PROCEDURE run_full_audit():
    PROCEDURE run_full_audit():
      # [IMPL-TOKEN_COVERAGE_AUDIT] [ARCH-TOKEN_SYSTEM] [REQ-FILE_BACKUP] [REQ-ERROR_HANDLING] [REQ-CONFIGURATION] [REQ-DIFF_COMMAND] [REQ-OUTPUT_FORMATTING] [REQ-GIT_INTEGRATION] — Execute audit across all modules
      for each module in audit_scope.modules:
        audit_module_coverage(module)
      # [ARCH-RESOURCE_MANAGEMENT] [ARCH-ERROR_HANDLING] [ARCH-EXCLUSION_PATTERNS] [ARCH-PACKAGE_EXTRACTION] — Cross-module gap analysis [IMPL-TOKEN_COVERAGE_AUDIT] [REQ-DOC_016]
      aggregate results into coverage report
      identify cross-module token gaps
      # [ARCH-DIRECTORY_COMPARISON] [ARCH-DIFF_COMMAND] [ARCH-OUTPUT_FORMATTING] [ARCH-GIT_INTEGRATION] — Ensure architecture tokens present per domain [IMPL-TOKEN_COVERAGE_AUDIT] [REQ-DOC_016]
      verify each ARCH token appears in its domain module

    # [IMPL-TOKEN_COVERAGE_AUDIT] [ARCH-TOKEN_SYSTEM] [REQ-DOC_016] — Block implements documented behavior for: VALIDATE audit_completeness:
    VALIDATE audit_completeness:
      # [IMPL-TOKEN_COVERAGE_AUDIT] [ARCH-TOKEN_SYSTEM] [REQ-DOC_016] [REQ-LIST_LIMIT] — Verify audit results
      CHECK every module has both source and test token annotations
