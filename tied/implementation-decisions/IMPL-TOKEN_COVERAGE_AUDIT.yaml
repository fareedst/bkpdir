      modules:
        archive:    {files: [archive.go, archive_test.go],       tokens: [REQ-FILE_BACKUP, ARCH-ARCHIVE_FORMAT, ARCH-PROCESSING_PATTERNS, ARCH-CONTEXT_SUPPORT]}
