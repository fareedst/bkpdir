    procedure applyPrepend(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields):
      # Handles array prepend (source before destination); for scalars checks CFG-001 precedence. [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]
      IF value is array THEN
        convert to []string
        prepend srcSlice before dstSlice with deduplication
      ELSE
        # [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] — scalar precedence check (same as applyMerge) [ARCH-CFG_001] [ARCH-CFG_005] [REQ-CFG_001] [REQ-CONFIGURATION]
        behavior = getFieldMergeBehavior(key)
