IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX:
  name: Merge and Prepend Strategy Precedence Fix
  status: Active
  cross_references:
  - ARCH-CFG_001
  - ARCH-CFG_005
  - REQ-CFG_001
  - REQ-CONFIGURATION
  rationale:
    why: 'Bug fix: `+` and `^` prefixes on scalar/precedence fields (e.g., `+archive_dir_path`, `^archive_dir_path`) were bypassing precedence checks

      Per CFG-001 and implementation decision [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY], explicit prefixes should "work as normal, but precedence still applies for sequential files"

      `applyMerge()` and `applyPrepend()` were designed for arrays and fell back to `setConfigField()` for scalars without checking precedence

      This violated CFG-001 requirement that earlier files take precedence over later files'
    problems_solved: []
    benefits: []
  implementation_approach:
    summary: '- Updated `applyMerge()` and `applyPrepend()` function signatures to accept `inheritContext`, `defaultCfg`, and `explicitlySetFields` parameters'
    details: []
  code_locations:
    files:
    - path: config.go
      description: Merge strategy application functions with precedence enforcement for scalar fields
    functions:
    - name: applyMerge
      file: config.go
      description: Applies merge (+) strategy; checks precedence for scalar/precedence fields via getFieldMergeBehavior and explicitlySetFields
    - name: applyPrepend
      file: config.go
      description: Applies prepend (^) strategy; checks precedence for scalar/precedence fields before falling back to setConfigField
    - name: applyMergeOperation
      file: config.go
      description: Dispatches to strategy-specific apply functions passing inheritContext, defaultCfg, and explicitlySetFields
    - name: applyOverride
      file: config.go
      description: Applies override strategy with shouldPreserve logic respecting earlier file precedence
