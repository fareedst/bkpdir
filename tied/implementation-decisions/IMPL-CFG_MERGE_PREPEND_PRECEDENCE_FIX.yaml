        behavior = getFieldMergeBehavior(key)
        IF behavior == MergeBehaviorPrecedence AND NOT inheritContext AND dstValue != nil THEN
          defaultValue = getDefaultValueForKey(key, defaultCfg)
          IF dstValue differs from defaultValue OR wasSetByEarlierFile OR earlierFilesProcessed THEN
            RETURN setConfigField(result, key, dstValue)  # preserve earlier file value
        RETURN setConfigField(result, key, value)

