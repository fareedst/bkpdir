    procedure applyMerge(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields):
      # Handles array merge with deduplication; for scalar/precedence fields checks CFG-001 precedence. [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]
      IF value is array THEN
        convert []interface{} to []string
        merge srcSlice into dstSlice with deduplication
      ELSE
