  essence_pseudocode: "# [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [ARCH-CFG_005] [REQ-CFG_001] [REQ-CONFIGURATION]\n# Bug fix: + and ^ prefixes on scalar/precedence fields were bypassing precedence checks. [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]\n# applyMerge and applyPrepend now accept inheritContext, defaultCfg, and explicitlySetFields [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]\n# to enforce CFG-001 earlier-file precedence for non-array fields. [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]\n\n# [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001] — Block implements documented behavior for: procedure applyMergeOperation(result, key, operation, dstValue, originalDstValue, inheritContext, defaultCfg, explicitly\nprocedure applyMergeOperation(result, key, operation, dstValue, originalDstValue, inheritContext, defaultCfg, explicitlySetFields):\n  # Dispatches to strategy-specific handler,\
    \ passing precedence context. [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]\n  SWITCH operation.strategy:\n    \"override\" -> applyOverride(result, key, value, originalDstValue, inheritContext, defaultCfg, explicitlySetFields)\n    \"merge\"    -> applyMerge(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields)\n    \"prepend\"  -> applyPrepend(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields)\n    \"replace\"  -> applyReplace(result, key, value, originalDstValue, inheritContext, defaultCfg, explicitlySetFields)\n    \"default\"  -> applyDefault(result, key, value, dstValue)\n\n# [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001] — Block implements documented behavior for: procedure applyMerge(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields):\nprocedure applyMerge(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields):\n  # Handles array\
    \ merge with deduplication; for scalar/precedence fields checks CFG-001 precedence. [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]\n  IF value is array THEN\n    convert []interface{} to []string\n    merge srcSlice into dstSlice with deduplication\n  ELSE\n    # [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] — scalar precedence check [ARCH-CFG_001] [ARCH-CFG_005] [REQ-CFG_001] [REQ-CONFIGURATION]\n    behavior = getFieldMergeBehavior(key)\n    IF behavior == MergeBehaviorPrecedence AND NOT inheritContext AND dstValue != nil THEN\n      defaultValue = getDefaultValueForKey(key, defaultCfg)\n      IF dstValue differs from defaultValue OR wasSetByEarlierFile OR earlierFilesProcessed THEN\n        RETURN setConfigField(result, key, dstValue)  # preserve earlier file value\n    RETURN setConfigField(result, key, value)\n\n# [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001] — Block implements documented behavior for: procedure applyPrepend(result, key, value,\
    \ dstValue, inheritContext, defaultCfg, explicitlySetFields):\nprocedure applyPrepend(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields):\n  # Handles array prepend (source before destination); for scalars checks CFG-001 precedence. [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CFG_001]\n  IF value is array THEN\n    convert to []string\n    prepend srcSlice before dstSlice with deduplication\n  ELSE\n    # [IMPL-CFG_MERGE_PREPEND_PRECEDENCE_FIX] — scalar precedence check (same as applyMerge) [ARCH-CFG_001] [ARCH-CFG_005] [REQ-CFG_001] [REQ-CONFIGURATION]\n    behavior = getFieldMergeBehavior(key)\n    IF behavior == MergeBehaviorPrecedence AND NOT inheritContext AND dstValue != nil THEN\n      defaultValue = getDefaultValueForKey(key, defaultCfg)\n      IF dstValue differs from defaultValue OR wasSetByEarlierFile THEN\n        RETURN setConfigField(result, key, dstValue)  # preserve earlier file value\n    RETURN setConfigField(result, key,\
    \ value)"
