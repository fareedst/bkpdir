      SWITCH operation.strategy:
        "override" -> applyOverride(result, key, value, originalDstValue, inheritContext, defaultCfg, explicitlySetFields)
        "merge"    -> applyMerge(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields)
