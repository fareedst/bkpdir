  essence_pseudocode: "# [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] [REQ-OUT_002]\n# File statistics gathering and human-readable formatting for enhanced output [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING]\n\n# [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: struct FileStatInfo:\nstruct FileStatInfo:\n  # [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUT_002] Data model for file statistics\n  Path      string      # Full file path\n  Name      string      # File name only (base name)\n  Size      int64       # File size in bytes\n  SizeHuman string      # Human-readable size (e.g., \"1.2MB\", \"455KB\")\n  MTime     time.Time   # Modification time\n  MTimeUnix int64       # Modification time as unix timestamp\n  Mode      os.FileMode # File permissions/mode\n  Type      string      # File type (\"regular\", \"directory\", \"symlink\", etc.)\n\n# [IMPL-FILE_STATISTICS]\
    \ [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure GatherFileStatInfo(path):\nprocedure GatherFileStatInfo(path):\n  # [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] Gather file statistics via os.Stat\n  info, err = os.Stat(path)\n  if err != nil:\n    return nil, error(\"failed to stat file: \" + path)\n\n  # [IMPL-FILE_STATISTICS] [REQ-OUT_002] Build FileStatInfo with all fields populated [ARCH-FILE_STATISTICS]\n  return FileStatInfo{\n    Path:      path,\n    Name:      filepath.Base(path),\n    Size:      info.Size(),\n    SizeHuman: formatHumanSize(info.Size()),\n    MTime:     info.ModTime(),\n    MTimeUnix: info.ModTime().Unix(),\n    Mode:      info.Mode(),\n    Type:      getFileType(info),\n  }\n\n# [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure formatHumanSize(size):\nprocedure formatHumanSize(size):\n  # [IMPL-FILE_STATISTICS]\
    \ [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] Convert bytes to human-readable string\n  KB = 1024; MB = 1024*KB; GB = 1024*MB; TB = 1024*GB\n  if size >= TB: return sprintf(\"%.1fTB\", size/TB)\n  if size >= GB: return sprintf(\"%.1fGB\", size/GB)\n  if size >= MB: return sprintf(\"%.1fMB\", size/MB)\n  if size >= KB: return sprintf(\"%.1fKB\", size/KB)\n  return sprintf(\"%dB\", size)\n\n# [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure getFileType(info):\nprocedure getFileType(info):\n  # [IMPL-FILE_STATISTICS] [ARCH-FILE_STATISTICS] [REQ-OUTPUT_FORMATTING] Classify file by mode bits\n  mode = info.Mode()\n  if mode.IsRegular(): return \"regular\"\n  if mode.IsDir():     return \"directory\"\n  if mode & ModeSymlink:   return \"symlink\"\n  if mode & ModeDevice:    return \"device\"\n  if mode & ModeNamedPipe: return \"pipe\"\n  if mode & ModeSocket:    return \"socket\"\n  return \"other\""
