    \ child first)\n    assert at least 2 patterns present\n\n  subtest \"prepend in sequential files - first file then second file\":\n    # [REQ-CFG_005] [REQ-CFG_001] — verifies prepend in sequential file processing puts new values before existing [IMPL-TEST_PREPEND_ORDERING] [ARCH-TESTING_STRATEGY]\n    create file1-sequential.yml with exclude_patterns: [\"first1\", \"first2\"]\n    create file2-sequential.yml with \"^exclude_patterns\": [\"second1\", \"second2\"]\n    set BKPDIR_CONFIG = file1:file2, call LoadConfig\n    assert cfg.ExcludePatterns == [\"second1\", \"second2\", \".git/\", \"vendor/\", \"first1\", \"first2\"]\n\n  subtest \"prepend with defaults - prepended values before defaults\":\n    # [REQ-CFG_005] — verifies prepend values come before default patterns when no parent config [IMPL-TEST_PREPEND_ORDERING] [ARCH-TESTING_STRATEGY]\n    create prepend-defaults.yml with \"^exclude_patterns\": [\"prepend1\", \"prepend2\"]\n    set BKPDIR_CONFIG, call LoadConfig\n    assert\
    \ cfg.ExcludePatterns == [\"prepend1\", \"prepend2\", \".git/\", \"vendor/\"]\n\n  subtest \"multiple prepend operations maintain order\":\n    # [REQ-CFG_005] [REQ-CFG_001] — verifies multiple prepend operations stack correctly (later prepends first) [IMPL-TEST_PREPEND_ORDERING] [ARCH-TESTING_STRATEGY]\n    create base-multi.yml with exclude_patterns: [\"base1\", \"base2\"]\n    create prepend1-multi.yml with \"^exclude_patterns\": [\"prepend1-1\", \"prepend1-2\"]\n    create prepend2-multi.yml with \"^exclude_patterns\": [\"prepend2-1\", \"prepend2-2\"]\n    set BKPDIR_CONFIG = base:prepend1:prepend2, call LoadConfig\n    assert cfg.ExcludePatterns == [\"prepend2-1\", \"prepend2-2\", \"prepend1-1\", \"prepend1-2\", \".git/\", \"vendor/\", \"base1\", \"base2\"]\n  end"
