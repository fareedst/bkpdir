  essence_pseudocode: "# [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Grouped config display with importance ranking and category priorities\n\nconstants ImportanceLevels:\n  # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] Define importance tiers for field ranking\n  ImportanceCritical = 0\n  ImportanceHigh     = 1\n  ImportanceMedium   = 2\n  ImportanceLow      = 3\n\n# [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Block implements documented behavior for: map CategoryPriority:\nmap CategoryPriority:\n  # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] Define display order for categories (lower value = higher priority)\n  basic_settings   = 0\n  archive_settings = 1\n  backup_settings  = 2\n  git_settings     = 3\n  verification     = 4\n  output_format    = 5\n  status_codes     = 6\n  advanced         = 7\n\n# [IMPL-CONFIG_OUTPUT_GROUPING]\
    \ [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Block implements documented behavior for: procedure getFieldImportance(name, category):\nprocedure getFieldImportance(name, category):\n  # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] Classify field importance based on name/category\n  if name in {archive_dir_path, backup_dir_path}: return ImportanceCritical\n  if name in {use_current_dir_name, use_current_dir_name_for_files, git.enabled}: return ImportanceHigh\n  if name contains \"format\" or \"template\": return ImportanceLow\n  if name contains \"status\": return ImportanceLow\n  return ImportanceMedium\n\n# [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Block implements documented behavior for: procedure displayConfigGrouped(values, showSources):\nprocedure displayConfigGrouped(values, showSources):\n  # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]\
    \ Group values by category and display sorted by priority then importance\n\n  # Group values by their FieldInfo.Category [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]\n  categories = map[category] -> list of ConfigValueWithMetadata\n  for each value in values:\n    categories[value.FieldInfo.Category].append(value)\n\n  # Sort categories by CategoryPriority (lower value first, unknown = 999) [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]\n  sortedCategories = sort categories keys by CategoryPriority lookup, tie-break alphabetically\n\n  # Print configuration source paths header [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]\n  print \"Configuration Sources: <expanded config search paths>\"\n\n  # Display each category section [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]\n  for each category in sortedCategories:\n \
    \   categoryValues = categories[category]\n\n    # Sort within category: by Importance ascending, then by Name alphabetically [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]\n    sort categoryValues by (FieldInfo.Importance, ConfigValue.Name)\n\n    # Print category header as \"## Title Case Category\" [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]\n    print \"## \" + titleCase(category)\n\n    for each value in categoryValues:\n      print \"  \" + value.Name + \": \" + value.Value\n      if showSources:\n        print \" (source: \" + value.Source + \")\"\n        if value.IsOverridden: print \" [overridden]\"\n        if len(value.InheritanceChain) > 1: print \" [chain: ...]\""
