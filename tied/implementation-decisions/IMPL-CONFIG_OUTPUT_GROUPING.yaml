    # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Block implements documented behavior for: map CategoryPriority:
    map CategoryPriority:
      # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] Define display order for categories (lower value = higher priority)
      basic_settings   = 0
      archive_settings = 1
      backup_settings  = 2
      git_settings     = 3
      verification     = 4
      output_format    = 5
      status_codes     = 6
      advanced         = 7

    # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Block implements documented behavior for: procedure getFieldImportance(name, category):
    procedure getFieldImportance(name, category):
      # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] Classify field importance based on name/category
      if name in {archive_dir_path, backup_dir_path}: return ImportanceCritical
      if name in {use_current_dir_name, use_current_dir_name_for_files, git.enabled}: return ImportanceHigh
      if name contains "format" or "template": return ImportanceLow
      if name contains "status": return ImportanceLow
      return ImportanceMedium

    # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Block implements documented behavior for: procedure displayConfigGrouped(values, showSources):
    procedure displayConfigGrouped(values, showSources):
      # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] Group values by category and display sorted by priority then importance

      # Group values by their FieldInfo.Category [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]
      categories = map[category] -> list of ConfigValueWithMetadata
      for each value in values:
        categories[value.FieldInfo.Category].append(value)

      # Sort categories by CategoryPriority (lower value first, unknown = 999) [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]
      sortedCategories = sort categories keys by CategoryPriority lookup, tie-break alphabetically

      # Print configuration source paths header [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]
      print "Configuration Sources: <expanded config search paths>"

      # Display each category section [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]
      for each category in sortedCategories:
        categoryValues = categories[category]

        # Sort within category: by Importance ascending, then by Name alphabetically [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]
        sort categoryValues by (FieldInfo.Importance, ConfigValue.Name)

        # Print category header as "## Title Case Category" [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING]
        print "## " + titleCase(category)

        for each value in categoryValues:
          print "  " + value.Name + ": " + value.Value
          if showSources:
            print " (source: " + value.Source + ")"
            if value.IsOverridden: print " [overridden]"
            if len(value.InheritanceChain) > 1: print " [chain: ...]"
