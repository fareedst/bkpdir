    # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] — Grouped config display with importance ranking and category priorities

    constants ImportanceLevels:
      # [IMPL-CONFIG_OUTPUT_GROUPING] [ARCH-CONFIG_OUTPUT_GROUPING] [REQ-CONFIG_OUTPUT_GROUPING] Define importance tiers for field ranking
      ImportanceCritical = 0
      ImportanceHigh     = 1
