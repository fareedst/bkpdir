  essence_pseudocode: "# [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [ARCH-CFG_001] [REQ-CFG_005] [REQ-CONFIGURATION]\n# Ensures MergeBehaviorAccumulate fields always merge (unless explicit prefix), regardless of context. [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n\n# [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: PROCEDURE applyMergeStrategies(dst, src *Config, inheritContext bool, rawSrcMap, initialDefaultCfg, explicitlySetFields)\nPROCEDURE applyMergeStrategies(dst, src *Config, inheritContext bool, rawSrcMap, initialDefaultCfg, explicitlySetFields) -> (*Config, error):\n  processor := newMergeStrategyProcessor()\n  srcMap := rawSrcMap OR configToMap(src)\n  processed := processor.processKeys(srcMap)\n\n  # Build explicit prefix map from rawSrcMap [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n  hasExplicitPrefix := map[string]bool{}\n  FOR origKey in rawSrcMap:\n    cleanKey := stripQuotes(origKey)\n\
    \    IF cleanKey starts with '!' OR '+' OR '^' OR '=' THEN\n      hasExplicitPrefix[cleanKey[1:]] = true\n    END\n  END\n\n  # [IMPL-CFG_MIXED_MODE_MERGE_FIX] — Apply field-specific merge behavior [ARCH-CFG_005] [ARCH-CFG_001] [REQ-CFG_005] [REQ-CONFIGURATION]\n  FOR each key, operation in processed.operations:\n    behavior := getFieldMergeBehavior(key)\n    hasExplicitPrefixForField := hasExplicitPrefix[key]\n\n    IF behavior == MergeBehaviorAccumulate THEN\n      # CFG-005: Array fields default to merge in ALL contexts [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n      IF operation.strategy == \"override\" AND NOT hasExplicitPrefixForField THEN\n        # Change default \"override\" to \"merge\" for accumulate fields [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n        # This ensures exclude_patterns merges with defaults instead of replacing [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n        operation.strategy = \"merge\"\n  \
    \    END\n      # For \"replace\" (!), \"merge\" (+), \"prepend\" (^), \"default\" (=): keep as-is [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n    ELSE\n      # [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] MergeBehaviorPrecedence: keep strategy as-is (CFG-001) [ARCH-CFG_005] [REQ-CFG_005]\n    END\n  END\n\n  # Apply processed operations to result config [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n  result := copy of dst\n  FOR each key, operation in processed.operations:\n    dstValue := getConfigFieldValue(result, key)\n    originalDstValue := getConfigFieldValue(dst, key)\n    applyMergeOperation(result, key, operation, dstValue, originalDstValue,\n        inheritContext, defaultCfg, explicitlySetFields)\n  END\n\n  # Merge remaining fields not in processed operations via mergeConfigs [IMPL-CFG_MIXED_MODE_MERGE_FIX] [ARCH-CFG_005] [REQ-CFG_005]\n  mergeConfigs(result, src, inheritContext, defaultCfg, rawSrcMap,\n      initialDefaultCfg, dst, explicitlySetFields)\n\
    \  RETURN result, nil"
