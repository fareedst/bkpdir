IMPL-CFG_MIXED_MODE_MERGE_FIX:
  name: Mixed-Mode Merge Strategy Fix
  status: Active
  cross_references:
    - ARCH-CFG_005
    - ARCH-CFG_001
    - REQ-CFG_005
    - REQ-CONFIGURATION
  rationale:
    why: |-
      Bug fix: exclude_patterns and other MergeBehaviorAccumulate fields were not consistently merging with defaults per CFG-005 requirement.
      The logic was incorrectly keeping "override" strategy for first file in sequential processing, causing defaults to be replaced instead of merged.
      Test expectations were misaligned with CFG-005 requirement - updated to reflect correct merge behavior.
      Ensures consistent behavior: accumulate fields always merge (unless explicit replace prefix), regardless of context.
    problems_solved:
      - Accumulate fields lost default values when first file provided new values
      - '"override" strategy was not changed to "merge" for accumulate fields in all contexts'
      - Test expectations did not match CFG-005 merge requirement
    benefits:
      - exclude_patterns correctly merges with defaults in all contexts
      - Consistent accumulate behavior regardless of inheritance vs sequential
      - Explicit ! prefix still allows full replacement when needed
  implementation_approach:
    summary: Simplified merge strategy logic in applyMergeStrategies to always change "override" to "merge" for MergeBehaviorAccumulate fields (unless explicit prefix).
    details:
      - In applyMergeStrategies(), after processing keys, iterate operations
      - For MergeBehaviorAccumulate fields with "override" strategy and no explicit prefix, change to "merge"
      - This applies in ALL contexts (inheritance chains AND sequential file processing)
      - Explicit prefixes (!, +, ^, =) keep their strategy as-is
      - MergeBehaviorPrecedence fields are unaffected (keep strategy as-is)
  code_locations:
    files:
      - path: config.go
        description: applyMergeStrategies() function containing the accumulate field strategy override logic
    functions:
      - name: applyMergeStrategies
        file: config.go
        line: 1909
        description: Contains the MergeBehaviorAccumulate override logic
