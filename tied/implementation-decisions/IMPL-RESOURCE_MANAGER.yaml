  essence_pseudocode: "# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n# Thread-safe resource tracking with automatic cleanup and panic recovery. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: DATA Resource (interface):\nDATA Resource (interface):\n  Cleanup() -> error\n  String() -> string\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: DATA TempFile implements Resource:\nDATA TempFile implements Resource:\n  Path: string\n  # How TempFile cleans up: os.Remove(Path). [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: DATA TempDir implements Resource:\nDATA TempDir implements Resource:\n\
    \  Path: string\n  # How TempDir cleans up: os.RemoveAll(Path). [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: DATA ResourceManager:\nDATA ResourceManager:\n  resources: []Resource\n  mutex: sync.RWMutex\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n# How resources are registered for tracking (thread-safe). [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\nADD_RESOURCE(rm, resource):\n  LOCK rm.mutex\n  APPEND resource to rm.resources\n  UNLOCK rm.mutex\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: ADD_TEMP_FILE(rm, path):\nADD_TEMP_FILE(rm, path):\n  ADD_RESOURCE(rm, TempFile{path})\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented\
    \ behavior for: ADD_TEMP_DIR(rm, path):\nADD_TEMP_DIR(rm, path):\n  ADD_RESOURCE(rm, TempDir{path})\n\n# How a resource is removed from tracking without cleanup. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\nREMOVE_RESOURCE(rm, resource):\n  LOCK rm.mutex\n  FIND resource by String() match\n  REMOVE from slice\n  UNLOCK rm.mutex\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n# How all tracked resources are cleaned up (continues on individual failure). [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\nCLEANUP(rm):\n  LOCK rm.mutex\n  FOR EACH resource in rm.resources:\n    err = resource.Cleanup()\n    IF err: record lastError (continue)\n  CLEAR rm.resources\n  UNLOCK rm.mutex\n  RETURN lastError\n\n# How panic recovery wraps cleanup. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\nCLEANUP_WITH_PANIC_RECOVERY(rm):\n  DEFER recover() -> convert panic to error\n\
    \  RETURN CLEANUP(rm)\n\n# [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\n# How predicate-based selective cleanup works. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\nCLEANUP_IF(rm, predicate):\n  LOCK rm.mutex\n  FOR EACH resource:\n    IF predicate(resource): resource.Cleanup()\n    ELSE: keep in remaining\n  rm.resources = remaining\n  UNLOCK rm.mutex\n\n# [IMPL-RESOURCE_MANAGER] [IMPL-CONTEXT_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-CONTEXT_SUPPORT]\n# How context-aware cleanup checks cancellation between resources. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]\nCLEANUP_WITH_CONTEXT(rm, ctx):\n  IF ctx.Err(): RETURN ctx.Err()\n  LOCK rm.mutex\n  FOR EACH resource:\n    CHECK ctx.Done() -> RETURN ctx.Err() if cancelled\n    resource.Cleanup()\n  CLEAR rm.resources\n  UNLOCK rm.mutex"
