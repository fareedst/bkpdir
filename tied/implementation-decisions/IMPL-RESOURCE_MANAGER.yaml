    # [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: ADD_TEMP_DIR(rm, path):
    ADD_TEMP_DIR(rm, path):
      ADD_RESOURCE(rm, TempDir{path})

    # How a resource is removed from tracking without cleanup. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    REMOVE_RESOURCE(rm, resource):
      LOCK rm.mutex
      FIND resource by String() match
      REMOVE from slice
      UNLOCK rm.mutex

    # [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    # How all tracked resources are cleaned up (continues on individual failure). [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    CLEANUP(rm):
      LOCK rm.mutex
      FOR EACH resource in rm.resources:
        err = resource.Cleanup()
        IF err: record lastError (continue)
      CLEAR rm.resources
      UNLOCK rm.mutex
      RETURN lastError

    # How panic recovery wraps cleanup. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    CLEANUP_WITH_PANIC_RECOVERY(rm):
      DEFER recover() -> convert panic to error
      RETURN CLEANUP(rm)

    # [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    # How predicate-based selective cleanup works. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    CLEANUP_IF(rm, predicate):
      LOCK rm.mutex
      FOR EACH resource:
        IF predicate(resource): resource.Cleanup()
        ELSE: keep in remaining
      rm.resources = remaining
      UNLOCK rm.mutex

    # [IMPL-RESOURCE_MANAGER] [IMPL-CONTEXT_OPS] [ARCH-RESOURCE_MANAGEMENT] [REQ-CONTEXT_SUPPORT]
    # How context-aware cleanup checks cancellation between resources. [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    CLEANUP_WITH_CONTEXT(rm, ctx):
      IF ctx.Err(): RETURN ctx.Err()
      LOCK rm.mutex
      FOR EACH resource:
        CHECK ctx.Done() -> RETURN ctx.Err() if cancelled
        resource.Cleanup()
      CLEAR rm.resources
      UNLOCK rm.mutex
