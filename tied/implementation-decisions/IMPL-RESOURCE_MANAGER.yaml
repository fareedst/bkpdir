      # How TempDir cleans up: os.RemoveAll(Path). [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]

    # [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: DATA ResourceManager:
    DATA ResourceManager:
      resources: []Resource
      mutex: sync.RWMutex

    # [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    # How resources are registered for tracking (thread-safe). [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT]
    ADD_RESOURCE(rm, resource):
      LOCK rm.mutex
      APPEND resource to rm.resources
      UNLOCK rm.mutex

    # [IMPL-RESOURCE_MANAGER] [ARCH-RESOURCE_MANAGEMENT] [REQ-RESOURCE_MANAGEMENT] — Block implements documented behavior for: ADD_TEMP_FILE(rm, path):
    ADD_TEMP_FILE(rm, path):
