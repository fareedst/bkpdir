      # Automated checks prevent drift between documents and code. [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001]
      CHECK all tokens in code appear in semantic_token_registry
      CHECK all tokens in tests reference valid IMPL/ARCH/REQ entries
      CHECK bi-directional links: if A references B, B references A
      CHECK no orphaned tokens exist (tokens without code or test references)
      REPORT inconsistencies with file, line, and token context

    # [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001] — Block implements documented behavior for: PROCEDURE define_behavioral_contracts():
    PROCEDURE define_behavioral_contracts():
      # [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001]
      # Behavioral contracts specify invariants that must hold across changes. [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001]
      FOR each feature in documented_features:
        define input/output contracts
        define invariants that cannot change without version bump
        link contracts to requirement tokens
      END FOR

    # [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001] — Block implements documented behavior for: PROCEDURE analyze_change_impact():
    PROCEDURE analyze_change_impact():
      # [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001]
      # Dependency mapping reveals which documents, tests, and code are affected [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001]
      # when a requirement, architecture, or implementation decision changes. [IMPL-DOC_ENHANCEMENT] [ARCH-DOCUMENTATION_ARCHITECTURE] [REQ-DOC_001]
      build dependency_graph from semantic_token_registry cross_references
      FOR each proposed change:
        trace affected tokens through dependency_graph
        identify impacted documents, code files, and test files
        report change-impact summary
      END FOR
