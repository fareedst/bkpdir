  cross_references:
    - ARCH-OUTPUT_FORMATTING
    - REQ-OUTPUT_FORMATTING
  description: Implement delayed output functionality by returning output messages to calling functions instead of direct stdout/stderr printing, enabling better control over when and how output is displayed
  implementation_approach:
    details:
      - Added NewOutputFormatterWithCollector constructor for delayed output mode
      - 'Added OutputCollector with methods: AddStdout, AddStderr, FlushAll, FlushStdout, FlushStderr, Clear'
      - Added OutputMessage struct with Content, Destination, and Type fields
      - Enhanced OutputFormatter with optional collector field and delayed mode support
      - Maintained full backward compatibility - existing code works unchanged
      - Updated all Print methods to check for collector and route messages accordingly
    summary: Add OutputCollector with OutputMessage structs and enhance OutputFormatter with optional delayed mode
  metadata:
    author: AI Agent
    created: '2026-03-12'
    last_updated:
      author: AI agent
      date: '2026-06-02'
      reason: Track C bulk sidecar migration from inline essence
  name: Delayed Output Management
  rationale:
    benefits:
      - Better control over when and how output is displayed
      - Full backward compatibility maintained - existing code works unchanged
      - Output messages can be buffered and flushed selectively
    problems_solved:
      - Difficulty testing output generation separately from display
      - Inability to buffer and reorder output
      - Lack of control over when output is displayed
    why: Direct stdout/stderr printing limits control over output timing and destination
