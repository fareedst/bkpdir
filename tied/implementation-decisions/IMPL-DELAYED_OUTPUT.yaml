      - REQ-OUTPUT_FORMATTING
    tests:
      - name: TestOutputCollector
        file: pkg/formatter/formatter_test.go
        description: Validates AddStdout, AddStderr, GetMessages, Clear lifecycle
      - name: TestDelayedOutputMode
        file: pkg/formatter/formatter_test.go
        description: Validates IsDelayedMode, GetCollector, PrintCreatedArchive and PrintError routing through collector
      - name: TestInterfaceCompliance
        file: pkg/formatter/formatter_test.go
        description: Validates SetCollector and delayed-output interface methods
    code_annotations:
      - IMPL-DELAYED_OUTPUT
  related_decisions:
    depends_on: []
    supersedes: []
    see_also:
      - IMPL-DUAL_FORMATTING
  metadata:
    created: "2026-03-12"
    author: AI Agent
    last_updated:
      date: "2026-03-12"
      author: AI agent
      reason: Enriched pseudo-code, populated code_locations and traceability.tests per PROC-IMPL_CODE_TEST_SYNC
  essence_pseudocode: |-
    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Delayed output management: buffer output messages and flush selectively

    struct OutputMessage:                              # [IMPL-DELAYED_OUTPUT] — data carrier for one deferred message
      Content     string                               # the text to display
      Destination string                               # "stdout" or "stderr"
      Type        string                               # "info", "error", "warning", etc.

    struct OutputCollector:                             # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — accumulates OutputMessages for later display
      messages []OutputMessage

    procedure NewOutputCollector() -> *OutputCollector: # [IMPL-DELAYED_OUTPUT] — factory: returns empty collector
      return &OutputCollector{messages: []}

    procedure AddStdout(content, messageType):          # [IMPL-DELAYED_OUTPUT] [REQ-OUTPUT_FORMATTING] — append a stdout-bound message
      append messages <- OutputMessage{content, "stdout", messageType}

    procedure AddStderr(content, messageType):          # [IMPL-DELAYED_OUTPUT] [REQ-OUTPUT_FORMATTING] — append a stderr-bound message
      append messages <- OutputMessage{content, "stderr", messageType}

    procedure GetMessages() -> []OutputMessage:         # [IMPL-DELAYED_OUTPUT] — return snapshot of buffered messages
      return messages

    procedure FlushAll():                               # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — write every message to its destination, then clear
      for msg in messages:
        if msg.Destination == "stderr":
          write msg.Content to stderr
        else:
          write msg.Content to stdout
      messages = []

    procedure FlushStdout():                            # [IMPL-DELAYED_OUTPUT] — write only stdout messages, keep stderr
      remaining = []
      for msg in messages:
        if msg.Destination == "stdout":
          write msg.Content to stdout
        else:
          append remaining <- msg
      messages = remaining

    procedure FlushStderr():                            # [IMPL-DELAYED_OUTPUT] — write only stderr messages, keep stdout
      remaining = []
      for msg in messages:
        if msg.Destination == "stderr":
          write msg.Content to stderr
        else:
          append remaining <- msg
      messages = remaining

    procedure Clear():                                  # [IMPL-DELAYED_OUTPUT] — discard all buffered messages
      messages = []

    # --- OutputFormatter delayed-mode integration ---

    struct OutputFormatter:                              # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — extended with optional collector
      cfg       *Config
      collector *OutputCollector                         # nil = immediate mode; non-nil = delayed mode

    procedure IsDelayedMode() -> bool:                  # [IMPL-DELAYED_OUTPUT] — check whether collector is attached
      return collector != nil

    procedure GetCollector() -> *OutputCollector:        # [IMPL-DELAYED_OUTPUT] — accessor
      return collector

    procedure SetCollector(c *OutputCollector):          # [IMPL-DELAYED_OUTPUT] — mutator (nil removes delayed mode)
      collector = c

    procedure Print*(args...):                          # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — every Print method routes through collector when delayed
      message = Format*(args...)
      if collector != nil:
        collector.AddStdout(message, type)              # or AddStderr for error messages
      else:
        write message to stdout                         # or stderr for error messages

    procedure NewOutputFormatterWithCollector(cfg, collector): # [IMPL-DELAYED_OUTPUT] — constructor for delayed mode
      return AIFormatterAdapter with cfg and collector pre-set
