  cross_references:
    - ARCH-OUTPUT_FORMATTING
    - REQ-OUTPUT_FORMATTING
  description: Implement delayed output functionality by returning output messages to calling functions instead of direct stdout/stderr printing, enabling better control over when and how output is displayed
  essence_pseudocode: |-
    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Delayed output management: buffer output messages and flush selectively

    struct OutputMessage:                              # [IMPL-DELAYED_OUTPUT] — data carrier for one deferred message
      Content     string                               # the text to display
      Destination string                               # "stdout" or "stderr"
      Type        string                               # "info", "error", "warning", etc.

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: struct OutputCollector:                             # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — accumulates Outpu
    struct OutputCollector:                             # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — accumulates OutputMessages for later display
      messages []OutputMessage

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure NewOutputCollector() -> *OutputCollector: # [IMPL-DELAYED_OUTPUT] — factory: returns empty collector
    procedure NewOutputCollector() -> *OutputCollector: # [IMPL-DELAYED_OUTPUT] — factory: returns empty collector
      return &OutputCollector{messages: []}

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure AddStdout(content, messageType):          # [IMPL-DELAYED_OUTPUT] [REQ-OUTPUT_FORMATTING] — append a stdout-bo
    procedure AddStdout(content, messageType):          # [IMPL-DELAYED_OUTPUT] [REQ-OUTPUT_FORMATTING] — append a stdout-bound message
      append messages <- OutputMessage{content, "stdout", messageType}

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure AddStderr(content, messageType):          # [IMPL-DELAYED_OUTPUT] [REQ-OUTPUT_FORMATTING] — append a stderr-bo
    procedure AddStderr(content, messageType):          # [IMPL-DELAYED_OUTPUT] [REQ-OUTPUT_FORMATTING] — append a stderr-bound message
      append messages <- OutputMessage{content, "stderr", messageType}

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure GetMessages() -> []OutputMessage:         # [IMPL-DELAYED_OUTPUT] — return snapshot of buffered messages
    procedure GetMessages() -> []OutputMessage:         # [IMPL-DELAYED_OUTPUT] — return snapshot of buffered messages
      return messages

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure FlushAll():                               # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — write every messa
    procedure FlushAll():                               # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — write every message to its destination, then clear
      for msg in messages:
        if msg.Destination == "stderr":
          write msg.Content to stderr
        else:
          write msg.Content to stdout
      messages = []

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure FlushStdout():                            # [IMPL-DELAYED_OUTPUT] — write only stdout messages, keep stderr
    procedure FlushStdout():                            # [IMPL-DELAYED_OUTPUT] — write only stdout messages, keep stderr
      remaining = []
      for msg in messages:
        if msg.Destination == "stdout":
          write msg.Content to stdout
        else:
          append remaining <- msg
      messages = remaining

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure FlushStderr():                            # [IMPL-DELAYED_OUTPUT] — write only stderr messages, keep stdout
    procedure FlushStderr():                            # [IMPL-DELAYED_OUTPUT] — write only stderr messages, keep stdout
      remaining = []
      for msg in messages:
        if msg.Destination == "stderr":
          write msg.Content to stderr
        else:
          append remaining <- msg
      messages = remaining

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure Clear():                                  # [IMPL-DELAYED_OUTPUT] — discard all buffered messages
    procedure Clear():                                  # [IMPL-DELAYED_OUTPUT] — discard all buffered messages
      messages = []

    # --- OutputFormatter delayed-mode integration --- [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING]

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: struct OutputFormatter:                              # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — extended with op
    struct OutputFormatter:                              # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] — extended with optional collector
      cfg       *Config
      collector *OutputCollector                         # nil = immediate mode; non-nil = delayed mode

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure IsDelayedMode() -> bool:                  # [IMPL-DELAYED_OUTPUT] — check whether collector is attached
    procedure IsDelayedMode() -> bool:                  # [IMPL-DELAYED_OUTPUT] — check whether collector is attached
      return collector != nil

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure GetCollector() -> *OutputCollector:        # [IMPL-DELAYED_OUTPUT] — accessor
    procedure GetCollector() -> *OutputCollector:        # [IMPL-DELAYED_OUTPUT] — accessor
      return collector

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure SetCollector(c *OutputCollector):          # [IMPL-DELAYED_OUTPUT] — mutator (nil removes delayed mode)
    procedure SetCollector(c *OutputCollector):          # [IMPL-DELAYED_OUTPUT] — mutator (nil removes delayed mode)
      collector = c

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure Print*(args...):                          # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATT
    procedure Print*(args...):                          # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — every Print method routes through collector when delayed
      message = Format*(args...)
      if collector != nil:
        collector.AddStdout(message, type)              # or AddStderr for error messages
      else:
        write message to stdout                         # or stderr for error messages

    # [IMPL-DELAYED_OUTPUT] [ARCH-OUTPUT_FORMATTING] [REQ-OUTPUT_FORMATTING] — Block implements documented behavior for: procedure NewOutputFormatterWithCollector(cfg, collector): # [IMPL-DELAYED_OUTPUT] — constructor for delayed mode
    procedure NewOutputFormatterWithCollector(cfg, collector): # [IMPL-DELAYED_OUTPUT] — constructor for delayed mode
      return AIFormatterAdapter with cfg and collector pre-set
