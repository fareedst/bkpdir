IMPL-DELAYED_OUTPUT:
  name: Delayed Output Management
  status: Active
  description: Implement delayed output functionality by returning output messages to calling functions instead of direct stdout/stderr printing, enabling better control over when and how output is displayed
  rationale:
    why: Direct stdout/stderr printing limits control over output timing and destination
    problems_solved:
      - Lack of control over when output is displayed
      - Inability to buffer and reorder output
      - Difficulty testing output generation separately from display
    benefits:
      - Better control over when and how output is displayed
      - Output messages can be buffered and flushed selectively
      - Full backward compatibility maintained - existing code works unchanged
  implementation_approach:
    summary: Add OutputCollector with OutputMessage structs and enhance OutputFormatter with optional delayed mode
    details:
      - Added OutputMessage struct with Content, Destination, and Type fields
      - 'Added OutputCollector with methods: AddStdout, AddStderr, FlushAll, FlushStdout, FlushStderr, Clear'
      - Enhanced OutputFormatter with optional collector field and delayed mode support
      - Added NewOutputFormatterWithCollector constructor for delayed output mode
      - Updated all Print methods to check for collector and route messages accordingly
      - Maintained full backward compatibility - existing code works unchanged
  cross_references:
    - ARCH-OUTPUT_FORMATTING
    - REQ-OUTPUT_FORMATTING
  code_locations:
    files:
      - path: formatter.go
        description: OutputMessage struct, OutputCollector type and methods, OutputFormatter delayed-mode fields and Print* routing
      - path: ai_formatter_adapter.go
        description: NewOutputFormatterWithCollector constructor bridging Config + OutputCollector to AIFormatterAdapter
      - path: pkg/formatter/formatter_test.go
        description: Unit tests for OutputCollector and delayed output mode
    functions:
      - name: OutputMessage
        file: formatter.go
        description: Struct with Content, Destination, and Type fields for delayed messages
      - name: OutputCollector
        file: formatter.go
        description: Collects OutputMessage items for deferred display
      - name: NewOutputCollector
        file: formatter.go
        description: Constructor returning empty OutputCollector
      - name: OutputCollector.AddStdout
        file: formatter.go
        description: Appends a stdout message to the collector
      - name: OutputCollector.AddStderr
        file: formatter.go
        description: Appends a stderr message to the collector
      - name: OutputCollector.GetMessages
        file: formatter.go
        description: Returns all collected messages
      - name: OutputCollector.FlushAll
        file: formatter.go
        description: Writes all collected messages to their destinations and clears
      - name: OutputCollector.FlushStdout
        file: formatter.go
        description: Writes only stdout messages and retains stderr
      - name: OutputCollector.FlushStderr
        file: formatter.go
        description: Writes only stderr messages and retains stdout
      - name: OutputCollector.Clear
        file: formatter.go
        description: Discards all collected messages without writing
      - name: OutputFormatter.IsDelayedMode
        file: formatter.go
        description: Returns true when a collector is set
      - name: OutputFormatter.GetCollector
        file: formatter.go
        description: Returns the current OutputCollector or nil
      - name: OutputFormatter.SetCollector
        file: formatter.go
        description: Attaches or removes the OutputCollector
      - name: NewOutputFormatterWithCollector
        file: ai_formatter_adapter.go
        description: Creates AIFormatterAdapter in delayed mode with a pre-set collector
