  essence_pseudocode: "# [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] [ARCH-OUTPUT_FORMATTING] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n# — Format string validation and #{} placeholder replacement for user-customizable output [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n\n# --- Validation pipeline (config.go) --- [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n\n# [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure ValidateFormatString(fieldName, formatString) -> []string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_\nprocedure ValidateFormatString(fieldName, formatString) -> []string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — validate one field\n  expected = getExpectedPlaceholders(fieldName)\n\
    \  if expected is empty:\n    return nil                                       # no rules for this field\n  found = extractPlaceholders(formatString)\n  warnings = []\n  for ph in found:\n    if ph not in expected:\n      append warnings <- \"Field 'fieldName': unexpected placeholder 'ph'. Expected one of: [expected]\"\n  return warnings\n\n# [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure getExpectedPlaceholders(fieldName) -> []string:             # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZ\nprocedure getExpectedPlaceholders(fieldName) -> []string:             # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — define allowed placeholders per field\n  # Printf-style fields: {\"%s\"} or {\"%s\", \"%v\"} [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n  # Template-style list fields: {\"#{path}\"\
    , \"#{size_human}\", \"#{size}\", \"#{creation_time}\", \"#{mtime}\", ...} [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n  return lookup from placeholderMap[fieldName]\n\n# [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure extractPlaceholders(formatString) -> []string:              # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] — regex extra\nprocedure extractPlaceholders(formatString) -> []string:              # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] — regex extraction of both placeholder styles\n  printfMatches = regex `%[sdvfbtxX]` findAll in formatString\n  templateMatches = regex `#\\{[^}]+\\}` findAll in formatString\n  return printfMatches + templateMatches\n\n# [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure validateAllFormatStrings(cfg\
    \ *Config) -> []string:          # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_\nprocedure validateAllFormatStrings(cfg *Config) -> []string:          # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] — iterate all config fields\n  warnings = []\n  for each (fieldName, fieldValue) in cfg format fields:\n    append warnings <- ValidateFormatString(fieldName, fieldValue)\n  return warnings\n\n# --- Placeholder replacement (formatter.go) --- [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n\n# [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure formatTemplate(templateStr, data map[string]string) -> string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-OUT\nprocedure formatTemplate(templateStr, data map[string]string) -> string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-OUTPUT_FORMATTING] — core #{...} replacement\n\
    \  result = templateStr\n\n  # Pass 1: replace all #{key} from data map [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n  for key, value in data:\n    result = replaceAll(result, \"#{key}\", value)\n\n  # Pass 2: fill missing known placeholders with safe defaults [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n  knownDefaults = {\"#{size_human}\": \"unknown\", \"#{size}\": \"0\", \"#{mtime}\": data[\"creation_time\"] or \"unknown\"}\n  for placeholder, default in knownDefaults:\n    if result contains placeholder:\n      result = replaceAll(result, placeholder, default)\n\n  # Pass 3: handle printf verbs (%s) if still present — for mixed format strings [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n  if result contains \"%s\":\n    replace first %s with data[\"path\"] or data[\"name\"]           # [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\
    \ — mixed format support\n    if result still contains \"%s\":\n      replace next %s with data[\"creation_time\"]\n\n  # Pass 4: final safety — replace any remaining #{...} with data values or \"unknown\" [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n  if result contains \"#{\":\n    for each known placeholder name:\n      replace with data value or safe default\n\n  # Pass 5: Go template execution — only when {{.}} patterns present and no #{...} remains [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n  if result contains \"{{\" and \"}}\" and not \"#{\":                  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] — prevent fmt misinterpretation\n    parse and execute as Go text/template with data\n    on error: return result as-is\n\n  return result\n\n# --- Integration with config load --- [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]\n\
    \n# [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure LoadConfig():                                               # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_\nprocedure LoadConfig():                                               # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] — validation integrated into load\n  cfg = load YAML and merge\n  warnings = validateAllFormatStrings(cfg)\n  for w in warnings:\n    print w to stderr                                                # non-fatal: user is warned but loading continues\n  return cfg"
