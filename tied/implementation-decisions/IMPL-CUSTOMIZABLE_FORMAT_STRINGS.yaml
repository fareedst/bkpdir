IMPL-CUSTOMIZABLE_FORMAT_STRINGS:
  name: User-Customizable Format Strings Implementation
  status: Active
  description: |-
    Format string validation and #{} placeholder syntax for user-customizable output.
    Migrated all placeholders from %{...} to #{...} to avoid conflicts with Go's fmt package.
    FormatListArchive and FormatListBackup support template-style (#{name}) placeholders;
    validation runs at config load time with non-fatal warnings.
  cross_references:
    - ARCH-CUSTOMIZABLE_FORMAT_STRINGS
    - ARCH-CONFIG_SYSTEM
    - ARCH-OUTPUT_FORMATTING
    - REQ-CUSTOMIZABLE_FORMAT_STRINGS
  rationale:
    why: |-
      Go's fmt package interprets %{...} as the start of a format verb, causing %!(EXTRA ...) errors.
      Migrating to #{...} eliminates this conflict while keeping placeholders distinct from printf verbs.
      Validation at load time prevents user mistakes without blocking configuration loading.
    problems_solved:
      - fmt.Sprintf misinterpreting %{...} placeholders as format verbs
      - Users receiving %!(EXTRA ...) in output when using template placeholders
      - No feedback when users specify invalid placeholders
    benefits:
      - Single placeholder syntax (#{...}) throughout the codebase eliminates ambiguity
      - Load-time validation warns about unexpected placeholders
      - Simple string replacement (strings.ReplaceAll) keeps implementation maintainable
  implementation_approach:
    summary: |-
      Implement format string validation and comprehensive documentation for user customization.
      FormatListArchive and FormatListBackup support template-style (#{name}) placeholders.
      All placeholder syntax migrated from %{...} to #{...}.
    details:
      - All placeholder syntax changed from %{key} to #{key} across code, tests, and docs
      - ValidateFormatString validates individual fields against expected placeholder lists
      - getExpectedPlaceholders defines allowed placeholders per format field
      - extractPlaceholders uses regex to find both printf (%s) and template (#{...}) placeholders
      - validateAllFormatStrings iterates all config fields and collects warnings
      - Validation integrated into LoadConfig and LoadConfigWithInheritance (non-fatal stderr warnings)
  code_locations:
    files:
      - path: config.go
        description: ValidateFormatString, getExpectedPlaceholders, extractPlaceholders, validateAllFormatStrings — validation pipeline
      - path: config.go
        description: DefaultConfig — default format strings using #{...} syntax
      - path: formatter.go
        description: formatTemplate, FormatWithPlaceholders — #{...} placeholder replacement with fallback defaults
      - path: formatter.go
        description: FormatListArchive, FormatListBackup — template-placeholder detection and routing
      - path: pkg/formatter/ai_core_formatter.go
        description: FormatWithPlaceholders — #{...} replacement in AI formatter path
      - path: pkg/formatter/placeholder_replace.go
        description: ReplacePlaceholders — simple #{...} string replacement
      - path: pkg/formatter/template.go
        description: Template processing with #{...} placeholder generation
      - path: formatter_adapter_simple.go
        description: formatListArchiveSimple — simplified list formatting with #{...} placeholders
    functions:
      - name: ValidateFormatString
        file: config.go
        description: Validates one format field against its expected placeholders; returns warnings
      - name: getExpectedPlaceholders
        file: config.go
        description: Returns the set of allowed placeholders (printf + template) per field name
      - name: extractPlaceholders
        file: config.go
        description: Regex extraction of %s/%d and #{...} placeholders from a format string
      - name: validateAllFormatStrings
        file: config.go
        description: Iterates all Config format fields and collects validation warnings
      - name: OutputFormatter.formatTemplate
        file: formatter.go
        description: Replaces #{...} from data map, fills missing known placeholders with defaults, handles mixed printf+template
      - name: TemplateFormatter.FormatWithPlaceholders
        file: formatter.go
        description: Same #{...} replacement logic in the TemplateFormatter struct
