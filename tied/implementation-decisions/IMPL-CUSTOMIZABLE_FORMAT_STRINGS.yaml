  description: |-
    Format string validation and #{} placeholder syntax for user-customizable output.
    Migrated all placeholders from %{...} to #{...} to avoid conflicts with Go's fmt package.
    FormatListArchive and FormatListBackup support template-style (#{name}) placeholders;
    validation runs at config load time with non-fatal warnings.
  essence_pseudocode: |-
    # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] [ARCH-OUTPUT_FORMATTING] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
    # — Format string validation and #{} placeholder replacement for user-customizable output [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]

    # --- Validation pipeline (config.go) --- [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]

    # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure ValidateFormatString(fieldName, formatString) -> []string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_
    procedure ValidateFormatString(fieldName, formatString) -> []string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — validate one field
      expected = getExpectedPlaceholders(fieldName)
      if expected is empty:
        return nil                                       # no rules for this field
      found = extractPlaceholders(formatString)
      warnings = []
      for ph in found:
        if ph not in expected:
          append warnings <- "Field 'fieldName': unexpected placeholder 'ph'. Expected one of: [expected]"
      return warnings

    # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure getExpectedPlaceholders(fieldName) -> []string:             # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZ
    procedure getExpectedPlaceholders(fieldName) -> []string:             # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — define allowed placeholders per field
      # Printf-style fields: {"%s"} or {"%s", "%v"} [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
      # Template-style list fields: {"#{path}", "#{size_human}", "#{size}", "#{creation_time}", "#{mtime}", ...} [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
      return lookup from placeholderMap[fieldName]

    # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure extractPlaceholders(formatString) -> []string:              # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] — regex extra
    procedure extractPlaceholders(formatString) -> []string:              # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] — regex extraction of both placeholder styles
      printfMatches = regex `%[sdvfbtxX]` findAll in formatString
      templateMatches = regex `#\{[^}]+\}` findAll in formatString
      return printfMatches + templateMatches

    # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure validateAllFormatStrings(cfg *Config) -> []string:          # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_
    procedure validateAllFormatStrings(cfg *Config) -> []string:          # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] — iterate all config fields
      warnings = []
      for each (fieldName, fieldValue) in cfg format fields:
        append warnings <- ValidateFormatString(fieldName, fieldValue)
      return warnings

    # --- Placeholder replacement (formatter.go) --- [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]

    # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure formatTemplate(templateStr, data map[string]string) -> string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-OUT
    procedure formatTemplate(templateStr, data map[string]string) -> string:  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-OUTPUT_FORMATTING] — core #{...} replacement
      result = templateStr

      # Pass 1: replace all #{key} from data map [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
      for key, value in data:
        result = replaceAll(result, "#{key}", value)

      # Pass 2: fill missing known placeholders with safe defaults [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
      knownDefaults = {"#{size_human}": "unknown", "#{size}": "0", "#{mtime}": data["creation_time"] or "unknown"}
      for placeholder, default in knownDefaults:
        if result contains placeholder:
          result = replaceAll(result, placeholder, default)

      # Pass 3: handle printf verbs (%s) if still present — for mixed format strings [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
      if result contains "%s":
        replace first %s with data["path"] or data["name"]           # [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — mixed format support
        if result still contains "%s":
          replace next %s with data["creation_time"]

      # Pass 4: final safety — replace any remaining #{...} with data values or "unknown" [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
      if result contains "#{":
        for each known placeholder name:
          replace with data value or safe default

      # Pass 5: Go template execution — only when {{.}} patterns present and no #{...} remains [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]
      if result contains "{{" and "}}" and not "#{":                  # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] — prevent fmt misinterpretation
        parse and execute as Go text/template with data
        on error: return result as-is

      return result

    # --- Integration with config load --- [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS]

    # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CUSTOMIZABLE_FORMAT_STRINGS] [REQ-CUSTOMIZABLE_FORMAT_STRINGS] — Block implements documented behavior for: procedure LoadConfig():                                               # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_
    procedure LoadConfig():                                               # [IMPL-CUSTOMIZABLE_FORMAT_STRINGS] [ARCH-CONFIG_SYSTEM] — validation integrated into load
      cfg = load YAML and merge
      warnings = validateAllFormatStrings(cfg)
      for w in warnings:
        print w to stderr                                                # non-fatal: user is warned but loading continues
      return cfg
  implementation_approach:
    details:
      - All placeholder syntax changed from %{key} to
      - extractPlaceholders uses regex to find both printf (%s) and template (#{...}) placeholders
      - getExpectedPlaceholders defines allowed placeholders per format field
      - validateAllFormatStrings iterates all config fields and collects warnings
      - ValidateFormatString validates individual fields against expected placeholder lists
      - Validation integrated into LoadConfig and LoadConfigWithInheritance (non-fatal stderr warnings)
    summary: |-
      Implement format string validation and comprehensive documentation for user customization.
      FormatListArchive and FormatListBackup support template-style (#{name}) placeholders.
      All placeholder syntax migrated from %{...} to #{...}.
