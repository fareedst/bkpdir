      - 'TestErrorFormattingMethods: error formatting functions'
      - 'TestPrintMethods: Print methods in delayed mode'
      - 'TestTemplateFormatterAdvanced: TemplateFormatter functionality'
      - 'TestOutputCollectorFlushMethods: comprehensive FlushAll, FlushStdout, FlushStderr testing'
