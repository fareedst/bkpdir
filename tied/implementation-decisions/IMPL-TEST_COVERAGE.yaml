      date: "2026-03-12"
      author: AI agent
      reason: Enriched pseudo-code, populated code_locations and traceability.tests per PROC-IMPL_CODE_TEST_SYNC
  essence_pseudocode: |-
    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-CODE_QUALITY] [REQ-OUTPUT_FORMATTING]
    # — Comprehensive test coverage for formatter.go: OutputCollector, template methods, error formatting, print methods, file statistics

    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-CODE_QUALITY] — OutputCollector lifecycle tests
    TEST TestOutputCollector:
      collector = NewOutputCollector()
      ASSERT collector.GetMessages() is empty
      collector.AddStdout("test stdout", "info")
      collector.AddStderr("test stderr", "error")
      ASSERT GetMessages() has 2 messages with correct content/destination
      collector.Clear()
      ASSERT GetMessages() is empty

    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-CODE_QUALITY] — Delayed output mode with collector integration
    TEST TestDelayedOutputMode:
      collector = NewOutputCollector()
      formatter = NewDefaultOutputFormatterWithCollector(configProvider, collector)
      ASSERT formatter.IsDelayedMode() is true
      ASSERT formatter.GetCollector() == collector
      formatter.PrintCreatedArchive("/test/archive.zip")
      formatter.PrintError("test error")
      ASSERT collector has 2 messages: 1 stdout, 1 stderr

    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-OUTPUT_FORMATTING] — Template formatting with placeholder replacement
    TEST TestTemplateFormatter:
      # SubTest: ExtractionWithFormatting — archive path extraction and formatting
      result = fa.FormatListArchiveWithExtraction(archivePath, creationTime)
      ASSERT result contains archive filename
      # SubTest: CustomTemplateHandling — #{placeholder} replacement
      result = fa.FormatWithPlaceholders("Archive: #{path} on #{branch}", data)
      ASSERT result equals expected with replaced placeholders
      ASSERT missing placeholders remain as-is
      # SubTest: ListOutputWithSizeHuman — #{size_human} placeholder in list output
      result = fa.FormatListArchiveWithExtraction(testFile, creationTime)
      ASSERT result does NOT contain literal "#{size_human}"
      ASSERT result contains actual human-readable file size
      # SubTest: FormatListArchive_MixedPlaceholders — mixed %s and #{...} format strings
      result = fa.FormatListArchive(testFile, creationTime)
      ASSERT no unprocessed #{...} patterns remain
      ASSERT result contains file path and size

    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-CODE_QUALITY] — Default output formatter with custom format strings
    TEST TestDefaultOutputFormatter:
      result = formatter.FormatCreatedArchive("/test/archive.zip")
      ASSERT result contains path and "Created archive"
      SET custom format string
      ASSERT custom format is applied
      errorResult = formatter.FormatDiskFullError(testErr)
      ASSERT contains original error and "Disk full"

    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-CODE_QUALITY] — Error template formatting
    TEST TestErrorTemplateFormatting:
      FOR EACH error type (permission denied, disk full, config error):
        result = formatter.Format*Error(err)
        ASSERT result contains original error message
        ASSERT result contains error type label

    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-CODE_QUALITY] — File statistics template formatting
    TEST TestFormatCreatedArchiveWithStats_REQ_OUT_002:
      CREATE test archive file with known content
      result = formatter.FormatCreatedArchiveWithStats(testArchive)
      ASSERT result contains file path
      ASSERT result contains file size information
    TEST TestPrintCreatedArchiveWithStats_REQ_OUT_002:
      CAPTURE stdout
      formatter.PrintCreatedArchiveWithStats(testArchive)
      ASSERT captured output contains expected information

    # [IMPL-TEST_COVERAGE] [ARCH-TESTING_STRATEGY] [REQ-CODE_QUALITY] — Interface compliance
    TEST TestInterfaceCompliance:
      ASSERT DefaultOutputFormatter implements OutputFormatterInterface
      ASSERT DefaultTemplateFormatter implements TemplateFormatterInterface
      ASSERT DefaultPatternExtractor implements PatternExtractorInterface
