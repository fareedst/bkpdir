IMPL-CFG_PRECEDENCE_FIX:
  name: Configuration File Precedence Fix
  status: Active
  cross_references:
  - ARCH-CONFIG_SYSTEM
  - REQ-CONFIGURATION
  rationale:
    why: 'Bug fix: Configuration files were not respecting the requirement that "earlier files take precedence over later files" when processing sequential config files.

      The mergeConfigs and mergeBasicSettings functions were unconditionally overriding values without checking if they were already set by earlier files.

      This caused local config files (e.g., ./.bkpdir.yml) to be overridden by home directory config files (e.g., ~/.bkpdir.yml), violating the precedence specification.

      Special case: When an earlier file explicitly sets a value to the default (e.g., include_git_info: false), we need to detect that it was explicitly set, not just compare against defaults.

      The fix uses a fileProcessed flag and explicitlySetFields map to track which fields were set by earlier files.'
    problems_solved:
    - Local config file values overridden by home directory config
    - Default-valued fields not recognized as explicitly set
    - Sequential file precedence not enforced
    benefits:
    - Earlier files correctly take precedence over later files
    - Explicit default values are preserved from earlier files
    - fileProcessed flag cleanly separates first-file vs subsequent-file behavior
  implementation_approach:
    summary: Uses fileProcessed flag and explicitlySetFields map in LoadConfig fallback path to track precedence; first file merges with defaults, subsequent files respect earlier file values.
    details:
    - LoadConfig fallback path uses fileProcessed flag instead of comparing cfg to defaults
    - explicitlySetFields map tracks which fields were explicitly set by earlier files
    - First file processes with inheritContext=true (merges with defaults)
    - Subsequent files process with inheritContext=false (respects earlier file precedence)
    - mergeBasicSettings checks explicitlySetFields before overriding scalar values
    - initialDefaultCfg preserved to detect modifications from initial state
  code_locations:
    files:
    - path: config.go
      description: LoadConfig fallback path (fileProcessed, explicitlySetFields, initialDefaultCfg), mergeConfigs, mergeBasicSettings, mergeFileBackupSettings, mergeGitSettings
    - path: pkg/config/loader.go
      description: GenericConfigLoader with generic merge logic (does not implement precedence fix directly)
    functions:
    - name: LoadConfig
      file: config.go
      line: 434
      description: Fallback path with fileProcessed flag and explicitlySetFields tracking
    - name: mergeConfigs
      file: config.go
      line: 613
      description: Top-level merge orchestrator passing explicitlySetFields to sub-merge functions
    - name: mergeBasicSettings
      file: config.go
      line: 627
      description: Precedence check for basic settings using explicitlySetFields
    - name: mergeFileBackupSettings
      file: config.go
      line: 893
      description: Precedence check for file backup settings
    - name: mergeGitSettings
      file: config.go
      line: 775
      description: Precedence check for git settings
