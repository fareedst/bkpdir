  essence_pseudocode: "# [IMPL-TEST_UNICODE_HANDLING] [ARCH-TESTING_STRATEGY] [REQ-CONFIGURATION] [REQ-CFG_005] [REQ-CFG_001] — Tests Unicode characters and special characters in configuration values and file paths\n\nprocedure TestUnicodeHandling():\n  # [IMPL-TEST_UNICODE_HANDLING] [ARCH-TESTING_STRATEGY] [REQ-CONFIGURATION] [REQ-CFG_005] — validates Unicode character preservation in config values\n  save BKPDIR_CONFIG env; defer restore\n  create temp dir\n  create .bkpdir.yml with:\n    archive_dir_path: \"/path/with/émojis/\U0001F680/and/特殊字符\"\n    exclude_patterns: [\"*.文件\", \"测试/*\", \"unicode-文件.log\", \"émoji-\U0001F680.tmp\"]\n  set BKPDIR_CONFIG = configPath\n  call LoadConfig(dir)\n\n  # [REQ-CFG_005] — Unicode values merged with defaults per CFG-005\n  assert cfg.ArchiveDirPath == \"/path/with/émojis/\U0001F680/and/特殊字符\"\n  assert cfg.ExcludePatterns == [\".git/\", \"vendor/\", \"*.文件\", \"测试/*\", \"unicode-文件.log\", \"émoji-\U0001F680.tmp\"]\n  for each Unicode pattern, assert it is found in cfg.ExcludePatterns\n  end\n\nprocedure TestSpecialCharactersInPaths():\n  # [IMPL-TEST_UNICODE_HANDLING] [ARCH-TESTING_STRATEGY] [REQ-CONFIGURATION] [REQ-CFG_001] — validates config file loading with special characters in file paths\n  save BKPDIR_CONFIG env; defer restore\n  create temp dir\n\n  subtest \"config file path with spaces\":\n    # [REQ-CFG_001] — verifies LoadConfig works with spaces in directory path\n    create dir \"path with spaces\", write .bkpdir.yml with archive_dir_path and exclude_patterns\n    set BKPDIR_CONFIG, call LoadConfig\n    assert cfg.ArchiveDirPath == \"/test/archive\"\n    assert cfg.ExcludePatterns == [\".git/\", \"vendor/\", \"*.tmp\"] (merged per CFG-005)\n\n  subtest \"config file path with special characters\":\n    # [REQ-CFG_001] — verifies LoadConfig works with Unicode in directory path\n    create dir \"path-with-特殊\", write .bkpdir.yml\n    set BKPDIR_CONFIG, call LoadConfig\n    assert cfg.ArchiveDirPath == \"/test/archive\"\n    assert cfg.ExcludePatterns == [\".git/\", \"vendor/\", \"*.log\"]\n\n  subtest \"config file path with both spaces and special characters\":\n    # [REQ-CFG_001] — verifies LoadConfig works with both spaces and Unicode in directory path\n    create dir \"path with 特殊 chars\", write .bkpdir.yml\n    set BKPDIR_CONFIG, call LoadConfig\n    assert cfg.ArchiveDirPath == \"/test/archive\"\n    assert cfg.ExcludePatterns == [\".git/\", \"vendor/\", \"*.tmp\", \"*.log\"]\n  end"
