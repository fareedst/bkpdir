    procedure getFieldValueByPath(structValue, path):
      # [IMPL-CFG_006] [ARCH-CFG_006] Dot-separated path traversal with pointer dereferencing [REQ-CFG_006]
      parts = split path by "."
      currentValue = structValue
      for each part in parts:
        if currentValue is Ptr: dereference (error if nil)
