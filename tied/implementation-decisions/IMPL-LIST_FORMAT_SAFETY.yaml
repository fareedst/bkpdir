mt.Sprintf(formatStr, path, creationTime)\n  return formatStr\n\n# [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002] — Block implements documented behavior for: procedure FormatListArchiveWithExtraction(archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — priority-b\nprocedure FormatListArchiveWithExtraction(archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — priority-based format selection\n  data = extractArchiveFilenameData(archivePath)\n  data[\"path\"] = archivePath\n  data[\"creation_time\"] = creationTime\n  gather file stats into data (with safe defaults on error)\n\n  formatStr = cfg.FormatListArchive\n  # Priority 1: FormatListArchive with template placeholders [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if formatStr != \"\" and formatStr contains \"#{\":\n    return formatTemplate(formatStr, data)\n  # Priority 2: FormatListArchive with printf verbs [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if formatStr != \"\" and formatStr contains \"%\":\n    return fmt.Sprintf(formatStr, archivePath, creationTime)\n  # Priority 3: FormatListArchive plain text [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if formatStr != \"\":\n    return formatStr\n  # Priority 4: TemplateListArchive fallback [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if cfg.TemplateListArchive != \"\":\n    return FormatListArchiveTemplate(data)\n  # Priority 5: ultimate fallback [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  return FormatListArchive(archivePath, creationTime)\n\n# [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002] — Block implements documented behavior for: procedure formatListArchiveSimple(cfg, formatter, archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — si\nprocedure formatListArchiveSimple(cfg, formatter, archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — simplified path