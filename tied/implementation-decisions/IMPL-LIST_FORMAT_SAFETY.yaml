IMPL-LIST_FORMAT_SAFETY:
  name: List Command Format Safety Fix
  status: Active
  description: Guard list-command formatting so fmt.Sprintf is only called when the format string actually contains printf verbs, preventing EXTRA-arg errors and template-placeholder misinterpretation.
  cross_references:
  - ARCH-OUTPUT_FORMATTING
  - REQ-OUT_002
  rationale:
    why: 'Prevent `fmt` from interpreting template placeholders or appending EXTRA args when format strings contain no printf verbs (this produced `%!(EXTRA ...)` in user output).

      Ensure AI formatter and core formatter consistently handle template placeholders (`#{...}`) and printf formats.'
    problems_solved:
    - 'fmt.Sprintf misinterpreting #{...} placeholders as format verbs producing %!(EXTRA ...) output'
    - Inconsistent handling of template vs printf format strings in list commands
    benefits:
    - Clean list output regardless of placeholder style
    - Safe fallback when format string has no printf verbs
    - Consistent behavior across all formatting paths
  implementation_approach:
    summary: Added guarded printf usage in FormatListArchive, FormatListBackup, and FormatListArchiveWithExtraction to call fmt.Sprintf only when the format string contains printf verbs (%). Otherwise, return the template-format string as-is or perform placeholder replacement.
    details:
    - FormatListArchive checks for
    - FormatListBackup mirrors the same guard logic as FormatListArchive
    - FormatListArchiveWithExtraction applies priority-based format selection with
    - AICoreFormatter.FormatWithContext list branch delegates to ReplacePlaceholders when template placeholders are detected
    - formatListArchiveSimple always gathers file stats and selects format string by priority
  code_locations:
    files:
    - path: formatter.go
      description: FormatListArchive and FormatListBackup with guarded printf and template-placeholder routing
    - path: formatter.go
      description: FormatListArchiveWithExtraction with priority-based format selection
    - path: pkg/formatter/ai_core_formatter.go
      description: FormatWithContext list handling with IMPL-LIST_FORMAT_SAFETY guard
    - path: formatter_adapter_simple.go
      description: formatListArchiveSimple with priority format selection and ReplacePlaceholders
    functions:
    - name: OutputFormatter.FormatListArchive
      file: formatter.go
      description: Guards fmt.Sprintf behind strings.Contains(formatStr, "%"); routes
    - name: OutputFormatter.FormatListBackup
      file: formatter.go
      description: Same guard pattern as FormatListArchive for backup list formatting
    - name: OutputFormatter.FormatListArchiveWithExtraction
      file: formatter.go
      description: Priority-based format selection —
    - name: AICoreFormatter.FormatWithContext
      file: pkg/formatter/ai_core_formatter.go
      description: FormatTypeList branch guards list formatting with placeholder detection
    - name: formatListArchiveSimple
      file: formatter_adapter_simple.go
      description: Simplified list formatting that always gathers stats and uses ReplacePlaceholders
