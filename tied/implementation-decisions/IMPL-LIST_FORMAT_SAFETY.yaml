  essence_pseudocode: "# [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002] — Guard list formatting against fmt misinterpretation of template placeholders\n\nprocedure FormatListArchive(path, creationTime) -> string:  # [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002] — safe list-archive formatting\n  formatStr = cfg.FormatListArchive\n\n  # [IMPL-LIST_FORMAT_SAFETY] — detect template placeholders first [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if formatStr contains \"#{\":\n    data = build_data_map(path, creationTime)\n    statInfo, err = GatherFileStatInfo(path)\n    if err == nil:\n      merge statInfo fields into data                       # [REQ-OUT_002] — include file stats when available\n    else:\n      fill data with safe defaults (\"unknown\", \"0\")\n    return formatTemplate(formatStr, data)                  # template path — no fmt.Sprintf\n\n  # [IMPL-LIST_FORMAT_SAFETY] — only call fmt.Sprintf when printf verbs are present [ARCH-OUTPUT_FORMATTING]\
    \ [REQ-OUT_002]\n  if formatStr contains \"%\":\n    return fmt.Sprintf(formatStr, path, creationTime)\n\n  # [IMPL-LIST_FORMAT_SAFETY] — no verbs at all: return as-is to avoid EXTRA args [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  return formatStr\n\n# [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002] — Block implements documented behavior for: procedure FormatListBackup(path, creationTime) -> string:   # [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] — same \nprocedure FormatListBackup(path, creationTime) -> string:   # [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] — same guard for backup list\n  # mirrors FormatListArchive logic with cfg.FormatListBackup [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  formatStr = cfg.FormatListBackup\n  if formatStr contains \"#{\":\n    data = build_data_map(path, creationTime)\n    gather stats or fill defaults\n    return formatTemplate(formatStr, data)\n  if formatStr contains \"%\":\n    return fmt.Sprintf(formatStr,\
    \ path, creationTime)\n  return formatStr\n\n# [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002] — Block implements documented behavior for: procedure FormatListArchiveWithExtraction(archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — priority-b\nprocedure FormatListArchiveWithExtraction(archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — priority-based format selection\n  data = extractArchiveFilenameData(archivePath)\n  data[\"path\"] = archivePath\n  data[\"creation_time\"] = creationTime\n  gather file stats into data (with safe defaults on error)\n\n  formatStr = cfg.FormatListArchive\n  # Priority 1: FormatListArchive with template placeholders [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if formatStr != \"\" and formatStr contains \"#{\":\n    return formatTemplate(formatStr, data)\n  # Priority 2: FormatListArchive with printf verbs [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if formatStr\
    \ != \"\" and formatStr contains \"%\":\n    return fmt.Sprintf(formatStr, archivePath, creationTime)\n  # Priority 3: FormatListArchive plain text [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if formatStr != \"\":\n    return formatStr\n  # Priority 4: TemplateListArchive fallback [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  if cfg.TemplateListArchive != \"\":\n    return FormatListArchiveTemplate(data)\n  # Priority 5: ultimate fallback [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002]\n  return FormatListArchive(archivePath, creationTime)\n\n# [IMPL-LIST_FORMAT_SAFETY] [ARCH-OUTPUT_FORMATTING] [REQ-OUT_002] — Block implements documented behavior for: procedure formatListArchiveSimple(cfg, formatter, archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — si\nprocedure formatListArchiveSimple(cfg, formatter, archivePath, creationTime) -> string: # [IMPL-LIST_FORMAT_SAFETY] — simplified path always gathering stats\n\
    \  data = gather file stats for archivePath\n  select formatStr by priority: FormatListArchive(#{) > TemplateListArchive > default\n  return ReplacePlaceholders(formatStr, data)"
