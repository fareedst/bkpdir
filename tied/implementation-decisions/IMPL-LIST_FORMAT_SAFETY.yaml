IMPL-LIST_FORMAT_SAFETY:
  name: List Command Format Safety Fix
  status: Active
  cross_references:
    - ARCH-OUTPUT_FORMATTING
    - REQ-OUT_002
  rationale:
    why: |-
      Prevent `fmt` from interpreting template placeholders or appending EXTRA args when format strings contain no printf verbs (this produced `%!(EXTRA ...)` in user output).
      Ensure AI formatter and core formatter consistently handle template placeholders (`#{...}`) and printf formats.
    problems_solved: []
    benefits: []
  implementation_approach:
    summary: '- Added guarded printf usage in `FormatListArchive` and `FormatListBackup` to call `fmt.Sprintf` only when the format string contains printf verbs (`%`). Otherwise, return the template-format string as-is or perform placeholder replacement.'
    details: []
  code_locations:
