  essence_pseudocode: |-
    # [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]
    # Context-aware operation framework: wraps context.Context with ResourceManager
    # for cancellable, timeout-supporting operations with automatic cleanup.

    DATA ContextKey:
      ResourceManagerKey: "resourceManager"
      OperationIDKey: "operationID"

    # [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]
    # How ContextualOperation bundles a context with a ResourceManager.
    CONTEXTUAL_OPERATION(ctx):
      co.ctx = ctx
      co.rm = NEW ResourceManager
      RETURN co

    # How cancellation is detected via the context Done channel.
    IS_CANCELLED(co):
      SELECT on co.ctx.Done channel:
        IF signaled: RETURN true
        DEFAULT: RETURN false

    # How cancellation error is surfaced.
    CHECK_CANCELLATION(co):
      RETURN co.ctx.Err()

    # How cleanup delegates to the embedded ResourceManager.
    CLEANUP(co):
      RETURN co.rm.Cleanup()

    CLEANUP_WITH_PANIC_RECOVERY(co):
      RETURN co.rm.CleanupWithPanicRecovery()

    # [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]
    # How a ResourceManager is embedded into a context for downstream retrieval.
    WITH_RESOURCE_MANAGER(ctx):
      rm = NEW ResourceManager
      newCtx = context.WithValue(ctx, ResourceManagerKey, rm)
      RETURN newCtx, rm

    # How context cancellation triggers cleanup of tracked resources.
    CHECK_CONTEXT_AND_CLEANUP(ctx, rm):
      IF ctx.Err() != nil:
        cleanupErr = rm.CleanupWithPanicRecovery()
        IF cleanupErr != nil: RETURN CombineErrors(ctx.Err(), cleanupErr)
        RETURN ctx.Err()
      RETURN nil

    # [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]
    # How operation IDs are stored in and retrieved from context.
    WITH_OPERATION_ID(ctx, operationID):
      RETURN context.WithValue(ctx, OperationIDKey, operationID)

    GET_OPERATION_ID(ctx):
      RETURN ctx.Value(OperationIDKey) as string
