  essence_pseudocode: "# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\n# Context-aware operation framework: wraps context.Context with ResourceManager [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\n# for cancellable, timeout-supporting operations with automatic cleanup. [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT] — Block implements documented behavior for: DATA ContextKey:\nDATA ContextKey:\n  ResourceManagerKey: \"resourceManager\"\n  OperationIDKey: \"operationID\"\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\n# How ContextualOperation bundles a context with a ResourceManager. [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\nCONTEXTUAL_OPERATION(ctx):\n  co.ctx = ctx\n  co.rm = NEW ResourceManager\n  RETURN co\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT] Poll ctx.Done for cooperative cancellation in\
    \ long-running archive/backup paths.\nIS_CANCELLED(co):\n  # [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT] Non-blocking select on Done\n  SELECT on co.ctx.Done channel:\n    IF signaled: RETURN true\n    DEFAULT: RETURN false\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT] Surface cancellation reason to callers.\nCHECK_CANCELLATION(co):\n  RETURN co.ctx.Err()\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT] Release temp files/dirs tracked by ResourceManager on success path.\nCLEANUP(co):\n  RETURN co.rm.Cleanup()\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT] Ensure cleanup runs even when panic unwinds (pairs with IMPL-RESOURCE_MANAGER).\nCLEANUP_WITH_PANIC_RECOVERY(co):\n  RETURN co.rm.CleanupWithPanicRecovery()\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\n# How a ResourceManager is embedded into a context for downstream retrieval. [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\n\
    WITH_RESOURCE_MANAGER(ctx):\n  rm = NEW ResourceManager\n  newCtx = context.WithValue(ctx, ResourceManagerKey, rm)\n  RETURN newCtx, rm\n\n# How context cancellation triggers cleanup of tracked resources. [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\nCHECK_CONTEXT_AND_CLEANUP(ctx, rm):\n  IF ctx.Err() != nil:\n    cleanupErr = rm.CleanupWithPanicRecovery()\n    IF cleanupErr != nil: RETURN CombineErrors(ctx.Err(), cleanupErr)\n    RETURN ctx.Err()\n  RETURN nil\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\n# How operation IDs are stored in and retrieved from context. [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT]\nWITH_OPERATION_ID(ctx, operationID):\n  RETURN context.WithValue(ctx, OperationIDKey, operationID)\n\n# [IMPL-CONTEXT_OPS] [ARCH-CONTEXT_SUPPORT] [REQ-CONTEXT_SUPPORT] — Block implements documented behavior for: GET_OPERATION_ID(ctx):\nGET_OPERATION_ID(ctx):\n  RETURN ctx.Value(OperationIDKey) as string"
