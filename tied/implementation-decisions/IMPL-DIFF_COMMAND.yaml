    - REQ-INCREMENTAL_DUPLICATE_PREVENTION
    - REQ-OUTPUT_FORMATTING
  description: Implement diff command with archive state reconstruction and comparison engine. Reconstructs effective state by applying incremental on top of full archive, provides accurate change detection, reuses comparison logic for duplicate prevention consistency.
  essence_pseudocode: |-
    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [ARCH-DIRECTORY_COMPARISON] [ARCH-CLI_COMMANDS] [REQ-DIFF_COMMAND] [REQ-INCREMENTAL_DUPLICATE_PREVENTION] [REQ-OUTPUT_FORMATTING] [REQ-CONTEXT_SUPPORT]
    # — Diff command: reconstruct archive state from full+incremental archives, compare against current directory, report changes via CLI [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND]

    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND] — Block implements documented behavior for: DATA DiffResult { Added []string, Modified []string, Deleted []string }
    DATA DiffResult { Added []string, Modified []string, Deleted []string }

    # — Archive selection uses name-based sorting (ISO 8601 timestamps are alphabetically sortable) [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND]
    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND] — Block implements documented behavior for: PROCEDURE FindMostRecentArchive(archiveDir) -> (path, error):
    PROCEDURE FindMostRecentArchive(archiveDir) -> (path, error):
      archives = ListArchives(archiveDir)
      IF archives is empty THEN RETURN ("", nil)
      fullArchives = FILTER archives WHERE NOT IsIncremental
      IF fullArchives is empty THEN RETURN ("", nil)
      SORT fullArchives BY Name ascending
      RETURN fullArchives[last].Path

    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND] — Block implements documented behavior for: PROCEDURE findLatestFullArchive(archiveDir) -> (*Archive, error):
    PROCEDURE findLatestFullArchive(archiveDir) -> (*Archive, error):
      archives = ListArchives(archiveDir)
      IF archives is empty THEN RETURN error("No archives found")
      fullArchives = FILTER archives WHERE NOT IsIncremental
      IF fullArchives is empty THEN RETURN error("No full archive found")
      SORT fullArchives BY Name ascending
      RETURN &fullArchives[last]

    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND] — Block implements documented behavior for: PROCEDURE findLatestIncrementalArchive(archiveDir, baseFullArchive) -> (*Archive, error):
    PROCEDURE findLatestIncrementalArchive(archiveDir, baseFullArchive) -> (*Archive, error):
      # Identifies incrementals by prefix: BASENAME_update=... [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND]
      archives = ListArchives(archiveDir)
      baseName = TrimSuffix(baseFullArchive.Name, ".zip")
      expectedPrefix = baseName + "_update="
      matchingIncrementals = FILTER archives WHERE IsIncremental AND HasPrefix(Name, expectedPrefix)
      IF matchingIncrementals is empty THEN RETURN nil
      SORT matchingIncrementals BY Name ascending
      RETURN &matchingIncrementals[last]

    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND] — Reconstructs effective state by merging incremental on top of full archive
    PROCEDURE ReconstructArchiveState(archiveDir) -> (*DirectorySnapshot, error):
      latestFull = findLatestFullArchive(archiveDir)
      ON error RETURN wrap("failed to find full archive")
      fullSnapshot = CreateArchiveSnapshot(latestFull.Path)
      ON error RETURN wrap("failed to load full archive snapshot")
      latestIncremental = findLatestIncrementalArchive(archiveDir, latestFull)
      ON error RETURN wrap("failed to find incremental archive")
      IF latestIncremental is nil THEN RETURN fullSnapshot
      incrementalSnapshot = CreateArchiveSnapshot(latestIncremental.Path)
      ON error RETURN wrap("failed to load incremental archive snapshot")
      # Merge: incremental files override full archive files by RelativePath [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND]
      fullMap = MAP fullSnapshot.Files BY RelativePath
      FOR EACH file IN incrementalSnapshot.Files:
        fullMap[file.RelativePath] = file
      reconstructedFiles = VALUES(fullMap) SORTED BY RelativePath
      RETURN &DirectorySnapshot{Files: reconstructedFiles}

    # [IMPL-DIFF_COMMAND] [ARCH-DIRECTORY_COMPARISON] [REQ-DIFF_COMMAND] — Compares current directory against reconstructed state
    PROCEDURE CalculateDiff(cwd, reconstructedState, excludePatterns) -> (*DiffResult, error):
      currentSnapshot = CreateDirectorySnapshot(cwd, excludePatterns)
      ON error RETURN wrap("failed to create directory snapshot")
      # Filter out directories (archives only contain files) [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND]
      currentMap = MAP currentSnapshot.Files WHERE NOT IsDir BY RelativePath
      reconstructedMap = MAP reconstructedState.Files WHERE NOT IsDir BY RelativePath
      added = []
      modified = []
      FOR path, currentFile IN currentMap:
        IF path NOT IN reconstructedMap THEN APPEND path TO added
        ELSE IF currentFile.Size != reconstructedMap[path].Size OR currentFile.Hash != reconstructedMap[path].Hash THEN APPEND path TO modified
      deleted = []
      FOR path IN reconstructedMap:
        IF path NOT IN currentMap THEN APPEND path TO deleted
      SORT added, modified, deleted
      RETURN &DiffResult{Added: added, Modified: modified, Deleted: deleted}

    # [IMPL-DIFF_COMMAND] [ARCH-CLI_COMMANDS] [REQ-DIFF_COMMAND] [REQ-CONTEXT_SUPPORT] — CLI command handler
    PROCEDURE diffCmd() -> *cobra.Command:
      cmd = cobra.Command{ Use: "diff" }
      cmd.Run = FUNC(cmd, args):
        ctx = cmd.Context() OR context.Background()
        cwd = os.Getwd()
        cfg = LoadConfig(cwd)
        formatter = NewOutputFormatter(cfg)
        archiveDir = prepareArchiveDirectoryWithInterface(archiveConfig, cwd, dryRun)
        reconstructedState = ReconstructArchiveState(archiveDir)
        IF error contains "No archives found" THEN formatter.PrintNoArchivesFound(archiveDir); EXIT 0
        ON other error THEN HandleArchiveError; EXIT
        CHECK ctx cancellation
        diff = CalculateDiff(cwd, reconstructedState, excludePatterns)
        ON error THEN HandleArchiveError; EXIT
        formatter.PrintDiffResult(diff)
      RETURN cmd

    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-OUTPUT_FORMATTING] — Format and print diff results
    PROCEDURE FormatDiffResult(diff) -> string:
      IF diff has no changes THEN RETURN cfg.FormatDiffNoChanges
      result = cfg.FormatDiffChanges header
      FOR EACH file IN diff.Added: APPEND Sprintf(cfg.FormatDiffAdded, file)
      FOR EACH file IN diff.Modified: APPEND Sprintf(cfg.FormatDiffModified, file)
      FOR EACH file IN diff.Deleted: APPEND Sprintf(cfg.FormatDiffDeleted, file)
      RETURN result

    # [IMPL-DIFF_COMMAND] [ARCH-DIFF_COMMAND] [REQ-DIFF_COMMAND] — Block implements documented behavior for: PROCEDURE PrintDiffResult(diff):
    PROCEDURE PrintDiffResult(diff):
      message = FormatDiffResult(diff)
      IF collector THEN collector.AddStdout(message) ELSE fmt.Print(message)
  implementation_approach:
    details:
      - 'Archive Selection Strategy: All selection functions use name-based sorting (ISO 8601 timestamps are alphabetically sortable) instead of file modification times'
      - 'Archive State Reconstruction: Load most recent full archive, apply most recent incremental changes, return reconstructed DirectorySnapshot'
      - 'Change Reporting: Use configurable format strings, display added/modified/deleted files, handle no-changes case'
      - 'CLI Command Integration: diffCmd() in main.go, context cancellation support, added to knownCommands list for auto-detection'
      - 'Directory Comparison: Create snapshot of current directory, compare against reconstructed state, identify added/modified/deleted files, respect exclude patterns'
    summary: Archive state reconstruction from full + incremental archives, directory comparison, change reporting, and CLI command integration
