    functions:
      - CalculateDiff
      - diffCmd
      - findLatestFullArchive
      - findLatestIncrementalArchive
      - FindMostRecentArchive
      - FormatDiffResult
      - PrintDiffResult
      - ReconstructArchiveState
  cross_references:
