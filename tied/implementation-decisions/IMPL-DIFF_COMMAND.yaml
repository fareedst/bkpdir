IMPL-DIFF_COMMAND:
  name: Diff Command Implementation
  status: Active
  description: Implement diff command with archive state reconstruction and comparison engine. Reconstructs effective state by applying incremental on top of full archive, provides accurate change detection, reuses comparison logic for duplicate prevention consistency.
  rationale:
    why: Users need to see what changed since the last archive to decide whether to create a new one
    problems_solved:
      - No visibility into changes since last archive
      - Manual comparison of directory state vs archived state
      - Inconsistent comparison logic between features
    benefits:
      - Accurate change detection by comparing against reconstructed state
      - Reuses comparison logic for duplicate prevention consistency
      - Integrates with existing CLI framework and output formatting
      - Supports context cancellation for long-running operations
      - User-friendly error messages for edge cases
  implementation_approach:
    summary: Archive state reconstruction from full + incremental archives, directory comparison, change reporting, and CLI command integration
    details:
      - 'Archive State Reconstruction: Load most recent full archive, apply most recent incremental changes, return reconstructed DirectorySnapshot'
      - 'Directory Comparison: Create snapshot of current directory, compare against reconstructed state, identify added/modified/deleted files, respect exclude patterns'
      - 'Change Reporting: Use configurable format strings, display added/modified/deleted files, handle no-changes case'
      - 'CLI Command Integration: diffCmd() in main.go, context cancellation support, added to knownCommands list for auto-detection'
      - 'Archive Selection Strategy: All selection functions use name-based sorting (ISO 8601 timestamps are alphabetically sortable) instead of file modification times'
  cross_references:
