    # [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005] [REQ-CONFIGURATION]
    # Bug fixes for inheritance path resolution: buildChainRecursive passes directory [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005]
    # (not file path) as basePath; resolvePath expands ~ before resolving; resolvePath [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005]
    # distinguishes directory vs file basePath. [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005]

    # [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: procedure ExpandPath(path):
    procedure ExpandPath(path):
      # Expands ~ and environment variables in a path string. [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005]
      IF path is empty THEN RETURN error
      IF path starts with "~/" THEN
        homeDir = os.UserHomeDir()
        RETURN join(homeDir, path[2:])
      RETURN os.ExpandEnv(path)

    # [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: procedure resolvePath(path, basePath):
    procedure resolvePath(path, basePath):
      # [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] — resolves path relative to basePath with ~ expansion. [ARCH-CFG_005] [REQ-CFG_005] [REQ-CONFIGURATION]
      expandedPath = ExpandPath(path)
      IF expandedPath is absolute THEN RETURN clean(expandedPath)
      IF basePath is empty THEN RETURN expandedPath
      # Determine if basePath is a directory or file [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005]
      IF stat(basePath).IsDir() THEN
        baseDir = basePath
      ELSE
        baseDir = filepath.Dir(basePath)
      # If basePath doesn't exist, assume it's already a directory (from filepath.Dir) [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005]
      RETURN clean(join(baseDir, expandedPath))

    # [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: procedure buildChainRecursive(configPath, basePath, pathResolver, chain):
    procedure buildChainRecursive(configPath, basePath, pathResolver, chain):
      # [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] — builds inheritance chain recursively. [ARCH-CFG_005] [REQ-CFG_005] [REQ-CONFIGURATION]
      resolvedPath = pathResolver.resolvePath(configPath, basePath)
      IF chain.visited[resolvedPath] THEN RETURN error("circular dependency")
      pathResolver.validatePath(resolvedPath)
      chain.visited[resolvedPath] = true
      inheritance = loadInheritanceMetadata(resolvedPath)
      FOR EACH parentPath IN inheritance:
        # KEY FIX: pass filepath.Dir(resolvedPath) not resolvedPath as basePath [IMPL-CFG_INHERITANCE_PATH_RESOLUTION] [ARCH-CFG_005] [REQ-CFG_005]
        buildChainRecursive(parentPath, filepath.Dir(resolvedPath), pathResolver, chain)
      chain.files.append(resolvedPath)
