  from_archive: "```go\nfunc CreateArchiveSnapshot(archivePath string) (*DirectorySnapshot, error) {\n    reader, err := zip.OpenReader(archivePath)\n    if err != nil {\n        return nil, err\n    }\n    defer reader.Close()\n    \n    snapshot := &DirectorySnapshot{\n        Files: make(map[string]FileInfo),\n        Root:  archivePath,\n    }\n    \n    for _, file := range reader.File {\n        hash := calculateArchiveFileHash(file)\n        snapshot.Files[file.Name] = FileInfo{\n            Path:    file.Name,\n            Size:    int64(file.UncompressedSize64),\n            ModTime: file.ModTime(),\n            Hash:    hash,\n            IsDir:   file.FileInfo().IsDir(),\n        }\n    }\n    \n    return snapshot, nil\n}\n```"
  from_directory: "```go\nfunc CreateDirectorySnapshot(root string, exclusions []string) (*DirectorySnapshot, error) {\n    snapshot := &DirectorySnapshot{\n        Files: make(map[string]FileInfo),\n        Root:  root,\n    }\n    \n    err := WalkWithExclusions(root, exclusions, func(path string, info os.FileInfo, err error) error {\n        if err != nil {\n            return err\n        }\n        \n        hash := calculateFileHash(path)\n        snapshot.Files[path] = FileInfo{\n            Path:    path,\n            Size:    info.Size(),\n            ModTime: info.ModTime(),\n            Hash:    hash,\n            IsDir:   info.IsDir(),\n        }\n        return nil\n    })\n    \n    return snapshot, err\n}\n```"
  essence_pseudocode: "# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] — Snapshot-based comparison with hash-based content verification [REQ-PERFORMANCE] [REQ-DIFF_COMMAND] [REQ-FILE_BACKUP]\n\n## Data types (pkg/fileops/comparison.go) [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE]\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] — core comparison data structures [REQ-PERFORMANCE] [REQ-DIFF_COMMAND] [REQ-FILE_BACKUP]\n\nTYPE FileInfo { RelativePath string, Size int64, ModTime time.Time, IsDir bool, Hash string }\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE] — Block implements documented behavior for: TYPE DirectorySnapshot { Files []FileInfo }\nTYPE DirectorySnapshot { Files []FileInfo }\n\n## Snapshot creation [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE]\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] — walk tree, compute SHA-256 hashes [REQ-PERFORMANCE] [REQ-DIFF_COMMAND]\
    \ [REQ-FILE_BACKUP]\n\nprocedure CreateDirectorySnapshot(rootPath, excludePatterns) -> (*DirectorySnapshot, error):\n  INPUT: rootPath string, excludePatterns []string\n  OUTPUT: snapshot with sorted FileInfo entries for all non-excluded files/dirs\n  Walk(rootPath):\n    FOR EACH path, info:\n      relPath = Rel(rootPath, path)\n      IF relPath == \".\" THEN skip\n      IF ShouldExcludeFile(relPath, excludePatterns) THEN SkipDir or skip\n      fileInfo = { RelativePath, Size, ModTime, IsDir }\n      IF !IsDir THEN fileInfo.Hash = calculateFileHash(path)\n      append(files, fileInfo)\n  Sort files by RelativePath\n  RETURN &DirectorySnapshot{files}\n\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE] — Block implements documented behavior for: procedure CreateArchiveSnapshot(archivePath) -> (*DirectorySnapshot, error):\nprocedure CreateArchiveSnapshot(archivePath) -> (*DirectorySnapshot, error):\n  INPUT: archivePath string (ZIP file path)\n  OUTPUT: snapshot\
    \ with sorted FileInfo entries for archive contents\n  reader = zip.OpenReader(archivePath)\n  FOR EACH file in reader:\n    IF name ends with \"/\" THEN skip  # directories are implicit\n    fileInfo = { RelativePath: file.Name, Size: file.UncompressedSize64, ModTime: file.Modified }\n    fileInfo.Hash = calculateArchiveFileHash(file)\n    append(files, fileInfo)\n  Sort files by RelativePath\n  RETURN &DirectorySnapshot{files}\n\n## Hash calculation [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE]\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] — SHA-256 content hashing [REQ-PERFORMANCE] [REQ-DIFF_COMMAND] [REQ-FILE_BACKUP]\n\nprocedure calculateFileHash(filePath) -> (string, error):\n  file = Open(filePath); hash = sha256.New(); io.Copy(hash, file)\n  RETURN hex(hash.Sum(nil))\n\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE] — Block implements documented behavior for: procedure calculateArchiveFileHash(zipFile) -> (string,\
    \ error):\nprocedure calculateArchiveFileHash(zipFile) -> (string, error):\n  reader = zipFile.Open(); hash = sha256.New(); io.Copy(hash, reader)\n  RETURN hex(hash.Sum(nil))\n\n## Snapshot comparison [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE]\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] — sorted element-wise comparison [REQ-PERFORMANCE] [REQ-DIFF_COMMAND] [REQ-FILE_BACKUP]\n\nprocedure CompareSnapshots(snapshot1, snapshot2) -> bool:\n  IF len(snapshot1.Files) != len(snapshot2.Files) THEN RETURN false\n  FOR i, file1 in snapshot1.Files:\n    file2 = snapshot2.Files[i]\n    IF file1.RelativePath != file2.RelativePath THEN RETURN false\n    IF file1.Size != file2.Size OR file1.IsDir != file2.IsDir THEN RETURN false\n    IF !file1.IsDir AND file1.Hash != file2.Hash THEN RETURN false\n  RETURN true\n\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE] — Block implements documented behavior for: procedure IsDirectoryIdenticalToArchive(dirPath,\
    \ archivePath, excludePatterns) -> (bool, error):\nprocedure IsDirectoryIdenticalToArchive(dirPath, archivePath, excludePatterns) -> (bool, error):\n  dirSnapshot = CreateDirectorySnapshot(dirPath, excludePatterns)\n  archiveSnapshot = CreateArchiveSnapshot(archivePath)\n  RETURN CompareSnapshots(dirSnapshot, archiveSnapshot)\n\n## Archive discovery (comparison.go adapter) [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE]\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] — find most recent archives [REQ-PERFORMANCE] [REQ-DIFF_COMMAND] [REQ-FILE_BACKUP]\n\nprocedure FindMostRecentArchive(archiveDir) -> (string, error):\n  archives = ListArchives(archiveDir)\n  Filter: keep only non-incremental (full) archives\n  Sort by name ascending (timestamps in names are alphabetically sortable)\n  RETURN last archive path (most recent)\n\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE] — Block implements documented behavior for: procedure\
    \ CheckForIdenticalArchive(dirPath, archiveDir, excludePatterns) -> (bool, string, error):\nprocedure CheckForIdenticalArchive(dirPath, archiveDir, excludePatterns) -> (bool, string, error):\n  mostRecent = FindMostRecentArchive(archiveDir)\n  IF mostRecent == \"\" THEN RETURN false, \"\", nil\n  identical = IsDirectoryIdenticalToArchive(dirPath, mostRecent, excludePatterns)\n  RETURN identical, mostRecent, nil\n\n## Summary generation (comparison.go adapter) [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE]\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] — textual summary of directory/archive contents [REQ-PERFORMANCE] [REQ-DIFF_COMMAND] [REQ-FILE_BACKUP]\n\nprocedure GetDirectoryTreeSummary(dirPath, excludePatterns) -> (string, error):\n  snapshot = CreateDirectorySnapshot(dirPath, excludePatterns)\n  FOR EACH file: format as [DIR] or [FILE] with size\n  RETURN formatted summary\n\n# [IMPL-DIRECTORY_COMPARISON] [ARCH-DIRECTORY_COMPARISON] [REQ-PERFORMANCE]\
    \ — Block implements documented behavior for: procedure GetArchiveTreeSummary(archivePath) -> (string, error):\nprocedure GetArchiveTreeSummary(archivePath) -> (string, error):\n  snapshot = CreateArchiveSnapshot(archivePath)\n  FOR EACH file: format as [FILE] with size\n  RETURN formatted summary"
