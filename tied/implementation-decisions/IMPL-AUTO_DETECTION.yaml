  code_markers: '`main.go` path detection functions, `executeWithAutoDetection()`, `handleAutoDetectedCommand()`'
  detection_functions: |-
    ```go
    func isFile(path string) bool {
        info, err := os.Stat(path)
        if err != nil {
            return false
        }
        return info.Mode().IsRegular()
    }

    func isDirectory(path string) bool {
        info, err := os.Stat(path)
        if err != nil {
            return false
        }
        return info.IsDir()
    }

    func validatePath(path string) error {
        _, err := os.Stat(path)
        if err != nil {
            if os.IsNotExist(err) {
                return fmt.Errorf("path does not exist: %s", path)
            }
            if os.IsPermission(err) {
                return fmt.Errorf("permission denied accessing path: %s", path)
            }
            return fmt.Errorf("error accessing path %s: %v", path, err)
        }
        return nil
    }
    ```
  integration_with_cobra: "```go\nfunc executeWithAutoDetection(rootCmd *cobra.Command) error {\n    args := os.Args[1:]\n    \n    // Check for known commands/flags\n    // If not known, trigger auto-detection\n    // Otherwise execute normally\n}\n```"
  known_commands_bypass:
    - 'Explicit commands: `create`, `config`, `list`, `verify`, `backup`, `version`'
    - 'Global flags: `--config`, `--dry-run`, `--list`'
    - 'Help flags: `--help`, `-h`, `--version`, `-v`'
  routing_logic: "```go\nfunc handleAutoDetectedCommand(args []string) {\n    path := args[0]\n    \n    if err := validatePath(path); err != nil {\n        // Handle error\n    }\n    \n    if isFile(path) {\n        handleAutoDetectedFileBackup(args)\n    } else if isDirectory(path) {\n        handleAutoDetectedDirectoryArchive(args)\n    } else {\n        // Handle unsupported types\n    }\n}\n```"
