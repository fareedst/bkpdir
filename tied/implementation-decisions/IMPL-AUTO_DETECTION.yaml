      - TestComposition_ExecuteWithAutoDetection_KnownSubcommandHelp_REQ_USABILITY
      - TestComposition_ExecuteWithAutoDetection_PathArg_FileDryRun_REQ_USABILITY
      - TestComposition_NewRootCommand_Subcommands_REQ_USABILITY
