IMPL-CFG_MERGE_BEHAVIOR_REGISTRY:
  name: Field-Level Merge Behavior Registry
  status: Active
  cross_references:
  - ARCH-CFG_005
  - ARCH-CFG_001
  - REQ-CFG_005
  - REQ-CONFIGURATION
  rationale:
    why: 'Conflict resolution: CFG-005 requires array fields to merge/accumulate by default, while CFG-001 requires earlier files to take precedence.

      Solution: Field-level registry specifies merge behavior per field, allowing different fields to have different precedence rules.

      Enables fine-grained control: Some fields (like exclude_patterns) should always merge, while others (like archive_dir_path) should respect earlier file precedence.

      Maintains backward compatibility: Default behavior preserved, explicit prefixes still work.'
    problems_solved:
    - CFG-005 and CFG-001 have conflicting merge requirements for different field types
    - No mechanism existed to specify per-field merge behavior
    - Explicit prefix (!, +, ^, =) interaction with default behavior was undefined
    benefits:
    - Per-field merge behavior control via registry map
    - Clean separation of accumulate vs precedence fields
    - Explicit prefixes still override default behavior
    - Unknown fields default to precedence (safe default)
  implementation_approach:
    summary: FieldMergeBehavior type with Accumulate and Precedence constants; fieldMergeBehaviors registry map specifies behavior per field; getFieldMergeBehavior() lookups drive merge and replace logic.
    details:
    - FieldMergeBehavior type (int enum) with MergeBehaviorAccumulate and MergeBehaviorPrecedence
    - fieldMergeBehaviors map registers per-field behavior (exclude_patterns=Accumulate, scalars=Precedence)
    - getFieldMergeBehavior() returns registered behavior, defaults to MergeBehaviorPrecedence
    - applyMergeStrategies() uses registry to determine default strategy for accumulate fields
    - applyReplace() uses registry to determine if precedence check applies
