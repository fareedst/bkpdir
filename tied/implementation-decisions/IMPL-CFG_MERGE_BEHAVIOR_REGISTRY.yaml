    # [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [ARCH-CFG_001] [REQ-CFG_005] [REQ-CONFIGURATION]
    # Field-level merge behavior registry resolving conflict between CFG-005 (array merge) and CFG-001 (precedence). [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005]

    # [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: DATA FieldMergeBehavior int:
    DATA FieldMergeBehavior int:
      MergeBehaviorAccumulate = 0   # Field accumulates values from all files (CFG-005)
      MergeBehaviorPrecedence = 1   # Field respects earlier file precedence (CFG-001)

    # [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: DATA fieldMergeBehaviors map[string]FieldMergeBehavior:
    DATA fieldMergeBehaviors map[string]FieldMergeBehavior:
      # Registry specifying merge behavior per configuration field [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005]
      "exclude_patterns"               -> MergeBehaviorAccumulate   # CFG-005: Merge by default
      "archive_dir_path"               -> MergeBehaviorPrecedence   # CFG-001: Earlier files win
      "include_git_info"               -> MergeBehaviorPrecedence   # CFG-001: Earlier files win
      "show_git_dirty_status"          -> MergeBehaviorPrecedence   # CFG-001: Earlier files win
      "skip_broken_symlinks"           -> MergeBehaviorPrecedence   # CFG-001: Earlier files win
      "use_current_dir_name"           -> MergeBehaviorPrecedence   # CFG-001: Earlier files win
      "backup_dir_path"                -> MergeBehaviorPrecedence   # CFG-001: Earlier files win
      "use_current_dir_name_for_files" -> MergeBehaviorPrecedence   # CFG-001: Earlier files win

    # [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: PROCEDURE getFieldMergeBehavior(fieldName string) -> FieldMergeBehavior:
    PROCEDURE getFieldMergeBehavior(fieldName string) -> FieldMergeBehavior:
      # Returns registered behavior for field, defaults to Precedence for unknown fields [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005]
      IF fieldName in fieldMergeBehaviors THEN
        RETURN fieldMergeBehaviors[fieldName]
      END
      RETURN MergeBehaviorPrecedence   # Safe default (CFG-001)

    # [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005] — Block implements documented behavior for: PROCEDURE applyReplace(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields) -> error:
    PROCEDURE applyReplace(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields) -> error:
      # [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [IMPL-CFG_PRECEDENCE_FIX] [ARCH-CFG_001] [REQ-CONFIGURATION]
      # Uses registry in precedence check for replace (!) strategy [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005]
      IF NOT inheritContext AND dstValue != nil AND defaultCfg != nil THEN
        defaultValue := getDefaultValueForKey(key, defaultCfg)
        wasSetByEarlierFile := explicitlySetFields != nil AND explicitlySetFields[key]
        # Earlier file precedence applies to both Accumulate and Precedence fields [IMPL-CFG_MERGE_BEHAVIOR_REGISTRY] [ARCH-CFG_005] [REQ-CFG_005]
        IF dstValue != defaultValue OR wasSetByEarlierFile THEN
          RETURN nil   # Skip replace to respect earlier file precedence
        END
      END
      setConfigField(result, key, value)
