    # [IMPL-TEST_EXCLUDE_MERGE] [ARCH-TEST_EXCLUDE_MERGE] [REQ-TEST_EXCLUDE_MERGE] [REQ-CONFIGURATION] [REQ-CFG_006] — Comprehensive test scenario for exclude patterns merging and source tracking

    procedure TestExcludePatternsMerge_REQ_TEST_EXCLUDE_MERGE():
      # [IMPL-TEST_EXCLUDE_MERGE] [ARCH-TEST_EXCLUDE_MERGE] [REQ-TEST_EXCLUDE_MERGE] — validates exclude_patterns merge from multiple config files and source attribution
      save BKPDIR_CONFIG env; defer restore

      subtest "exclude patterns merged from defaults and local config":
        # [REQ-CONFIGURATION] [REQ-CFG_006] — verifies defaults + local config merge and config command source attribution
        create temp dir
        create local .bkpdir.yml with exclude_patterns: ["demo/batches/", "*.log"]
        verify file was written correctly (diagnostic)

        # Direct merge validation (bypassing full LoadConfig)
        call loadSingleConfigFile(localConfigPath) → loadResult
        log loadResult.config.ExcludePatterns and rawMap keys (diagnostic)
        call applyMergeStrategies(DefaultConfig(), loadResult.config, true, loadResult.rawMap, initialDefault, nil)
        assert merged patterns == [".git/", "vendor/", "demo/batches/", "*.log"]

        # Full LoadConfig validation
        set BKPDIR_CONFIG = localConfigPath
        call LoadConfig(dir)
        assert cfg.ExcludePatterns == [".git/", "vendor/", "demo/batches/", "*.log"]

        # Source attribution validation [REQ-CFG_006]
        call GetAllConfigValuesWithSources(cfg, dir)
        find exclude_patterns entry
        assert source != "default"
        assert source contains ".bkpdir.yml"
        assert inheritanceChain is non-empty

      subtest "duplicate patterns are deduplicated":
        # [REQ-TEST_EXCLUDE_MERGE] — verifies duplicate patterns across multiple config files are deduplicated
        create duplicate.yml with exclude_patterns: [".git/", "demo/batches/", "new_pattern"]
        set BKPDIR_CONFIG = localConfigPath:duplicateConfigPath
        call LoadConfig(dir)
        count pattern occurrences; assert each count == 1 (no duplicates)
        assert all expected unique patterns present: [".git/", "vendor/", "demo/batches/", "*.log", "new_pattern"]
      end
