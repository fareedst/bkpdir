  essence_pseudocode: "# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Reliable file traversal and path validation for CLI applications. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Traverser walks directories with configurable exclusion, depth, symlink, [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# and hidden-file options. PathValidator checks existence, permissions, [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# and security (path traversal, suspicious chars). [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n\n# ── Traversal ────────────────────────────────────────────────────── [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Provides Traverser interface + DefaultTraverser with pattern-based exclusion. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS]\
    \ [REQ-RELIABILITY] — Block implements documented behavior for: DATA TraversalOptions:\nDATA TraversalOptions:\n  ExcludePatterns  []string\n  FollowSymlinks   bool\n  MaxDepth         int       # -1 means unlimited\n  IgnoreHidden     bool\n  IgnorePermErrors bool\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: INTERFACE Traverser:\nINTERFACE Traverser:\n  Walk(root, visitor) -> error\n  WalkWithOptions(root, options, visitor) -> error\n  ListFiles(root, recursive) -> ([]string, error)\n  ListFilesWithExclusions(root, excludePatterns, recursive) -> ([]string, error)\n\n# Creates traverser with optional pre-configured exclusion patterns [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure NEW_TRAVERSER(patterns?) -> Traverser:\nprocedure NEW_TRAVERSER(patterns?) -> Traverser:\n  IF patterns\
    \ provided:\n    RETURN DefaultTraverser{ matcher = NewPatternMatcher(patterns) }\n  ELSE:\n    RETURN DefaultTraverser{}\n\n# Basic walk delegates to WalkWithOptions with defaults [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure WALK(root, visitor) -> error:\nprocedure WALK(root, visitor) -> error:\n  options = TraversalOptions{ FollowSymlinks=false, MaxDepth=-1 }\n  RETURN WALK_WITH_OPTIONS(root, options, visitor)\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Validates root, builds exclusion matcher, starts recursive walk. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure WALK_WITH_OPTIONS(root, options, visitor) -> error:\nprocedure WALK_WITH_OPTIONS(root, options, visitor) -> error:\n  IF\
    \ ValidatePath(root) fails: RETURN error(\"invalid root path\")\n  IF ValidateExistence(root) fails: RETURN error\n  exclusionMatcher = nil\n  IF options.ExcludePatterns not empty:\n    exclusionMatcher = NewPatternMatcher(options.ExcludePatterns)\n  ELSE IF self.matcher != nil:\n    exclusionMatcher = self.matcher\n  RETURN WALK_RECURSIVE(root, root, depth=0, options, exclusionMatcher, visitor)\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Core recursive traversal handling depth, exclusion, hidden, symlinks. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure WALK_RECURSIVE(root, currentPath, depth, options, matcher, visitor) -> error:\nprocedure WALK_RECURSIVE(root, currentPath, depth, options, matcher, visitor) -> error:\n  IF options.MaxDepth >= 0 AND depth > MaxDepth: RETURN nil\n  info = Lstat(currentPath)\n  IF error AND\
    \ IgnorePermErrors AND IsPermission: RETURN nil\n  IF error: RETURN visitor(path, nil, error)\n  relPath = Rel(root, currentPath)\n  IF relPath == \".\": relPath = \"\"\n  # Exclusion check [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n  IF matcher != nil AND relPath != \"\" AND matcher.ShouldExclude(relPath):\n    IF info.IsDir: RETURN SkipDir\n    RETURN nil\n  # Hidden file check [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n  IF IgnoreHidden AND relPath != \"\" AND base starts with \".\":\n    IF info.IsDir: RETURN SkipDir\n    RETURN nil\n  # Symlink handling [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n  IF info is symlink:\n    IF NOT FollowSymlinks: RETURN visitor(path, info, nil)\n    resolve symlink to realPath; get realInfo\n    IF error: handle per IgnorePermErrors\n    info = realInfo\n  # Visit current path [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n  err = visitor(currentPath, info, nil)\n\
    \  IF err == SkipDir AND isDir: RETURN nil\n  IF err: RETURN err\n  # Recurse into directories [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n  IF info.IsDir:\n    entries = ReadDir(currentPath)\n    FOR entry IN entries:\n      err = WALK_RECURSIVE(root, Join(currentPath, entry.Name), depth+1, ...)\n      IF err: RETURN err\n  RETURN nil\n\n# List files delegates to ListFilesWithExclusions [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure LIST_FILES(root, recursive) -> ([]string, error):\nprocedure LIST_FILES(root, recursive) -> ([]string, error):\n  RETURN LIST_FILES_WITH_EXCLUSIONS(root, nil, recursive)\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Walks and collects regular files; ignores errors in listing mode. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS]\
    \ [REQ-RELIABILITY] — Block implements documented behavior for: procedure LIST_FILES_WITH_EXCLUSIONS(root, excludePatterns, recursive) -> ([]string, error):\nprocedure LIST_FILES_WITH_EXCLUSIONS(root, excludePatterns, recursive) -> ([]string, error):\n  files = []\n  options = TraversalOptions{ ExcludePatterns, FollowSymlinks=false, IgnorePermErrors=true }\n  IF NOT recursive: options.MaxDepth = 0\n  visitor = func(path, info, err):\n    IF err: RETURN nil  # ignore errors\n    IF NOT info.IsDir: files.append(path)\n    RETURN nil\n  err = WALK_WITH_OPTIONS(root, options, visitor)\n  RETURN files, err\n\n# ── Path Validation ──────────────────────────────────────────────── [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Provides Validator interface + PathValidator for security-aware checks. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS]\
    \ [REQ-RELIABILITY] — Block implements documented behavior for: INTERFACE Validator:\nINTERFACE Validator:\n  ValidatePath(path) -> error\n  ValidateExistence(path) -> error\n  ValidateReadable(path) -> error\n  ValidateWritable(path) -> error\n  IsSecurePath(path) -> bool\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_PATH(path) -> error:\nprocedure VALIDATE_PATH(path) -> error:\n  IF path == \"\": RETURN error(\"path cannot be empty\")\n  IF NOT IS_SECURE_PATH(path): RETURN error(\"path contains unsafe elements\")\n  Clean(path)  # note: cleaned != original is allowed\n  RETURN nil\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_EXISTENCE(path) -> error:\nprocedure VALIDATE_EXISTENCE(path) -> error:\n  IF VALIDATE_PATH(path) fails: RETURN error\n  info, err = Stat(path)\n  IF IsNotExist: RETURN error(\"path does not\
    \ exist\")\n  IF err: RETURN error(\"cannot access path\")\n  RETURN nil\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_READABLE(path) -> error:\nprocedure VALIDATE_READABLE(path) -> error:\n  IF VALIDATE_EXISTENCE(path) fails: RETURN error\n  file = Open(path)\n  IF err: RETURN error(\"path is not readable\")\n  file.Close()\n  RETURN nil\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Writability check — directory via temp file probe, file via O_WRONLY open. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_WRITABLE(path) -> error:\nprocedure VALIDATE_WRITABLE(path) -> error:\n  IF VALIDATE_PATH(path) fails: RETURN error\n  info, err = Stat(path)\n  IF IsNotExist: RETURN VALIDATE_WRITABLE(parent(path))  # recurse to parent\n  IF err:\
    \ RETURN error(\"cannot access path\")\n  IF info.IsDir:\n    tempFile = Create(Join(path, \".tmp_write_test\"))\n    IF err: RETURN error(\"directory is not writable\")\n    tempFile.Close(); Remove(tempFile)\n  ELSE:\n    file = OpenFile(path, O_WRONLY)\n    IF err: RETURN error(\"file is not writable\")\n    file.Close()\n  RETURN nil\n\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# Rejects paths with \"..\", \"~\", \"$\", null bytes, and control characters. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]\n# [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure IS_SECURE_PATH(path) -> bool:\nprocedure IS_SECURE_PATH(path) -> bool:\n  IF Contains(path, \"..\"): RETURN false\n  suspicious = [\"~\", \"$\", \"\\x00\", \"\\r\", \"\\n\"]\n  FOR pattern IN suspicious:\n    IF Contains(path, pattern): RETURN false\n  RETURN true"
