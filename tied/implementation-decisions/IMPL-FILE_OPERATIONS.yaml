    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Reliable file traversal and path validation for CLI applications. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Traverser walks directories with configurable exclusion, depth, symlink, [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # and hidden-file options. PathValidator checks existence, permissions, [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # and security (path traversal, suspicious chars). [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]

    # ── Traversal ────────────────────────────────────────────────────── [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Provides Traverser interface + DefaultTraverser with pattern-based exclusion. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: DATA TraversalOptions:
    DATA TraversalOptions:
      ExcludePatterns  []string
      FollowSymlinks   bool
      MaxDepth         int       # -1 means unlimited
      IgnoreHidden     bool
      IgnorePermErrors bool

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: INTERFACE Traverser:
    INTERFACE Traverser:
      Walk(root, visitor) -> error
      WalkWithOptions(root, options, visitor) -> error
      ListFiles(root, recursive) -> ([]string, error)
      ListFilesWithExclusions(root, excludePatterns, recursive) -> ([]string, error)

    # Creates traverser with optional pre-configured exclusion patterns [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure NEW_TRAVERSER(patterns?) -> Traverser:
    procedure NEW_TRAVERSER(patterns?) -> Traverser:
      IF patterns provided:
        RETURN DefaultTraverser{ matcher = NewPatternMatcher(patterns) }
      ELSE:
        RETURN DefaultTraverser{}

    # Basic walk delegates to WalkWithOptions with defaults [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure WALK(root, visitor) -> error:
    procedure WALK(root, visitor) -> error:
      options = TraversalOptions{ FollowSymlinks=false, MaxDepth=-1 }
      RETURN WALK_WITH_OPTIONS(root, options, visitor)

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Validates root, builds exclusion matcher, starts recursive walk. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure WALK_WITH_OPTIONS(root, options, visitor) -> error:
    procedure WALK_WITH_OPTIONS(root, options, visitor) -> error:
      IF ValidatePath(root) fails: RETURN error("invalid root path")
      IF ValidateExistence(root) fails: RETURN error
      exclusionMatcher = nil
      IF options.ExcludePatterns not empty:
        exclusionMatcher = NewPatternMatcher(options.ExcludePatterns)
      ELSE IF self.matcher != nil:
        exclusionMatcher = self.matcher
      RETURN WALK_RECURSIVE(root, root, depth=0, options, exclusionMatcher, visitor)

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Core recursive traversal handling depth, exclusion, hidden, symlinks. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure WALK_RECURSIVE(root, currentPath, depth, options, matcher, visitor) -> error:
    procedure WALK_RECURSIVE(root, currentPath, depth, options, matcher, visitor) -> error:
      IF options.MaxDepth >= 0 AND depth > MaxDepth: RETURN nil
      info = Lstat(currentPath)
      IF error AND IgnorePermErrors AND IsPermission: RETURN nil
      IF error: RETURN visitor(path, nil, error)
      relPath = Rel(root, currentPath)
      IF relPath == ".": relPath = ""
      # Exclusion check [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
      IF matcher != nil AND relPath != "" AND matcher.ShouldExclude(relPath):
        IF info.IsDir: RETURN SkipDir
        RETURN nil
      # Hidden file check [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
      IF IgnoreHidden AND relPath != "" AND base starts with ".":
        IF info.IsDir: RETURN SkipDir
        RETURN nil
      # Symlink handling [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
      IF info is symlink:
        IF NOT FollowSymlinks: RETURN visitor(path, info, nil)
        resolve symlink to realPath; get realInfo
        IF error: handle per IgnorePermErrors
        info = realInfo
      # Visit current path [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
      err = visitor(currentPath, info, nil)
      IF err == SkipDir AND isDir: RETURN nil
      IF err: RETURN err
      # Recurse into directories [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
      IF info.IsDir:
        entries = ReadDir(currentPath)
        FOR entry IN entries:
          err = WALK_RECURSIVE(root, Join(currentPath, entry.Name), depth+1, ...)
          IF err: RETURN err
      RETURN nil

    # List files delegates to ListFilesWithExclusions [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure LIST_FILES(root, recursive) -> ([]string, error):
    procedure LIST_FILES(root, recursive) -> ([]string, error):
      RETURN LIST_FILES_WITH_EXCLUSIONS(root, nil, recursive)

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Walks and collects regular files; ignores errors in listing mode. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure LIST_FILES_WITH_EXCLUSIONS(root, excludePatterns, recursive) -> ([]string, error):
    procedure LIST_FILES_WITH_EXCLUSIONS(root, excludePatterns, recursive) -> ([]string, error):
      files = []
      options = TraversalOptions{ ExcludePatterns, FollowSymlinks=false, IgnorePermErrors=true }
      IF NOT recursive: options.MaxDepth = 0
      visitor = func(path, info, err):
        IF err: RETURN nil  # ignore errors
        IF NOT info.IsDir: files.append(path)
        RETURN nil
      err = WALK_WITH_OPTIONS(root, options, visitor)
      RETURN files, err

    # ── Path Validation ──────────────────────────────────────────────── [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Provides Validator interface + PathValidator for security-aware checks. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: INTERFACE Validator:
    INTERFACE Validator:
      ValidatePath(path) -> error
      ValidateExistence(path) -> error
      ValidateReadable(path) -> error
      ValidateWritable(path) -> error
      IsSecurePath(path) -> bool

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_PATH(path) -> error:
    procedure VALIDATE_PATH(path) -> error:
      IF path == "": RETURN error("path cannot be empty")
      IF NOT IS_SECURE_PATH(path): RETURN error("path contains unsafe elements")
      Clean(path)  # note: cleaned != original is allowed
      RETURN nil

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_EXISTENCE(path) -> error:
    procedure VALIDATE_EXISTENCE(path) -> error:
      IF VALIDATE_PATH(path) fails: RETURN error
      info, err = Stat(path)
      IF IsNotExist: RETURN error("path does not exist")
      IF err: RETURN error("cannot access path")
      RETURN nil

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_READABLE(path) -> error:
    procedure VALIDATE_READABLE(path) -> error:
      IF VALIDATE_EXISTENCE(path) fails: RETURN error
      file = Open(path)
      IF err: RETURN error("path is not readable")
      file.Close()
      RETURN nil

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Writability check — directory via temp file probe, file via O_WRONLY open. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure VALIDATE_WRITABLE(path) -> error:
    procedure VALIDATE_WRITABLE(path) -> error:
      IF VALIDATE_PATH(path) fails: RETURN error
      info, err = Stat(path)
      IF IsNotExist: RETURN VALIDATE_WRITABLE(parent(path))  # recurse to parent
      IF err: RETURN error("cannot access path")
      IF info.IsDir:
        tempFile = Create(Join(path, ".tmp_write_test"))
        IF err: RETURN error("directory is not writable")
        tempFile.Close(); Remove(tempFile)
      ELSE:
        file = OpenFile(path, O_WRONLY)
        IF err: RETURN error("file is not writable")
        file.Close()
      RETURN nil

    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # Rejects paths with "..", "~", "$", null bytes, and control characters. [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY]
    # [IMPL-FILE_OPERATIONS] [ARCH-FILE_OPERATIONS] [REQ-RELIABILITY] — Block implements documented behavior for: procedure IS_SECURE_PATH(path) -> bool:
    procedure IS_SECURE_PATH(path) -> bool:
      IF Contains(path, ".."): RETURN false
      suspicious = ["~", "$", "\x00", "\r", "\n"]
      FOR pattern IN suspicious:
        IF Contains(path, pattern): RETURN false
      RETURN true
