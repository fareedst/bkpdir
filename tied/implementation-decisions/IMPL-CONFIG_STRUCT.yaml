  essence_pseudocode: |-
    # [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [ARCH-CFG_006] [REQ-CONFIGURATION] [REQ-CFG_006]
    # Defines configuration struct, default values, reflection-based field discovery, and value extraction for display.

    DATA Config struct:
      # All configuration fields with YAML tags for serialization and display
      ArchiveDirPath string       `yaml:"archive_dir_path"`
      UseCurrentDirName bool      `yaml:"use_current_dir_name"`
      ExcludePatterns []string    `yaml:"exclude_patterns"`
      IncludeGitInfo bool         `yaml:"include_git_info"`      # Legacy
      ShowGitDirtyStatus bool     `yaml:"show_git_dirty_status"` # Legacy
      Inherit []string            `yaml:"inherit,omitempty"`     # CFG-005 inheritance
      Git *GitConfig              `yaml:"git,omitempty"`         # Nested git config
      BackupDirPath string        `yaml:"backup_dir_path"`
      UseCurrentDirNameForFiles bool
      StatusCodes (directory + file)
      FormatStrings (printf + template, directory + file)
      Patterns (regex for archive, backup, config, timestamp)
      Extended format strings and templates

    DATA configFieldInfo struct:
      # Metadata for a single configuration field discovered via reflection
      Name, YAMLName, Type string
      Kind reflect.Kind
      Value interface{}
      IsPointer, IsSlice, IsStruct bool
      Category, Path string
      Importance int

    PROCEDURE DefaultConfig() -> *Config:
      # Returns Config populated with preset default values
      RETURN &Config{
        ArchiveDirPath: "../.bkpdir",
        UseCurrentDirName: true,
        ExcludePatterns: [".git/", "vendor/"],
        Git: DefaultGitConfig(),
        BackupDirPath: "../.bkpdir",
        StatusCodes: standard exit codes,
        FormatStrings: default printf patterns,
        Templates: default template patterns,
        Patterns: default regex patterns
      }

    PROCEDURE GetAllConfigFields(cfg *Config) -> []configFieldInfo:
      # [IMPL-CONFIG_STRUCT] [ARCH-CFG_006] [REQ-CFG_006] — Uses cached reflection to discover all config fields
      IF cachedFields := globalFieldCache.getCachedFields() THEN
        # Performance: reuse cached field metadata, update values only
        RETURN updateFieldValues(cachedFields, cfg)
      END
      # Cache miss: perform expensive reflection
      configType := reflect.TypeOf(*cfg)
      configValue := reflect.ValueOf(*cfg)
      fields := reflectConfigFields(configType, configValue, "", "")
      SORT fields by Name
      # Cache field metadata (without values) for future calls
      globalFieldCache.setCachedFields(fieldMetadata)
      RETURN fields

    PROCEDURE reflectConfigFields(structType, structValue, prefix, category) -> []configFieldInfo:
      # Recursively walks struct fields extracting YAML tag names, types, and values
      FOR i := 0; i < structType.NumField(); i++:
        field := structType.Field(i)
        # Skip unexported fields
        IF NOT field.IsExported() THEN CONTINUE END
        # Extract YAML tag name (e.g., "archive_dir_path" from yaml:"archive_dir_path")
        yamlName := extractYAMLTag(field)
        IF field is struct or pointer-to-struct THEN
          # Recurse into nested structs (e.g., Git *GitConfig)
          nestedCategory := determineFieldCategory(field.Name, category)
          APPEND reflectConfigFields(fieldType, fieldValue, prefix+field.Name+".", nestedCategory)
        ELSE
          # Leaf field: emit configFieldInfo
          APPEND configFieldInfo{
            Name: field.Name, YAMLName: yamlName,
            Type: fieldType.String(), Kind: fieldType.Kind(),
            Value: fieldValue.Interface(),
            Category: determineFieldCategory(field.Name, category),
            Path: prefix + field.Name
          }
        END
      END
      RETURN fields

    PROCEDURE updateFieldValues(cachedFields, cfg) -> []configFieldInfo:
      # Updates cached metadata with current config values via field path resolution
      FOR each cachedField:
        value := getFieldValueByPath(reflect.ValueOf(*cfg), cachedField.Path)
        cachedField.Value = value
      END
      RETURN updated fields

    PROCEDURE GetConfigValues(cfg *Config) -> []ConfigValue:
      # Extracts configuration values for display without source tracking
      defaultCfg := DefaultConfig()
      getSource := createSourceDeterminer("default")
      RETURN getBasicConfigValues(cfg, defaultCfg, getSource) + getStatusCodeValues(...)

    PROCEDURE GetConfigValuesWithSources(cfg *Config, root string) -> []ConfigValue:
      # [ARCH-CFG_006] [REQ-CFG_006] — Extracts values with source tracking (default/file/computed)
      configSource := determineConfigSource(root)
      getSource := createSourceDeterminer(configSource)
      RETURN getBasicConfigValues(cfg, defaultCfg, getSource) + getStatusCodeValues(...)
