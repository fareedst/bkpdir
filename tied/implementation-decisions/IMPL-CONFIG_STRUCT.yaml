  essence_pseudocode: "# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [ARCH-CFG_006] [REQ-CONFIGURATION] [REQ-CFG_006]\n# Defines configuration struct, default values, reflection-based field discovery, and value extraction for display. [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: DATA Config struct:\nDATA Config struct:\n  # All configuration fields with YAML tags for serialization and display [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  ArchiveDirPath string       `yaml:\"archive_dir_path\"`\n  UseCurrentDirName bool      `yaml:\"use_current_dir_name\"`\n  ExcludePatterns []string    `yaml:\"exclude_patterns\"`\n  IncludeGitInfo bool         `yaml:\"include_git_info\"`      # Legacy\n  ShowGitDirtyStatus bool     `yaml:\"show_git_dirty_status\"` # Legacy\n  Inherit []string            `yaml:\"inherit,omitempty\"`     # CFG-005 inheritance\n  Git\
    \ *GitConfig              `yaml:\"git,omitempty\"`         # Nested git config\n  BackupDirPath string        `yaml:\"backup_dir_path\"`\n  UseCurrentDirNameForFiles bool\n  StatusCodes (directory + file)\n  FormatStrings (printf + template, directory + file)\n  Patterns (regex for archive, backup, config, timestamp)\n  Extended format strings and templates\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: DATA configFieldInfo struct:\nDATA configFieldInfo struct:\n  # Metadata for a single configuration field discovered via reflection [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  Name, YAMLName, Type string\n  Kind reflect.Kind\n  Value interface{}\n  IsPointer, IsSlice, IsStruct bool\n  Category, Path string\n  Importance int\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: PROCEDURE DefaultConfig() -> *Config:\nPROCEDURE DefaultConfig() -> *Config:\n\
    \  # Returns Config populated with preset default values [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  RETURN &Config{\n    ArchiveDirPath: \"../.bkpdir\",\n    UseCurrentDirName: true,\n    ExcludePatterns: [],\n    Git: DefaultGitConfig(),\n    BackupDirPath: \"../.bkpdir\",\n    StatusCodes: standard exit codes,\n    FormatStrings: default printf patterns,\n    Templates: default template patterns,\n    Patterns: default regex patterns\n  }\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: PROCEDURE GetAllConfigFields(cfg *Config) -> []configFieldInfo:\nPROCEDURE GetAllConfigFields(cfg *Config) -> []configFieldInfo:\n  # [IMPL-CONFIG_STRUCT] [ARCH-CFG_006] [REQ-CFG_006] — Uses cached reflection to discover all config fields\n  IF cachedFields := globalFieldCache.getCachedFields() THEN\n    # Performance: reuse cached field metadata, update values only [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM]\
    \ [REQ-CONFIGURATION]\n    RETURN updateFieldValues(cachedFields, cfg)\n  END\n  # Cache miss: perform expensive reflection [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  configType := reflect.TypeOf(*cfg)\n  configValue := reflect.ValueOf(*cfg)\n  fields := reflectConfigFields(configType, configValue, \"\", \"\")\n  SORT fields by Name\n  # Cache field metadata (without values) for future calls [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  globalFieldCache.setCachedFields(fieldMetadata)\n  RETURN fields\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: PROCEDURE reflectConfigFields(structType, structValue, prefix, category) -> []configFieldInfo:\nPROCEDURE reflectConfigFields(structType, structValue, prefix, category) -> []configFieldInfo:\n  # Recursively walks struct fields extracting YAML tag names, types, and values [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  FOR\
    \ i := 0; i < structType.NumField(); i++:\n    field := structType.Field(i)\n    # Skip unexported fields [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n    IF NOT field.IsExported() THEN CONTINUE END\n    # Extract YAML tag name (e.g., \"archive_dir_path\" from yaml:\"archive_dir_path\") [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n    yamlName := extractYAMLTag(field)\n    IF field is struct or pointer-to-struct THEN\n      # Recurse into nested structs (e.g., Git *GitConfig) [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n      nestedCategory := determineFieldCategory(field.Name, category)\n      APPEND reflectConfigFields(fieldType, fieldValue, prefix+field.Name+\".\", nestedCategory)\n    ELSE\n      # Leaf field: emit configFieldInfo [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n      APPEND configFieldInfo{\n        Name: field.Name, YAMLName: yamlName,\n        Type: fieldType.String(), Kind: fieldType.Kind(),\n\
    \        Value: fieldValue.Interface(),\n        Category: determineFieldCategory(field.Name, category),\n        Path: prefix + field.Name\n      }\n    END\n  END\n  RETURN fields\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: PROCEDURE updateFieldValues(cachedFields, cfg) -> []configFieldInfo:\nPROCEDURE updateFieldValues(cachedFields, cfg) -> []configFieldInfo:\n  # Updates cached metadata with current config values via field path resolution [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  FOR each cachedField:\n    value := getFieldValueByPath(reflect.ValueOf(*cfg), cachedField.Path)\n    cachedField.Value = value\n  END\n  RETURN updated fields\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: PROCEDURE GetConfigValues(cfg *Config) -> []ConfigValue:\nPROCEDURE GetConfigValues(cfg *Config) -> []ConfigValue:\n  # Extracts configuration values\
    \ for display without source tracking [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]\n  defaultCfg := DefaultConfig()\n  getSource := createSourceDeterminer(\"default\")\n  RETURN getBasicConfigValues(cfg, defaultCfg, getSource) + getStatusCodeValues(...)\n\n# [IMPL-CONFIG_STRUCT] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION] — Block implements documented behavior for: PROCEDURE GetConfigValuesWithSources(cfg *Config, root string) -> []ConfigValue:\nPROCEDURE GetConfigValuesWithSources(cfg *Config, root string) -> []ConfigValue:\n  # [ARCH-CFG_006] [REQ-CFG_006] — Extracts values with source tracking (default/file/computed) [IMPL-CONFIG_STRUCT]\n  configSource := determineConfigSource(root)\n  getSource := createSourceDeterminer(configSource)\n  RETURN getBasicConfigValues(cfg, defaultCfg, getSource) + getStatusCodeValues(...)"
