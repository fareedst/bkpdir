    - path: pkg/config/discovery.go
      description: Configuration path discovery and environment provider (PathDiscovery, DiscoveryConfig, DefaultEnvironmentProvider)
    - path: pkg/config/loader.go
      description: Generic configuration loader implementation (GenericConfigLoader, GenericConfigMerger)
