IMPL-CONFIG_STRUCT:
  name: Configuration Structure
  status: Active
  cross_references:
    - ARCH-CONFIG_SYSTEM
    - ARCH-CFG_006
    - REQ-CONFIGURATION
    - REQ-CFG_006
  rationale:
    why: |-
      The reflection-based configuration discovery system (`GetAllConfigFields`) uses YAML tag names for display.
      Nested struct fields (like `Git.IncludeBranch`) are displayed using their YAML tag names (e.g., `include_branch`) as top-level keys.
      This provides a flat, consistent view of all configuration options regardless of internal struct organization.
      Users see configuration keys as they appear in YAML files, not as nested struct paths.
    problems_solved:
      - Users need a flat view of all configuration keys regardless of internal struct nesting
      - Reflection-based discovery must handle nested structs, pointers, and embedded fields
      - Configuration display must use YAML tag names (not Go field names) for user familiarity
    benefits:
      - Single source of truth for configuration via Config struct with YAML tags
      - Automatic field discovery via reflection eliminates manual field listing
      - Cached reflection results improve performance for repeated config display
  implementation_approach:
    summary: Config struct with YAML tags defines all fields; reflection-based GetAllConfigFields discovers fields recursively; pkg/config provides extracted generic interfaces.
    details:
      - Config struct with ~80 YAML-tagged fields covers archiving, backups, git, formatting, status codes, patterns
      - DefaultConfig() provides preset defaults for all fields
      - GetAllConfigFields() uses reflectConfigFields() for recursive struct walking with caching
      - reflectConfigFields() extracts YAML tag names, types, categories, and values
      - pkg/config/ provides extracted generic interfaces (ConfigLoader, ConfigMerger, ConfigValidator, etc.)
      - config_impl.go has concrete implementations (DefaultConfigLoader, DefaultConfigMerger, etc.)
      - config_interfaces.go defines application-level interfaces
