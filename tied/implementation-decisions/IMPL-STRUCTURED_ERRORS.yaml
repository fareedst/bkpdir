    TYPE DefaultErrorClassifier:
      # [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — categorizes errors by type [REQ-ERROR_HANDLING]
      procedure ClassifyError(err) -> ErrorCategory:
        IsDiskFullError->DiskSpace, IsPermissionError->Permission, IsNotFound->Filesystem, IsNetwork->Network
      procedure IsRecoverable(err) -> bool:
