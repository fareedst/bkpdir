  essence_pseudocode: "# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Structured error types with status codes, classification, and resource management\n\n## Error type definitions (errors.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — domain error types with status codes and operation context [REQ-ERROR_HANDLING]\n\nTYPE ArchiveError { Message, StatusCode, Operation, Path, Err }\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: TYPE BackupError  { Message, StatusCode, Operation, Path, Err }\nTYPE BackupError  { Message, StatusCode, Operation, Path, Err }\n  # [IMPL-STRUCTURED_ERRORS] — both implement ErrorInterface [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n  procedure Error() -> string:\n    IF Err != nil THEN RETURN fmt(\"%s: %v\", Message, Err)\n    ELSE RETURN Message\n  procedure Unwrap() -> error: RETURN Err\n  procedure\
    \ GetStatusCode/GetOperation/GetPath/GetMessage -> respective fields\n\n## Error constructors [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — factory functions with increasing context levels [REQ-ERROR_HANDLING]\n\nprocedure NewArchiveError(message, statusCode) -> *ArchiveError\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: procedure NewArchiveErrorWithCause(message, statusCode, err) -> *ArchiveError\nprocedure NewArchiveErrorWithCause(message, statusCode, err) -> *ArchiveError\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: procedure NewArchiveErrorWithContext(message, statusCode, operation, path, err) -> *ArchiveError\nprocedure NewArchiveErrorWithContext(message, statusCode, operation, path, err) -> *ArchiveError\n# (analogous NewBackupError, NewBackupErrorWithCause, NewBackupErrorWithContext)\
    \ [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n\n## Error classification (errors.go + pkg/errors/classification.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — string pattern matching with syscall fallback\n\nprocedure IsDiskFullError(err) -> bool:\n  # [IMPL-STRUCTURED_ERRORS] — match disk-space-related strings plus syscall.ENOSPC/EDQUOT/EFBIG [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n  IF err == nil THEN RETURN false\n  lowered = ToLower(err.Error())\n  RETURN matchesAny(lowered, diskFullPatterns) OR isPathError(err, ENOSPC|EDQUOT|EFBIG)\n\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: procedure IsPermissionError(err) -> bool:\nprocedure IsPermissionError(err) -> bool:\n  # [IMPL-STRUCTURED_ERRORS] — match permission-related strings plus syscall.EACCES/EPERM [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n\
    \  IF err == nil THEN RETURN false\n  lowered = ToLower(err.Error())\n  RETURN matchesAny(lowered, permissionPatterns) OR isPathError(err, EACCES|EPERM)\n\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: procedure IsDirectoryNotFoundError(err) -> bool:\nprocedure IsDirectoryNotFoundError(err) -> bool:\n  # [IMPL-STRUCTURED_ERRORS] — match not-found strings plus syscall.ENOENT [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n  IF err == nil THEN RETURN false\n  lowered = ToLower(err.Error())\n  RETURN matchesAny(lowered, notFoundPatterns) OR isPathError(err, ENOENT)\n\n## Error handling dispatch (errors.go + pkg/errors/handlers.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — centralized dispatch returning status codes\n\nprocedure HandleError(err, cfg ErrorConfig, formatter ErrorFormatter) -> int:\n  IF err == nil THEN RETURN 0\n\
    \  IF IsDiskFullError(err) THEN formatter.PrintDiskFullError; RETURN cfg[\"disk_full\"]\n  IF IsPermissionError(err) THEN formatter.PrintPermissionError; RETURN cfg[\"permission_denied\"]\n  IF IsDirectoryNotFoundError(err) THEN formatter.PrintDirectoryNotFound; RETURN cfg[\"directory_not_found\"]\n  IF err is *ArchiveError THEN RETURN err.GetStatusCode()\n  IF err is *BackupError THEN RETURN err.GetStatusCode()\n  formatter.PrintError(err); RETURN cfg[\"general_error\"]\n\n## Resource management (errors.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — thread-safe resource tracking with cleanup\n\nTYPE ResourceManager { resources []Resource, mutex sync.RWMutex }\n  procedure AddResource(r): lock; append(resources, r); unlock\n  procedure AddTempFile(path): AddResource(&TempFile{path})\n  procedure AddTempDir(path): AddResource(&TempDir{path})\n  procedure RemoveResource(r): lock; find by String();\
    \ splice out; unlock\n  procedure Cleanup() -> error:\n    lock; FOR EACH resource: collect Cleanup() errors; clear list; unlock\n  procedure CleanupWithPanicRecovery() -> error:\n    defer recover(); RETURN Cleanup()\n\n## Contextual operations (errors.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — context-aware operation wrapper [REQ-ERROR_HANDLING]\n\nTYPE ContextualOperation { ctx context.Context, rm *ResourceManager }\n  procedure IsCancelled() -> bool: select on ctx.Done()\n  procedure CheckCancellation() -> error: return ctx.Err() if cancelled\n  procedure Cleanup() -> error: RETURN rm.Cleanup()\n\n## Atomic file operations (errors.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — temp-file-then-rename pattern [REQ-ERROR_HANDLING]\n\nprocedure AtomicWriteFile(path, data, rm) -> error:\n  MkdirAll(dir(path))\n  tmpFile = CreateTemp(dir,\
    \ prefix); rm.AddTempFile(tmpPath)\n  Write(data); Close(); Rename(tmpPath, path)\n\n## Path validation (errors.go + pkg/errors/handlers.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — validate paths exist and are accessible\n\nprocedure ValidateDirectoryPath(path, cfg) -> error:\n  IF empty THEN error; Stat(path): check exists, isDir, writable\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: procedure ValidateFilePath(path, cfg) -> error:\nprocedure ValidateFilePath(path, cfg) -> error:\n  IF empty THEN error; Stat(path): check exists, isFile, readable\n\n## Generalized errors package (pkg/errors/) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — reusable error infrastructure\n\nTYPE ApplicationError { Message, StatusCode, Operation,\
    \ Path, Err }\n  # [IMPL-STRUCTURED_ERRORS] — generalized from ArchiveError/BackupError for reuse [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n\nTYPE DefaultErrorClassifier:\n  # [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — categorizes errors by type [REQ-ERROR_HANDLING]\n  procedure ClassifyError(err) -> ErrorCategory:\n    IsDiskFullError->DiskSpace, IsPermissionError->Permission, IsNotFound->Filesystem, IsNetwork->Network\n  procedure IsRecoverable(err) -> bool:\n    DiskSpace/Network -> true; Permission/Filesystem/Config/Validation -> false\n  procedure GetSeverity(err) -> ErrorSeverity:\n    DiskSpace/Config -> Critical; Permission/Filesystem/Network -> Error; Validation -> Warning\n\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: TYPE ConfigurableErrorClassifier { patterns, fallback ErrorClassifier }:\nTYPE ConfigurableErrorClassifier { patterns, fallback ErrorClassifier }:\n  # [IMPL-STRUCTURED_ERRORS] — custom\
    \ patterns with fallback [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]\n  procedure ClassifyError: check custom patterns first, then fallback\n\n# [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — Block implements documented behavior for: TYPE ErrorRecoveryManager { strategies, classifier }:\nTYPE ErrorRecoveryManager { strategies, classifier }:\n  # [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — strategy-based error recovery [REQ-ERROR_HANDLING]\n  procedure TryRecover(err, ctx):\n    IF !classifier.IsRecoverable(err) THEN RETURN err\n    FOR EACH strategy: IF CanRecover THEN Recover"
