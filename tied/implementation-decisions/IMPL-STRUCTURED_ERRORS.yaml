    ## Error handling dispatch (errors.go + pkg/errors/handlers.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]
    # [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — centralized dispatch returning status codes

    procedure HandleError(err, cfg ErrorConfig, formatter ErrorFormatter) -> int:
      IF err == nil THEN RETURN 0
      IF IsDiskFullError(err) THEN formatter.PrintDiskFullError; RETURN cfg["disk_full"]
      IF IsPermissionError(err) THEN formatter.PrintPermissionError; RETURN cfg["permission_denied"]
      IF IsDirectoryNotFoundError(err) THEN formatter.PrintDirectoryNotFound; RETURN cfg["directory_not_found"]
      IF err is *ArchiveError THEN RETURN err.GetStatusCode()
      IF err is *BackupError THEN RETURN err.GetStatusCode()
      formatter.PrintError(err); RETURN cfg["general_error"]

    ## Resource management (errors.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]
    # [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING] — thread-safe resource tracking with cleanup

    TYPE ResourceManager { resources []Resource, mutex sync.RWMutex }
      procedure AddResource(r): lock; append(resources, r); unlock
      procedure AddTempFile(path): AddResource(&TempFile{path})
      procedure AddTempDir(path): AddResource(&TempDir{path})
      procedure RemoveResource(r): lock; find by String(); splice out; unlock
      procedure Cleanup() -> error:
        lock; FOR EACH resource: collect Cleanup() errors; clear list; unlock
      procedure CleanupWithPanicRecovery() -> error:
        defer recover(); RETURN Cleanup()

    ## Contextual operations (errors.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]
    # [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — context-aware operation wrapper [REQ-ERROR_HANDLING]

    TYPE ContextualOperation { ctx context.Context, rm *ResourceManager }
      procedure IsCancelled() -> bool: select on ctx.Done()
      procedure CheckCancellation() -> error: return ctx.Err() if cancelled
      procedure Cleanup() -> error: RETURN rm.Cleanup()

    ## Atomic file operations (errors.go) [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] [REQ-ERROR_HANDLING]
    # [IMPL-STRUCTURED_ERRORS] [ARCH-ERROR_HANDLING] — temp-file-then-rename pattern [REQ-ERROR_HANDLING]

    procedure AtomicWriteFile(path, data, rm) -> error:
      MkdirAll(dir(path))
      tmpFile = CreateTemp(dir, prefix); rm.AddTempFile(tmpPath)
      Write(data); Close(); Rename(tmpPath, path)

