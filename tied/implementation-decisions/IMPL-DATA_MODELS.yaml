    created: "2026-03-12"
    author: AI Agent
    last_updated: "2026-03-12"
  essence_pseudocode: |-
    # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Define comprehensive Go structs for archive, backup, and backup options data

    procedure data_models():
      # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Archive struct with Name, Path, CreationTime, IsIncremental, GitBranch, GitHash, Note, BaseArchive fields
      archive_struct_with_name()
      # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Backup struct with Name, Path, CreationTime, SourceFile, Note fields
      backup_struct_with_name()
      # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] BackupInfo struct with Name, Path, CreationTime, Size fields
      backupinfo_struct_with_name()
