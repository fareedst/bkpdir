IMPL-DATA_MODELS:
  name: Data Models
  status: Active
  description: Comprehensive data structures for archive and backup operations providing structured data representation, type safety, serialization and persistence support, and testing/validation facilitation
  rationale:
    why: Operations need structured data representation for type safety, serialization, and testability
    problems_solved:
    - Unstructured data passing between functions
    - Lack of type safety in archive and backup operations
    - Difficulty testing and validating operation parameters
    benefits:
    - Structured data representation
    - Type safety
    - Supports serialization and persistence
    - Facilitates testing and validation
  implementation_approach:
    summary: Define comprehensive Go structs for archive, backup, and backup options data with interface adapters for dependency abstraction
    details:
    - Archive struct with Name, Path, CreationTime, IsIncremental, GitBranch, GitHash, Note, BaseArchive fields
    - ArchiveConfig struct with Prefix, Timestamp, GitBranch, GitHash, GitIsClean, ShowGitDirtyStatus, Note, IsGit, IsIncremental, BaseName fields
    - ArchiveCreationOptions struct with Context, CWD, Path, Files, Config, ResourceMgr fields
    - IncrementalArchiveConfig struct with Config, Note, DryRun, Context fields
    - ArchiveConfigInterface and ArchiveFormatterInterface for dependency abstraction
    - ConfigToArchiveConfigAdapter adapts Config to ArchiveConfigInterface
    - Backup struct with Name, Path, CreationTime, SourceFile, Note fields
    - BackupInfo struct with Name, Path, CreationTime, Size fields
    - BackupOptions struct with Context, Config, Formatter, FilePath, Note, DryRun fields
    - BackupConfigInterface and BackupFormatterInterface for dependency abstraction
    - ConfigToBackupConfigAdapter adapts Config to BackupConfigInterface
  cross_references:
  - ARCH-SYSTEM_COMPONENTS
  - REQ-CODE_QUALITY
  - REQ-FILE_BACKUP
  code_locations:
    files:
    - archive.go
    - backup.go
    - archive_test.go
    - backup_test.go
    functions:
    - Archive
    - ArchiveConfig
    - ArchiveConfigInterface
    - ArchiveCreationOptions
    - ArchiveFormatterInterface
    - ConfigToArchiveConfigAdapter
    - OutputFormatterToArchiveFormatterAdapter
    - IncrementalArchiveConfig
    - BackupInfo
    - Backup
    - BackupOptions
    - BackupConfigInterface
    - BackupFormatterInterface
    - ConfigToBackupConfigAdapter
    - OutputFormatterToBackupFormatterAdapter
  traceability:
    architecture:
    - ARCH-SYSTEM_COMPONENTS
    requirements:
    - REQ-CODE_QUALITY
    - REQ-FILE_BACKUP
    tests:
    - TestGenerateArchiveName
    - TestCreateFullArchive
    - TestCreateIncremental
    - TestIncrementalArchiveDirectoryStructure
    - TestSkipBrokenSymlinks
    - TestGenerateBackupName
    - TestListFileBackups
    - TestCreateFileBackup
    - TestCreateFileBackupWithContext
    - TestCheckForIdenticalFileBackup
    - TestListFileBackupsEnhanced_WithLimit
    code_annotations:
    - IMPL-DATA_MODELS
    - ARCH-SYSTEM_COMPONENTS
    - REQ-CODE_QUALITY
    - REQ-FILE_BACKUP
  related_decisions:
    depends_on: []
    supersedes: []
    see_also:
    - IMPL-FILE_OPERATIONS
    - IMPL-ZIP_FORMAT
    - IMPL-ATOMIC_OPS
    - IMPL-CONTEXT_OPS
  metadata:
    created: '2026-03-12'
    author: AI Agent
    last_updated:
      date: '2026-03-12'
      author: AI agent
      reason: Enriched pseudo-code, populated code_locations and traceability.tests per PROC-IMPL_CODE_TEST_SYNC
  essence_pseudocode: "# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Comprehensive Go data structs for archive and backup operations with interface adapters\n\n# --- Archive domain models (archive.go) --- [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY]\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct ArchiveConfig:\nstruct ArchiveConfig:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Configuration value object for generating archive names\n  Prefix             string\n  Timestamp          string\n  GitBranch          string\n  GitHash            string\n  GitIsClean         bool\n  ShowGitDirtyStatus bool\n  Note               string\n  IsGit              bool\n  IsIncremental      bool\n  BaseName           string\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct Archive:\nstruct Archive:\n  #\
    \ [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Represents a directory archive with metadata (full or incremental)\n  Name          string\n  Path          string\n  CreationTime  time.Time\n  IsIncremental bool\n  GitBranch     string\n  GitHash       string\n  Note          string\n  BaseArchive   string  # for incremental archives\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: interface ArchiveConfigInterface:\ninterface ArchiveConfigInterface:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Abstracts configuration dependencies for archive operations\n  GetArchiveDirPath() string\n  GetUseCurrentDirName() bool\n  GetExcludePatterns() []string\n  GetIncludeGitInfo() bool\n  GetShowGitDirtyStatus() bool\n  GetSkipBrokenSymlinks() bool\n  GetStatusCodes() map[string]int\n  GetStatusDirectoryNotFound() int\n  GetStatusDiskFull() int\n  GetStatusConfigError() int\n\n# [IMPL-DATA_MODELS]\
    \ [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct ArchiveCreationOptions:\nstruct ArchiveCreationOptions:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Groups all parameters needed for archive creation into a single value object\n  Context     context.Context\n  CWD         string\n  Path        string\n  Files       []string\n  Config      ArchiveConfigInterface\n  ResourceMgr *ResourceManager\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: interface ArchiveFormatterInterface:\ninterface ArchiveFormatterInterface:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Abstracts formatter dependencies for archive operations\n  PrintDryRunFilesHeader()\n  PrintDryRunFileEntry(file string)\n  PrintDryRunArchive(path string)\n  PrintIncrementalCreated(path string)\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements\
    \ documented behavior for: struct ConfigToArchiveConfigAdapter:\nstruct ConfigToArchiveConfigAdapter:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Adapter: wraps *Config, delegates each ArchiveConfigInterface method to the corresponding Config field\n  cfg *Config\n  implements ArchiveConfigInterface by delegating:\n    GetArchiveDirPath()       -> cfg.ArchiveDirPath\n    GetUseCurrentDirName()    -> cfg.UseCurrentDirName\n    GetExcludePatterns()      -> cfg.ExcludePatterns\n    GetIncludeGitInfo()       -> cfg.IncludeGitInfo\n    GetShowGitDirtyStatus()   -> cfg.ShowGitDirtyStatus\n    GetSkipBrokenSymlinks()   -> cfg.SkipBrokenSymlinks\n    GetStatusCodes()          -> cfg.GetStatusCodes()\n    GetStatusDirectoryNotFound() -> cfg.StatusDirectoryNotFound\n    GetStatusDiskFull()       -> cfg.StatusDiskFull\n    GetStatusConfigError()    -> cfg.StatusConfigError\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior\
    \ for: struct OutputFormatterToArchiveFormatterAdapter:\nstruct OutputFormatterToArchiveFormatterAdapter:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Adapter: wraps OutputFormatterInterface, type-asserts to FormatterAdapter/AIFormatterAdapter for extended methods\n  formatter OutputFormatterInterface\n  implements ArchiveFormatterInterface by type-asserting formatter to concrete types\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct IncrementalArchiveConfig:\nstruct IncrementalArchiveConfig:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] Value object grouping parameters for incremental archive creation\n  Config  *Config\n  Note    string\n  DryRun  bool\n  Context context.Context\n\n# --- Backup domain models (backup.go) --- [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY]\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements\
    \ documented behavior for: interface BackupConfigInterface:\ninterface BackupConfigInterface:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] [REQ-FILE_BACKUP] Abstracts configuration dependencies for backup operations\n  GetBackupDirPath() string\n  GetUseCurrentDirNameForFiles() bool\n  GetStatusFileNotFound() int\n  GetStatusPermissionDenied() int\n  GetStatusInvalidFileType() int\n  GetStatusDiskFull() int\n  GetStatusFileIsIdenticalToExistingBackup() int\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: interface BackupFormatterInterface:\ninterface BackupFormatterInterface:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] [REQ-FILE_BACKUP] Abstracts formatter dependencies for backup operations\n  PrintDryRunBackup(path string)\n  PrintIdenticalBackup(path string)\n  PrintBackupCreated(path string)\n  PrintNoBackupsFound(filename, backupDir string)\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS]\
    \ [REQ-CODE_QUALITY] — Block implements documented behavior for: struct ConfigToBackupConfigAdapter:\nstruct ConfigToBackupConfigAdapter:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] [REQ-FILE_BACKUP] Adapter: wraps *Config, delegates each BackupConfigInterface method to the corresponding Config field\n  cfg *Config\n  implements BackupConfigInterface by delegating:\n    GetBackupDirPath()      -> cfg.BackupDirPath\n    GetUseCurrentDirNameForFiles() -> cfg.UseCurrentDirNameForFiles\n    GetStatusFileNotFound() -> cfg.StatusFileNotFound\n    GetStatusPermissionDenied()    -> cfg.StatusPermissionDenied\n    GetStatusInvalidFileType()     -> cfg.StatusInvalidFileType\n    GetStatusDiskFull()            -> cfg.StatusDiskFull\n    GetStatusFileIsIdenticalToExistingBackup() -> cfg.StatusFileIsIdenticalToExistingBackup\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct OutputFormatterToBackupFormatterAdapter:\n\
    struct OutputFormatterToBackupFormatterAdapter:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] [REQ-FILE_BACKUP] Adapter: wraps *OutputFormatter, delegates each BackupFormatterInterface method directly\n  formatter *OutputFormatter\n  implements BackupFormatterInterface by delegating to formatter.*\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct BackupInfo:\nstruct BackupInfo:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] [REQ-FILE_BACKUP] Represents information about a file backup (listing and comparison)\n  Name         string\n  Path         string\n  CreationTime time.Time\n  Size         int64\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct Backup:\nstruct Backup:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] [REQ-FILE_BACKUP] Represents a single file backup with metadata and\
    \ source tracking\n  Name         string\n  Path         string\n  CreationTime time.Time\n  SourceFile   string\n  Note         string\n\n# [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] — Block implements documented behavior for: struct BackupOptions:\nstruct BackupOptions:\n  # [IMPL-DATA_MODELS] [ARCH-SYSTEM_COMPONENTS] [REQ-CODE_QUALITY] [REQ-FILE_BACKUP] Groups all parameters for backup creation into a single value object\n  Context   context.Context\n  Config    *Config\n  Formatter OutputFormatterInterface\n  FilePath  string\n  Note      string\n  DryRun    bool"
