      processed = processor.processKeys(srcMap)

      # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Detect explicit prefix usage per field [ARCH-EXCLUDE_MERGE_FIX]
      hasExplicitPrefix = {}
      for each origKey in rawSrcMap:
        cleanKey = strip surrounding quotes from origKey
