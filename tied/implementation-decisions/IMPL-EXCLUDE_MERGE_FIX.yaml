  code_markers: '`config.go`, `extractStrategy`, `applyMergeStrategies`, `applyMerge`, `setConfigField`, `isKnownConfigField`'
  change: Removed `inheritContext` condition that was preventing array fields from defaulting to merge in sequential file processing. Array fields now default to merge in all contexts (inheritance chains and sequential files), per CFG-005 requirement. Explicit prefixes (`!`, `+`, `^`, `=`) are still respected.
  changes:
    - Updated `TestLoadConfigMultipleFiles/default_search_path_processes_multiple_files` to use `!exclude_patterns` prefix where override behavior is expected
    - Tests now explicitly use merge strategy prefixes to align with CFG-005 requirement that array fields default to merge
  cross-references: '[REQ-CFG_005], [ARCH-EXCLUDE_MERGE_FIX], [REQ-CONFIGURATION], [REQ-TEST_EXCLUDE_MERGE]'
  fix_summary: |-
    1. **Strategy Detection**: Array fields default to "merge" instead of "override" in all contexts
    2. **State Management**: Uses current state (`resultMap`) instead of original state (`dstMap`)
    3. **Pattern Preservation**: Explicitly copies default patterns before merge
    4. **Deduplication**: Proper deduplication during merge operations
    5. **Nil Handling**: Handles nil `dstValue` by getting current value from result
    6. **YAML Type Conversion**: Handles `[]interface{}` from YAML unmarshaling in both `applyMerge` and `setConfigField`
    7. **Unknown Field Handling**: Gracefully skips unknown config fields instead of aborting merge
    8. **Metadata Field Handling**: Skips `inherit` and other metadata fields that aren't part of Config struct
  implementation_changes: '#### 1. Merge Strategy Detection Fix (`extractStrategy`)'
  new_function: '`isKnownConfigField` helper function checks if a field name is a valid config field before processing.'
  essence_pseudocode: |-
    # [IMPL-EXCLUDE_MERGE_FIX] [ARCH-EXCLUDE_MERGE_FIX] [REQ-CFG_005] [REQ-CONFIGURATION] [REQ-TEST_EXCLUDE_MERGE] — Array fields default to merge (accumulate) in all contexts per CFG-005

    procedure applyMergeStrategies(dst, src, inheritContext, rawSrcMap, initialDefaultCfg, explicitlySetFields):
      # [IMPL-EXCLUDE_MERGE_FIX] [ARCH-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Process merge strategy prefixes from raw YAML keys
      processor = newMergeStrategyProcessor()

      # Use rawSrcMap if available (preserves !, +, ^, = prefixes), else convert Config to map
      srcMap = rawSrcMap ?? configToMap(src)
      if exclude_patterns not in srcMap and src has patterns:
        srcMap["exclude_patterns"] = src.ExcludePatterns

      # Process keys through strategy processor (strips prefixes, determines strategy)
      processed = processor.processKeys(srcMap)

      # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Detect explicit prefix usage per field
      hasExplicitPrefix = {}
      for each origKey in rawSrcMap:
        cleanKey = strip surrounding quotes from origKey
        if cleanKey starts with !, +, ^, or =:
          hasExplicitPrefix[cleanKey without prefix] = true

      # [IMPL-EXCLUDE_MERGE_FIX] [ARCH-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Apply field-specific merge behavior
      for each (key, operation) in processed.operations:
        behavior = getFieldMergeBehavior(key)
        if behavior == MergeBehaviorAccumulate:
          # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Array fields default to merge in ALL contexts
          if operation.strategy == "override" and not hasExplicitPrefix[key]:
            operation.strategy = "merge"   # CFG-005 fix: override → merge for accumulate fields

        # Get current dst value for merge operation
        dstValue = getCurrentFieldValue(result, key)
        applyMergeOperation(result, key, operation, dstValue, originalDstValue, inheritContext, defaultCfg, explicitlySetFields)

      return result

    procedure applyMerge(result, key, value, dstValue, inheritContext, defaultCfg, explicitlySetFields):
      # [IMPL-EXCLUDE_MERGE_FIX] [ARCH-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Merge arrays with deduplication

      # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CONFIGURATION] Handle YAML type conversion: []interface{} → []string
      srcSlice = value as []string
      if conversion fails, try converting []interface{} element-by-element

      # Get current destination slice from result (use current state, not original)
      dstSlice = getFieldSlice(result, key)

      # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Merge with deduplication
      existing = set from dstSlice
      merged = copy of dstSlice
      for each item in srcSlice:
        if item not in existing:
          merged.append(item)
          existing.add(item)

      setConfigField(result, key, merged)

    procedure setConfigField(cfg, key, value):
      # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CONFIGURATION] Set field with YAML type conversion
      switch key:
        "exclude_patterns":
          if value is []string: cfg.ExcludePatterns = value
          if value is []interface{}: convert to []string then set
        "archive_dir_path", "backup_dir_path", etc.: set corresponding field
        default: return error "unknown config field"

    procedure isKnownConfigField(key):
      # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CONFIGURATION] Guard against unknown fields in merge
      return key in {archive_dir_path, use_current_dir_name, exclude_patterns, include_git_info, backup_dir_path, skip_broken_symlinks, status_created_archive, status_disk_full}
