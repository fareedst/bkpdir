          # [IMPL-EXCLUDE_MERGE_FIX] [REQ-CFG_005] Array fields default to merge in ALL contexts [ARCH-EXCLUDE_MERGE_FIX]
          if operation.strategy == "override" and not hasExplicitPrefix[key]:
