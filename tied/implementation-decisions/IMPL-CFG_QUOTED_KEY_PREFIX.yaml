  name: Quoted YAML Key Prefix Support
  priority: P1 (Important)
  problem: When YAML keys with merge strategy prefixes (`+`, `^`, `!`, `=`) are quoted (e.g., `"+exclude_patterns"`), the YAML parser preserves the quotes as part of the key string. This caused the prefix detection logic to fail because it was checking the first character of the key, which was `"` instead of `+`.
  quoted_keys_with_prefixes: '`"+exclude_patterns"` is correctly recognized as merge strategy'
  rationale:
    benefits: []
    problems_solved: []
    why: |-
      - First pass: Identify all keys with explicit prefixes and map them to their base keys
      - Second pass: When processing keys, skip duplicate keys without prefixes if an explicit prefix key exists for the same base key
      - This ensures that `"+exclude_patterns"` takes precedence over `"exclude_patterns"` if both exist
