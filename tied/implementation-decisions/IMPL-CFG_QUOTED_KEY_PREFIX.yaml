    - ✅ Merge strategies work correctly with quoted keys in inheritance chains
    - ✅ Merge strategies work correctly with quoted keys in sequential files
    - ✅ Duplicate keys are handled correctly (explicit prefix keys take precedence)
    - ✅ All tests pass with quoted key syntax
  essence_pseudocode: |-
    # [IMPL-CFG_QUOTED_KEY_PREFIX] [ARCH-CFG_005] [REQ-CFG_005] [REQ-CONFIGURATION]
    # Quoted YAML key prefix support: strip quotes before detecting merge strategy prefixes,
    # and prioritize keys with explicit prefixes over plain duplicate keys.

    procedure extractStrategy(key):
      # Strips surrounding quotes then detects merge strategy prefix character.
      IF key is empty THEN RETURN ("override", key)
      cleanKey = key
      IF key starts and ends with matching quotes (" or ') THEN
        cleanKey = key without surrounding quotes
      IF cleanKey is empty THEN RETURN ("override", key)
      SWITCH cleanKey[0]:
        '+' -> RETURN ("merge", cleanKey[1:])
        '^' -> RETURN ("prepend", cleanKey[1:])
        '!' -> RETURN ("replace", cleanKey[1:])
        '=' -> RETURN ("default", cleanKey[1:])
        default -> RETURN ("override", key)

    procedure processKeys(config map):
      # [IMPL-CFG_QUOTED_KEY_PREFIX] [ARCH-CFG_005] [REQ-CFG_005] [REQ-CONFIGURATION]
      # Two-pass algorithm to handle quoted keys and explicit-prefix precedence.
      result = new processedConfig

      # --- First pass: build explicitPrefixKeys map ---
      # Identifies which base keys have an explicit strategy prefix.
      explicitPrefixKeys = {}
      FOR EACH key IN config:
        cleanKey = strip surrounding quotes from key
        IF cleanKey has prefix character (+, ^, !, =) THEN
          baseKey = cleanKey without prefix character
          record key in explicitPrefixKeys[baseKey] (prefer longer / prefixed key)

      # --- Second pass: process keys with deduplication ---
      # When a base key has both a plain and a prefixed version, skip the plain one.
      FOR EACH (key, value) IN config:
        (strategy, cleanKey) = extractStrategy(key)
        IF explicitPrefixKeys contains cleanKey AND key != explicitPrefixKeys[cleanKey] THEN
          SKIP this key (duplicate without prefix)
        store mergeOperation(strategy, value, cleanKey) in result.operations
      RETURN result
