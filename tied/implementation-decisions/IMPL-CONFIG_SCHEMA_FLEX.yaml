  description: Extract configuration loading/merging logic with pluggable schema validation. Current config is backup-specific but needs to be generic. Create ConfigLoader interface that can handle different struct types while preserving powerful discovery and merging.
  implementation_approach:
    details:
      - Create ConfigLoader interface for pluggable schema support
      - Extract configuration loading/merging logic from backup-specific code
      - Preserve powerful discovery and merging while enabling different schemas
    summary: |-
      Schema-agnostic configuration loading in pkg/config clones defaults, merges discovered YAML files, applies environment overrides, validates, and adapts results back to the legacy Config type.
      INPUT: root path, defaultConfig interface{}
      OUTPUT: merged configuration value or map of ConfigValue with sources
      DATA: GenericConfigLoader, search paths, env provider, validator
