IMPL-CONFIG_SCHEMA_FLEX:
  name: Configuration Schema Flexibility
  status: Active
  description: Extract configuration loading/merging logic with pluggable schema validation. Current config is backup-specific but needs to be generic. Create ConfigLoader interface that can handle different struct types while preserving powerful discovery and merging.
  rationale:
    why: Current config is backup-specific but needs to be generic for reuse in other applications
    problems_solved:
      - Backup-specific configuration that cannot be reused
      - Tightly coupled schema validation
      - Inability to use config system with different struct types
    benefits:
      - Pluggable schema validation
      - ConfigLoader interface handles different struct types
      - Preserves powerful discovery and merging capabilities
      - Enables different schemas for different applications
  implementation_approach:
    summary: Create ConfigLoader interface that can handle different struct types with pluggable schema validation
    details:
      - Extract configuration loading/merging logic from backup-specific code
      - Create ConfigLoader interface for pluggable schema support
      - Preserve powerful discovery and merging while enabling different schemas
  cross_references:
    - ARCH-CONFIG_SYSTEM
    - REQ-CONFIGURATION
  code_locations:
    files:
      - path: config.go
        description: Original ConfigLoader interface and LoadConfig functions in main package
      - path: config_interfaces.go
        description: ConfigLoader, ConfigMerger, ConfigSource, ConfigValidator, ValueExtractor interfaces
      - path: config_adapter.go
        description: ConfigAdapter bridging original Config struct with extracted pkg/config package
      - path: config_impl.go
        description: DefaultConfigLoader and DefaultConfigMerger implementing main-package interfaces
      - path: pkg/config/interfaces.go
        description: Extracted generic ConfigLoader interface with interface{} parameter types
      - path: pkg/config/loader.go
        description: GenericConfigLoader implementing extracted ConfigLoader with reflection-based merging
    functions:
      - name: ConfigLoader (interface)
        file: config_interfaces.go
        description: Schema-agnostic configuration management interface (LoadConfig, LoadConfigValues, GetConfigValues, ValidateConfig)
      - name: ConfigAdapter
        file: config_adapter.go
        description: Backward-compatibility adapter bridging original Config struct with pkg/config
      - name: NewConfigAdapter
        file: config_adapter.go
        description: Creates ConfigAdapter with PathDiscovery, EnvironmentProvider, FileOps, Validator
      - name: GenericConfigLoader
        file: pkg/config/loader.go
        description: Generic config loader using reflection to handle different struct types
      - name: LoadConfig
        file: pkg/config/loader.go
        description: Loads config from root with generic defaultConfig parameter (interface{})
