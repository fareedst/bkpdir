  metadata:
    created:
      date: "2026-03-12"
      author: AI Agent
    last_updated:
      date: "2026-03-12"
      author: AI agent
      reason: Enriched pseudo-code, populated code_locations and traceability.tests per PROC-IMPL_CODE_TEST_SYNC
  essence_pseudocode: |-
    # [IMPL-CONFIG_SCHEMA_FLEX] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]
    # Configuration schema flexibility: ConfigLoader interface accepts interface{}
    # parameters so different struct types can be loaded/merged/validated.
    # ConfigAdapter bridges the original backup-specific Config struct with the
    # extracted generic pkg/config package.

    interface ConfigLoader:
      # [IMPL-CONFIG_SCHEMA_FLEX] — schema-agnostic config management operations.
      LoadConfig(root string, defaultConfig interface{}) -> (interface{}, error)
      LoadConfigValues(root string, defaultConfig interface{}) -> (map[string]ConfigValue, error)
      GetConfigValues(cfg interface{}) -> []ConfigValue
      GetConfigValuesWithSources(cfg interface{}, root string) -> []ConfigValue
      ValidateConfig(cfg interface{}) -> error

    procedure GenericConfigLoader.LoadConfig(root, defaultConfig):
      # Loads config files from search paths and merges into a clone of defaultConfig.
      config = cloneConfig(defaultConfig)
      searchPaths = pathDiscovery.GetConfigSearchPaths()
      FOR EACH path IN searchPaths:
        expandedPath = pathDiscovery.ExpandPath(path)
        IF fileOps.FileExists(expandedPath) THEN
          loadConfigFromFile(config, expandedPath)  # YAML unmarshal into config
      applyEnvironmentOverrides(config)  # env vars override file values
      RETURN config

    procedure GenericConfigLoader.MergeConfigs(dst, src):
      # Reflection-based deep merge: struct fields, slices, maps, pointers.
      IF dst or src is not pointer THEN RETURN error
      mergeValues(dst.Elem(), src.Elem())

    class ConfigAdapter:
      # [IMPL-CONFIG_SCHEMA_FLEX] [ARCH-CONFIG_SYSTEM] [REQ-CONFIGURATION]
      # Backward-compatible bridge: wraps GenericConfigLoader to return *Config.
      loader: config.ConfigLoader
      merger: config.ConfigMerger
      validator: config.ConfigValidator

    procedure ConfigAdapter.LoadConfig(root):
      # Delegates to generic loader then type-asserts back to *Config.
      defaultConfig = DefaultConfig()
      genericCfg = loader.LoadConfig(root, defaultConfig)
      IF genericCfg is *Config THEN RETURN genericCfg
      RETURN DefaultConfig()  # fallback
