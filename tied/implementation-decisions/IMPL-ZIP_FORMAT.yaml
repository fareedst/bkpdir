    \  end\n\n# [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] — Block implements documented behavior for: procedure create_and_verify_archive(ctx, cwd, path, files, config, rm):\nprocedure create_and_verify_archive(ctx, cwd, path, files, config, rm):\n  # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Atomic zip write: create temp file, write zip content, rename to final path [REQ-FILE_BACKUP]\n  temp_file = path + \".tmp\"\n  rm.add_temp_file(temp_file)\n  create_zip_archive(ctx, cwd, temp_file, files, config)\n  rename(temp_file, path)\n  rm.remove_resource(temp_file)\n  print_created_archive_with_stats(path)\n  end\n\n# [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] — Block implements documented behavior for: procedure create_zip_archive(ctx, sourceDir, archivePath, files, config):\nprocedure create_zip_archive(ctx, sourceDir, archivePath, files, config):\n  # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Creates ZIP file using Go's archive/zip with Deflate compression method\
