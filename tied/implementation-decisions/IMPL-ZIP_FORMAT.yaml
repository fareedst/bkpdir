    \ behavior for: procedure collect_files_to_archive(ctx, cwd, excludePatterns):\nprocedure collect_files_to_archive(ctx, cwd, excludePatterns):\n  # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] Walks directory tree collecting non-excluded files with context cancellation\n  files = []\n  filepath.Walk(cwd, func(path, info, err):\n    check_context_cancellation(ctx)\n    rel = filepath.Rel(cwd, path)\n    if rel == \".\": return nil\n    if should_exclude(rel, excludePatterns):\n      if info.IsDir(): return filepath.SkipDir\n      return nil\n    if info.IsDir(): return nil\n    files.append(rel)\n  )\n  return files\n  end\n\n# [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] — Block implements documented behavior for: procedure list_archives(archiveDir):\nprocedure list_archives(archiveDir):\n  # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Lists all .zip files in directory with metadata (name, path, time, incremental flag) [REQ-FILE_BACKUP]\n  os.MkdirAll(archiveDir,\
