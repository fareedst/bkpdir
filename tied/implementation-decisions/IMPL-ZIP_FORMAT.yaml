    # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] — ZIP archive creation using Go's archive/zip with atomic writes and context support

    procedure create_full_archive(ctx, config, note, dryRun):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] Orchestrates full archive creation: validate dir, collect files, generate name, write zip atomically
      cwd = get_working_directory()
      validate_directory(cwd, config)
      check_context_cancellation(ctx)
      resource_manager = new_resource_manager()
      defer resource_manager.cleanup_with_panic_recovery()
      archive_dir = prepare_archive_directory(config, cwd, dryRun)
      files = collect_files_to_archive(ctx, cwd, config.exclude_patterns)
      archive_name = generate_full_archive_name(config, cwd, note)
      archive_path = join(archive_dir, archive_name)
      if dryRun:
        print_dry_run_info(files, archive_path)
        return
      create_and_verify_archive(ctx, cwd, archive_path, files, config, resource_manager)
      end

    procedure create_and_verify_archive(ctx, cwd, path, files, config, rm):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Atomic zip write: create temp file, write zip content, rename to final path
      temp_file = path + ".tmp"
      rm.add_temp_file(temp_file)
      create_zip_archive(ctx, cwd, temp_file, files, config)
      rename(temp_file, path)
      rm.remove_resource(temp_file)
      print_created_archive_with_stats(path)
      end

    procedure create_zip_archive(ctx, sourceDir, archivePath, files, config):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Creates ZIP file using Go's archive/zip with Deflate compression method
      check_context_cancellation(ctx)
      file = os.Create(archivePath)
      defer file.Close()
      zip_writer = zip.NewWriter(file)
      defer zip_writer.Close()
      for each rel in files:
        check_context_cancellation(ctx)
        add_file_to_zip(sourceDir, rel, zip_writer, config)
      end

    procedure add_file_to_zip(sourceDir, rel, zipWriter, config):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Adds single file with Deflate compression; handles symlinks and broken symlink skipping
      abs = join(sourceDir, rel)
      info = os.Lstat(abs)
      header = zip.FileInfoHeader(info)
      header.Name = rel
      header.Method = zip.Deflate
      writer = zipWriter.CreateHeader(header)
      if info.is_symlink():
        link_target = os.Readlink(abs)
        if is_broken_symlink(link_target, abs):
          if config.skip_broken_symlinks: return
          else: error("broken symlink: " + abs)
        writer.Write(link_target)
      else:
        copy_file_content(abs, writer)
      end

    procedure generate_archive_name(config):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Routes to incremental or full name generation based on config
      if config.is_incremental and config.base_name != "":
        return generate_incremental_archive_name(config)
      return generate_full_archive_name(config)
      end

    procedure generate_full_archive_name(config):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Builds: {prefix}-{timestamp}[={branch}={hash}[-dirty]][={note}].zip
      name = prefix + "-" + timestamp  (or just timestamp if no prefix)
      if config.is_git and has_git_info:
        name += "=" + branch + "=" + hash
        if not clean and show_dirty_status: name += "-dirty"
      if config.note != "": name += "=" + note
      return name + ".zip"
      end

    procedure generate_incremental_archive_name(config):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Builds: {base}_update={timestamp}[={branch}={hash}[-dirty]][={note}].zip
      base = strip_suffix(config.base_name, ".zip")
      name = base + "_update=" + config.timestamp
      if config.is_git and has_git_info:
        name += "=" + branch + "=" + hash
        if not clean and show_dirty_status: name += "-dirty"
      if config.note != "": name += "=" + note
      return name + ".zip"
      end

    procedure collect_files_to_archive(ctx, cwd, excludePatterns):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] Walks directory tree collecting non-excluded files with context cancellation
      files = []
      filepath.Walk(cwd, func(path, info, err):
        check_context_cancellation(ctx)
        rel = filepath.Rel(cwd, path)
        if rel == ".": return nil
        if should_exclude(rel, excludePatterns):
          if info.IsDir(): return filepath.SkipDir
          return nil
        if info.IsDir(): return nil
        files.append(rel)
      )
      return files
      end

    procedure list_archives(archiveDir):
      # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Lists all .zip files in directory with metadata (name, path, time, incremental flag)
      os.MkdirAll(archiveDir, 0755)
      entries = os.ReadDir(archiveDir)
      archives = []
      for each entry in entries:
        if entry.IsDir() or not has_suffix(entry.Name(), ".zip"): continue
        archive = create_archive_from_entry(archiveDir, entry)
        archives.append(archive)
      return archives
      end
