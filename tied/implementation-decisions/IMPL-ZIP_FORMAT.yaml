    \ return\n      else: error(\"broken symlink: \" + abs)\n    writer.Write(link_target)\n  else:\n    copy_file_content(abs, writer)\n  end\n\n# [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] — Block implements documented behavior for: procedure generate_archive_name(config):\nprocedure generate_archive_name(config):\n  # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Routes to incremental or full name generation based on config [REQ-FILE_BACKUP]\n  if config.is_incremental and config.base_name != \"\":\n    return generate_incremental_archive_name(config)\n  return generate_full_archive_name(config)\n  end\n\n# [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] [REQ-FILE_BACKUP] — Block implements documented behavior for: procedure generate_full_archive_name(config):\nprocedure generate_full_archive_name(config):\n  # [IMPL-ZIP_FORMAT] [ARCH-ARCHIVE_FORMAT] Builds: {prefix}-{timestamp}[={branch}={hash}[-dirty]][={note}].zip [REQ-FILE_BACKUP]\n  name = prefix + \"-\" + timestamp  (or just timestamp\
