REQ-CFG_005:
  name: Layered Configuration Inheritance Requirements
  category: Functional
  priority: P0
  status: Implemented
  rationale:
    why: Enables hierarchical configuration management for complex project structures. Array fields accumulating by default ensures that default values (like `.git/`, `vendor/`) are preserved when users add local values.
    problems_solved: []
    benefits: []
  satisfaction_criteria:
    - criterion: Configuration files can inherit from other files
    - criterion: Circular dependencies detected and prevented
    - criterion: Inheritance chains processed in correct order
    - criterion: Merge strategies (override, append, prepend, replace, default) work correctly
    - criterion: Array fields default to merge (accumulate) strategy when no prefix is specified
    - criterion: Array field values from defaults and parent configs are preserved when child configs add values
    - criterion: Duplicate values in arrays are deduplicated during merge
    - criterion: 'Order is preserved: defaults/parent values first, then child additions'
  validation_criteria:
    - method: See `architecture-decisions.md` § Testing Strategy and `implementation-decisions.md` § Testing Implementation for testing approach
  traceability:
    architecture:
      - ARCH-CFG_005
    implementation:
      - IMPL-CONFIG_STRUCT
    tests: []
    code_annotations:
      - REQ-CFG_005
  related_requirements:
    depends_on: []
    related_to: []
    supersedes: []
  detail_file: requirements/REQ-CFG_005.yaml
  metadata:
    created:
      date: "2026-03-12"
      author: MCP converter
    last_updated:
      date: "2026-03-12"
      author: MCP converter
      reason: Converted from monolithic
    last_validated:
      date: "2026-03-12"
      validator: MCP converter
      result: pass
  architecture: See `architecture-decisions.md` § Layered Configuration Inheritance [ARCH-CFG_005]
  description: Configuration files support explicit inheritance declarations using `inherit` field. Inheritance system prevents circular dependencies. Configuration loading processes inheritance chains in correct dependency order. Multiple merge strategies supported. Array configuration fields (such as `exclude_patterns`) default to merge (accumulate) strategy to preserve values from defaults and parent configs when child configs add values.
  implementation: See `implementation-decisions.md` § Configuration Structure [IMPL-CONFIG_STRUCT]
REQ-CFG_006:
  name: Complete Configuration Reflection and Visibility Requirements
  category: Functional
  priority: P1
  status: Implemented
  rationale:
    why: Provides complete configuration visibility without manual maintenance. Enables zero-maintenance configuration inspection where new fields automatically appear. Supports debugging through complete source attribution and inheritance chain visualization.
    problems_solved: []
    benefits: []
  satisfaction_criteria:
    - criterion: '*Automatic Field Discovery**: All configuration fields (100+ fields) discovered automatically using Go reflection without manual maintenance'
    - criterion: '*Type Support**: Correct handling of strings, bools, ints, slices, pointers, structs, nested structures, embedded fields, and collections'
    - criterion: '*Source Tracking**: Complete source tracking showing inheritance chain with environment → inheritance → defaults resolution'
    - criterion: '*Inheritance Integration**: Integration with CFG-005 inheritance system showing merge strategies and override points'
    - criterion: '*Multiple Output Formats**: Support for table format (quick scanning), tree format (hierarchical view), and JSON format (programmatic use)'
    - criterion: '*Filtering Options**: Command-line filtering with --all, --overrides-only, --sources, --filter pattern, and --format flags'
    - criterion: '*Performance**: Configuration inspection completes in <100ms for typical usage, <10ms for cached results'
    - criterion: '*Backward Compatibility**: Existing GetConfigValuesWithSources() function works unchanged'
    - criterion: '*Test Coverage**: Comprehensive test suite with >95% coverage including edge cases'
  validation_criteria:
    - method: '*Test Coverage**: >95% coverage for all CFG-006 functionality including field discovery, source attribution, display formatting, filtering, and performance'
    - method: '*Performance Benchmarks**: Field discovery <50ms for cache miss, <10ms for cache hit; config command <100ms end-to-end; single field access <10ms'
    - method: '*Edge Case Testing**: Anonymous embedded fields, unexported field exclusion, interface{} handling, circular reference prevention, malformed struct handling, depth limitation, error recovery'
    - method: '*Integration Testing**: CFG-005 inheritance integration, source tracking accuracy, display formatting validation, filtering functionality'
    - method: '*Performance Validation**: Reflection result caching (60%+ improvement), lazy source evaluation, incremental resolution, memory allocation efficiency, concurrent access safety'
    - method: See `architecture-decisions.md` § Configuration Reflection Architecture [ARCH-CFG_006] and `implementation-decisions.md` § Configuration Reflection Implementation [IMPL-CFG_006] for detailed testing approach
  traceability:
    architecture:
      - ARCH-CFG_006
    implementation:
      - IMPL-CFG_006
    tests: []
    code_annotations:
      - REQ-CFG_006
  related_requirements:
    depends_on: []
    related_to: []
    supersedes: []
  detail_file: requirements/REQ-CFG_006.yaml
  metadata:
    created:
      date: "2026-03-12"
      author: MCP converter
    last_updated:
      date: "2026-03-12"
      author: MCP converter
      reason: Converted from monolithic
    last_validated:
      date: "2026-03-12"
