  gathering_function: "```go\nfunc GatherFileStatInfo(path string) (*FileStatInfo, error) {\n    info, err := os.Stat(path)\n    if err != nil {\n        return nil, fmt.Errorf(\"failed to stat file %s: %w\", path, err)\n    }\n    \n    return &FileStatInfo{\n        Path:      path,\n        Name:      filepath.Base(path),\n        Size:      info.Size(),\n        SizeHuman: formatHumanSize(info.Size()),\n        MTime:     info.ModTime(),\n        MTimeUnix: info.ModTime().Unix(),\n        Mode:      info.Mode(),\n        Type:      getFileType(info),\n    }, nil\n}\n```"
  human-readable_size_formatting: "```go\nfunc formatHumanSize(size int64) string {\n    const (\n        KB = 1024\n        MB = KB * 1024\n        GB = MB * 1024\n        TB = GB * 1024\n    )\n    \n    switch {\n    case size >= TB:\n        return fmt.Sprintf(\"%.1fTB\", float64(size)/TB)\n    case size >= GB:\n        return fmt.Sprintf(\"%.1fGB\", float64(size)/GB)\n    case size >= MB:\n        return fmt.Sprintf(\"%.1fMB\", float64(size)/MB)\n    case size >= KB:\n        return fmt.Sprintf(\"%.1fKB\", float64(size)/KB)\n    default:\n        return fmt.Sprintf(\"%dB\", size)\n    }\n}\n```"
