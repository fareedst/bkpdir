  code_locations:
    files: []
    functions: []
  code_markers: '`pkg/fileops/comparison.go`, snapshot structures, comparison functions'
  comparison_algorithm: |-
    ```go
    func CompareSnapshots(snap1, snap2 *DirectorySnapshot) bool {
        if len(snap1.Files) != len(snap2.Files) {
            return false
        }
        
        for path, info1 := range snap1.Files {
            info2, exists := snap2.Files[path]
            if !exists {
                return false
            }
            
            if info1.Hash != info2.Hash || info1.Size != info2.Size {
                return false
            }
        }
        
        return true
    }
    ```
  cross_references:
    - ARCH-DIRECTORY_COMPARISON
  detail_file: implementation-decisions/IMPL-DIRECTORY_COMPARISON.yaml
  directorysnapshot: |-
    ```go
    type DirectorySnapshot struct {
        Files map[string]FileInfo
        Root  string
    }

    type FileInfo struct {
        Path     string
        Size     int64
        ModTime  time.Time
        Hash     string
        IsDir    bool
    }
    ```
  from_archive: |-
    ```go
    func CreateArchiveSnapshot(archivePath string) (*DirectorySnapshot, error) {
        reader, err := zip.OpenReader(archivePath)
        if err != nil {
            return nil, err
        }
        defer reader.Close()
        
        snapshot := &DirectorySnapshot{
            Files: make(map[string]FileInfo),
            Root:  archivePath,
        }
        
        for _, file := range reader.File {
            hash := calculateArchiveFileHash(file)
            snapshot.Files[file.Name] = FileInfo{
                Path:    file.Name,
                Size:    int64(file.UncompressedSize64),
                ModTime: file.ModTime(),
                Hash:    hash,
                IsDir:   file.FileInfo().IsDir(),
            }
        }
        
        return snapshot, nil
    }
    ```
  from_directory: |-
    ```go
    func CreateDirectorySnapshot(root string, exclusions []string) (*DirectorySnapshot, error) {
        snapshot := &DirectorySnapshot{
            Files: make(map[string]FileInfo),
            Root:  root,
        }
        
        err := WalkWithExclusions(root, exclusions, func(path string, info os.FileInfo, err error) error {
            if err != nil {
                return err
            }
            
            hash := calculateFileHash(path)
            snapshot.Files[path] = FileInfo{
                Path:    path,
                Size:    info.Size(),
                ModTime: info.ModTime(),
                Hash:    hash,
                IsDir:   info.IsDir(),
            }
            return nil
        })
        
        return snapshot, err
    }
    ```
