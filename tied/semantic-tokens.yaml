REQ-DIFF_COMMAND:
  type: REQ
  name: Diff Command Requirements
  status: Active
  description: Implement a CLI `diff` command that reports if there are any changes between the current directory files and
    the union of the most recent incremental archive on top of the most recent full archive. The command must reconstruct
    the effective state by applying incremental changes to the full archive, then compare that reconstructed state against
    the current directory. Archive selection (finding the most recent full and incremental archives) must use name-based sorting
    since archive names include timestamps in ISO 8601 format (`YYYY-MM-DDTHHmmss`) which are alphabetically sortable.
  cross_references: []
  source_index: requirements.yaml
  detail_file: requirements/REQ-DIFF_COMMAND.yaml
  metadata:
    registered: '2026-03-12'
    last_updated: '2026-03-12'
  category: Functional
REQ-INCREMENTAL_DUPLICATE_PREVENTION:
  type: REQ
  name: Incremental Archive Duplicate Prevention Requirements
  status: Active
  description: Prevent creation of duplicate incremental archives when there are no observable changes compared to the most
    recent incremental archive. The system must compare the current directory state against the union of the most recent incremental
    archive applied on top of the most recent full archive, rather than comparing only against the full archive. If no changes
    are detected, the incremental archive creation must be skipped with an appropriate message. Archive selection (finding
    the most recent full and incremental archives) must use name-based sorting since archive names include timestamps in ISO
    8601 format (`YYYY-MM-DDTHHmmss`) which are alphabetically sortable.
  cross_references: []
  source_index: requirements.yaml
  detail_file: requirements/REQ-INCREMENTAL_DUPLICATE_PREVENTION.yaml
  metadata:
    registered: '2026-03-12'
    last_updated: '2026-03-12'
  category: Functional
