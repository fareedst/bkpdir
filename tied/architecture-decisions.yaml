  decision: Use diff command analysis to prevent duplicate incremental archives
  always_create_incremental: Rejected - wastes disk space and creates clutter
  animation/timeline_module: Render an animated sequence or stepwise storyboard that highlights token handoffs over time (REQ → ARCH → IMPL → TEST/CODE), with on-frame token callouts.
  change_detection: Use same change detection logic as diff command
  compare_only_against_full_archive: Rejected - allows duplicate incrementals with no changes
  consequences:
    - A canonical `docs/package-interdependency-mapping.md` is required and serves as the authoritative mapping for EXTRACT-008.
    - Where coupling is unavoidable, introduce small interfaces to break cycles and record these interface contracts in the mapping document and in `implementation-decisions.md`.
