  data_extraction_module: 'Parse `tied/semantic-tokens.md`, `requirements.md`, `architecture-decisions.md`, `implementation-decisions.md`, and sampled code/test anchors to build a token graph (nodes: REQ/ARCH/IMPL/TEST/CODE; edges: traceability links) with token metadata (type, status, sample refs) for visual prominence.'
  integration_&_storage: Export assets to `docs/images/` (SVG/PNG/GIF/MP4 as needed) and embed into STDD docs with captions and token callouts; include a data snapshot (JSON/CSV) to keep visuals reproducible and token-accurate.
  integration_points: |-
    1. **Incremental Archive Creation**: Modify `createIncrementalArchive` to use diff analysis
    2. **Archive State Reconstruction**: Share reconstruction logic with diff command
    3. **Comparison Engine**: Reuse comparison logic from diff command
    4. **Output Formatting**: Use consistent format strings for skip messages
  module_boundaries_(for_[req-module_validation],_token_emphasis):
    - '`DataExtraction`: input = STDD docs + selected code/test anchors; output = normalized token graph/JSON with token metadata for styling.'
    - '`Visualization`: input = token graph; output = static layered diagram with tokens visually dominant; legends articulate token roles.'
    - '`AnimationTimeline`: input = ordered trace steps; output = animated timeline/multi-frame storyboard with token callouts per step.'
    - '`Integration`: links assets into docs, preserves token prominence guidance, and records validation notes.'
  reuse_diff_logic: Leverage diff command comparison engine for duplicate detection
  separate_comparison_logic: Rejected - code duplication and potential inconsistency
  skip_creation: Skip incremental archive creation if no changes detected
  state_reconstruction: Reconstruct effective state from full + most recent incremental archive
  user_feedback: Display appropriate message when archive creation is skipped
  visualization_module: Generate a layered flow (e.g., swimlane/graph or Sankey-style) where tokens are the dominant nodes (color/weight/labels), edges clarify trace paths, and legends explain token roles.
