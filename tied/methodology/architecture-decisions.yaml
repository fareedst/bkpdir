# Architecture Decisions Index (YAML Database)
#
# This YAML file serves as the central index/registry for all architecture decisions in the project.
# Each top-level key is a semantic token (e.g., ARCH-TIED_STRUCTURE).
#
# To append a new architecture decision:
# 1. Copy the template block at the bottom of this file (ARCH-IDENTIFIER)
# 2. Paste it at the end with a blank line before it
# 3. Replace ARCH-IDENTIFIER with your new token
# 4. Fill in all fields
# 5. Update the detail_file path to match your new .yaml file in architecture-decisions/ directory
#
# Field descriptions:
#   name: Short descriptive name of the decision
#   status: Active | Deprecated | Template | Superseded
#   cross_references: List of REQ-* tokens this decision fulfills
#   rationale: Structured explanation with why, problems_solved, benefits
#   alternatives_considered: List of alternative items with pros, cons, rejected_reason
#   implementation_approach: Structured approach with summary and details
#   traceability: Structured links to requirements, implementation, tests, code_annotations
#   related_decisions: Lists of depends_on, informs, see_also (YAML lists or [])
#   detail_file: Path to the detailed .yaml file in architecture-decisions/ directory
#   metadata: Structured metadata with created, last_updated, last_validated info
ARCH-FEEDBACK_STORAGE:
  alternatives_considered:
    - name: New YAML index (e.g. feedback.yaml as index)
      cons:
        - Feedback is not a traceability index; different schema (entries array)
      pros:
        - Consistent with requirements.yaml pattern
      rejected_reason: Keep feedback as a separate artifact; schema is list of entries, not token-keyed records
    - name: Store in requirements or implementation index
      cons:
        - Pollutes REQ/IMPL with non-traceability data
      pros:
        - No new file
      rejected_reason: Feedback is not a requirement or implementation decision
  cross_references:
    - REQ-FEEDBACK_TO_TIED
  detail_file: architecture-decisions/ARCH-FEEDBACK_STORAGE.yaml
  implementation_approach:
    details:
      - 'Each entry: id, type (feature_request | bug_report | methodology_improvement), title, description, context (optional), created_at (ISO 8601)'
      - 'MCP tools: tied_feedback_add (append), tied_feedback_export (markdown or JSON)'
      - Use getBasePath() from yaml-loader for path resolution
    summary: One file {TIED_BASE_PATH}/feedback.yaml with top-level key 'entries' (array of objects)
  metadata:
