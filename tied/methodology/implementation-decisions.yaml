# Implementation Decisions Index (YAML Database)
#
# This YAML file serves as the central index/registry for all implementation decisions in the project.
# Each top-level key is a semantic token (e.g., IMPL-MODULE_VALIDATION).
#
# To append a new implementation decision:
# 1. Copy the template block at the bottom of this file (IMPL-IDENTIFIER)
# 2. Paste it at the end with a blank line before it
# 3. Replace IMPL-IDENTIFIER with your new token
# 4. Fill in all fields
# 5. Update the detail_file path to match your new .yaml file in implementation-decisions/ directory
#
# Field descriptions:
#   name: Short descriptive name of the decision
#   status: Active | Deprecated | Template | Superseded
#   cross_references: List of ARCH-* and REQ-* tokens this decision implements
#   rationale: Structured explanation with why, problems_solved, benefits
#   implementation_approach: Structured approach with summary and details
#   code_locations: Structured code locations with files and functions
#   traceability: Structured links to architecture, requirements, tests, code_annotations
#   related_decisions: Lists of depends_on, supersedes, see_also (YAML lists or [])
#   detail_file: Path to the detailed .yaml file in implementation-decisions/ directory
#   metadata: Structured metadata with created, last_updated, last_validated info
IMPL-MCP_FEEDBACK_TOOLS:
  code_locations:
    files:
      - path: mcp-server/src/feedback.ts
        description: Feedback load/append/export logic [REQ-FEEDBACK_TO_TIED] [ARCH-FEEDBACK_STORAGE] [IMPL-MCP_FEEDBACK_TOOLS]
      - path: mcp-server/src/feedback.test.ts
        description: Unit tests for feedback module
      - path: mcp-server/src/tools/index.ts
        description: Tool handlers tied_feedback_add, tied_feedback_export
    functions:
      - name: loadFeedback
        description: Load feedback.yaml or default structure
        file: mcp-server/src/feedback.ts
      - name: appendEntry
        description: Append one entry with id and created_at
        file: mcp-server/src/feedback.ts
      - name: exportMarkdown
        description: Export entries as markdown for TIED report
        file: mcp-server/src/feedback.ts
      - name: exportJson
        description: Export entries as JSON string
        file: mcp-server/src/feedback.ts
  cross_references:
    - ARCH-FEEDBACK_STORAGE
    - REQ-FEEDBACK_TO_TIED
  detail_file: implementation-decisions/IMPL-MCP_FEEDBACK_TOOLS.yaml
  implementation_approach:
    details:
      - 'appendEntry(params): validate type/title/description; generate id (e.g. timestamp-based); set created_at; append to entries; write file'
      - 'exportMarkdown(entries), exportJson(entries): format all entries for report'
      - 'getFeedbackPath(basePath?): resolve {base}/feedback.yaml'
      - 'loadFeedback(basePath?): read YAML or return { entries: [] }; create file if missing on first append'
      - 'tied_feedback_add: parse args, call appendEntry, return ok/id/created_at and optional report_snippet (markdown)'
      - 'tied_feedback_export: load entries, call exportMarkdown or exportJson, return string'
    summary: Feedback module (load/append/export) under mcp-server/src/feedback.ts; two tool handlers in tools/index.ts
  metadata:
    created:
      author: AI Agent
      date: 2026-03-03
    last_updated:
      author: AI Agent
      date: 2026-03-03
      reason: Initial creation
    last_validated:
      date: 2026-03-03
      result: pass
