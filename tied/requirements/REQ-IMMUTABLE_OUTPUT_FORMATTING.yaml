REQ-IMMUTABLE_OUTPUT_FORMATTING:
  name: Output Formatting Requirements (Immutable)
  category: Functional
  priority: P0
  status: Implemented
  rationale:
    why: These output formatting requirements are mandatory behaviors that users and scripts depend on. Changing them would break output parsing.
    problems_solved: []
    benefits: []
  satisfaction_criteria:
    - criterion: All standard output uses printf-style format specifications
    - criterion: Template-based formatting supports text/template and placeholder syntax
    - criterion: Format strings and templates are retrieved from configuration
