REQ-CFG_005:
  name: "Layered Configuration Inheritance Requirements"
  category: "Functional"
  priority: "P0"
  status: "Implemented"
  rationale:
    why: "Enables hierarchical configuration management for complex project structures. Array fields default to merge (accumulate) so values from parent configs combine with child additions when no explicit replace prefix is used. Built-in `exclude_patterns` default is an empty list; users add patterns in YAML when they want paths skipped."
