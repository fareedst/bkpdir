REQ-CFG_005:
  name: Layered Configuration Inheritance Requirements
  category: Functional
  priority: P0
  status: Implemented
  rationale:
    why: Enables hierarchical configuration management for complex project structures. Array fields accumulating by default ensures that default values (like `.git/`, `vendor/`) are preserved when users add local values.
    problems_solved: []
    benefits: []
  satisfaction_criteria:
    - criterion: Configuration files can inherit from other files
    - criterion: Circular dependencies detected and prevented
    - criterion: Inheritance chains processed in correct order
    - criterion: Merge strategies (override, append, prepend, replace, default) work correctly
    - criterion: Array fields default to merge (accumulate) strategy when no prefix is specified
    - criterion: Array field values from defaults and parent configs are preserved when child configs add values
    - criterion: Duplicate values in arrays are deduplicated during merge
    - criterion: 'Order is preserved: defaults/parent values first, then child additions'
  validation_criteria:
    - method: See `architecture-decisions.md` § Testing Strategy and `implementation-decisions.md` § Testing Implementation for testing approach
  traceability:
    architecture:
      - ARCH-CFG_005
    implementation:
      - IMPL-CONFIG_STRUCT
    tests: []
    code_annotations:
      - REQ-CFG_005
  related_requirements:
    depends_on: []
    related_to: []
    supersedes: []
  detail_file: requirements/REQ-CFG_005.yaml
