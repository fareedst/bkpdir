REQ-CUSTOMIZABLE_FORMAT_STRINGS:
  architecture: tied/architecture-decisions/ARCH-CUSTOMIZABLE_FORMAT_STRINGS.yaml
  breaking_change: Users with old `%{...}` format strings must update to `#{...}` syntax
  category: Functional
  description: All output format strings must be customizable by users through configuration files. Users should be able to override any format string in their `.bkpdir.yml` to customize the application's output interface. Format string validation must warn users of invalid placeholders. Comprehensive documentation and examples must be provided.
  immutable_requirements_(major_version_change_required): These requirements define core behaviors that MUST NOT be changed without a major version bump. These are fundamental specifications that users and other systems depend on.
  implementation: tied/implementation-decisions/IMPL-CUSTOMIZABLE_FORMAT_STRINGS.yaml
  metadata:
    created:
      author: MCP converter
      date: "2026-03-12"
    last_updated:
      author: MCP converter
      date: "2026-03-12"
      reason: Converted from monolithic
    last_validated:
      date: "2026-03-12"
      result: pass
      validator: MCP converter
  migration_complete: All code, tests, and documentation updated to use `#{...}` syntax exclusively
  name: User-Customizable Format Strings Requirements
  placeholder_syntax_migration: All placeholders migrated from `%{...}` to `#{...}` syntax to avoid conflicts with Go's `fmt` package
  priority: P1
  rationale:
    benefits: []
    problems_solved: []
    why: Enables users to customize output format to match their preferences, workflows, and internationalization needs without modifying source code. Validation prevents common mistakes and improves user experience.
  related_requirements:
    depends_on:
      - REQ-CONFIGURATION
      - REQ-IMMUTABLE_CONFIGURATION_DEFAULTS
      - REQ-OUTPUT_FORMATTING
      - REQ-USABILITY
    related_to: []
    supersedes: []
  satisfaction_criteria:
    - criterion: '*CRITICAL**: Only template-style placeholders (`#{name}`) are supported. Printf-style placeholders (`%s`, `%d`) are NOT supported.'
    - criterion: '*REQUIRED**: All named file attributes (size, size_human, mtime, mode, type, name, etc.) MUST be equally accessible as template-style placeholders in list output'
    - criterion: '*REQUIRED**: The `list` command output MUST support template-style placeholders to display file attributes'
    - criterion: '*REQUIRED**: The default list output format MUST include file size information using `#{size_human}` placeholder (e.g., `#{path} (size: #{size_human})`)'
    - criterion: '*REQUIRED**: The substring `(size: #{size_human})` MUST be supported and display as `(size: 1 byte)` or similar human-readable size format (e.g., `(size: 1.2MB)`, `(size: 455KB)`)'
    - criterion: '*REQUIRED**: Users MUST be able to use placeholders like `#{size_human}`, `#{path}`, `#{creation_time}`, and other named attributes in the list output format'
    - criterion: 'All placeholders MUST use the named format: `#{path}`, `#{size_human}`, `#{creation_time}`, etc.'
    - criterion: All format strings can be overridden in `.bkpdir.yml`
    - criterion: Backward compatibility maintained (defaults work when not specified)
    - criterion: Brief example configuration file demonstrates common customizations
    - criterion: Comprehensive reference documentation lists all available format strings with their placeholders
    - criterion: Format string validation warns users of invalid or unexpected placeholders
    - criterion: Placeholder documentation explains available variables for each format string
    - criterion: Special placeholders like `#{size_human}` documented and validated
    - criterion: Validation provides helpful error messages indicating expected placeholders
  status: Implemented
  traceability:
    architecture:
      - ARCH-CUSTOMIZABLE_FORMAT_STRINGS
    code_annotations:
      - REQ-CUSTOMIZABLE_FORMAT_STRINGS
    implementation:
      - IMPL-CUSTOMIZABLE_FORMAT_STRINGS
    tests: []
  validation_criteria:
    - method: Documentation is complete, accurate, and tested
    - method: Example configuration files work as documented
    - method: Integration tests verify format string customization works end-to-end
    - method: Tests verify both printf-style and template-style formats work
    - method: Tests verify custom format strings are loaded and used correctly
    - method: Tests verify defaults work when not specified
    - method: Tests verify format string validation catches invalid placeholders
    - method: Tests verify validation provides helpful error messages
