REQ-GOV_REGISTRY_COMPLETENESS:
  REQ-GOV_REGISTRY_COMPLETENESS:
    name: Token Registry Completeness
    category: Functional
    priority: P1
    status: Implemented
    rationale:
      why: All semantic tokens must be registered in the token registry to ensure complete traceability and prevent orphaned or undocumented tokens.
      problems_solved:
        - Tokens referenced in code/docs but not registered in the registry
        - Incomplete traceability chains due to unregistered tokens
        - Difficulty auditing token usage without a complete registry
      benefits:
        - Complete token registry enables comprehensive traceability
        - Automated validation can detect unregistered tokens
        - Full audit trail of all semantic tokens in the project
    satisfaction_criteria:
      - criterion: All tokens referenced in code, tests, and documentation are registered in semantic-tokens.yaml
      - criterion: Validation tooling detects and reports unregistered tokens
      - criterion: Token registration is enforced as part of the development workflow
    validation_criteria:
      - method: Token validation scripts verify all referenced tokens exist in the registry
    traceability:
