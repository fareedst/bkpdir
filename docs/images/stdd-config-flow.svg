<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Configuration Semantic Token Hierarchy -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <style>
    .title { font-family: "Helvetica", "Arial", sans-serif; font-size: 26px; font-weight: bold; fill: #333; }
    .subtitle { font-family: "Helvetica", "Arial", sans-serif; font-size: 14px; fill: #555; }
    .lane-label { font-family: "Helvetica", "Arial", sans-serif; font-size: 14px; fill: #666; font-weight: bold; }
    .node { rx: 10; ry: 10; }
    .node-text { font-family: "Helvetica", "Arial", sans-serif; font-size: 12px; fill: #fff; pointer-events: none; }
    .code-text { fill: #fff; font-size: 11px; }
    .arrow { stroke: #999; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>

  <text class="title" x="50%" y="40" text-anchor="middle">Configuration Semantic Token Hierarchy</text>
  <text class="subtitle" x="50%" y="65" text-anchor="middle">REQ → ARCH → IMPL → TEST → CODE (Configuration-focused chains)</text>

  <!-- Lane backgrounds -->
  <rect x="0" y="90" width="1200" height="60" fill="#e9f0f9"/>
  <rect x="0" y="170" width="1200" height="60" fill="#f3ece6"/>
  <rect x="0" y="250" width="1200" height="60" fill="#f9e7df"/>
  <rect x="0" y="330" width="1200" height="60" fill="#e7f5e4"/>
  <rect x="0" y="410" width="1200" height="60" fill="#edeceb"/>

  <!-- Lane labels -->
  <text class="lane-label" x="20" y="125">Requirements</text>
  <text class="lane-label" x="20" y="205">Architecture</text>
  <text class="lane-label" x="20" y="285">Implementation</text>
  <text class="lane-label" x="20" y="365">Tests</text>
  <text class="lane-label" x="20" y="445">Code Anchors</text>

  <!-- Requirements nodes -->
  <rect class="node" x="160" y="105" width="180" height="40" fill="#4C78A8"/>
  <text class="node-text" x="250" y="130" text-anchor="middle">[REQ:CONFIGURATION]</text>

  <rect class="node" x="500" y="105" width="160" height="40" fill="#4C78A8"/>
  <text class="node-text" x="580" y="130" text-anchor="middle">[REQ:CFG_005]</text>

  <rect class="node" x="820" y="105" width="160" height="40" fill="#4C78A8"/>
  <text class="node-text" x="900" y="130" text-anchor="middle">[REQ:CFG_006]</text>

  <!-- Architecture nodes -->
  <rect class="node" x="140" y="185" width="220" height="40" fill="#9C755F"/>
  <text class="node-text" x="250" y="210" text-anchor="middle">[ARCH:CONFIG_SYSTEM]</text>

  <rect class="node" x="500" y="185" width="180" height="40" fill="#9C755F"/>
  <text class="node-text" x="590" y="210" text-anchor="middle">[ARCH:CFG_005]</text>

  <rect class="node" x="820" y="185" width="200" height="40" fill="#9C755F"/>
  <text class="node-text" x="920" y="210" text-anchor="middle">[ARCH:CFG_006]</text>

  <!-- Implementation nodes -->
  <rect class="node" x="120" y="265" width="240" height="40" fill="#D2724D"/>
  <text class="node-text" x="240" y="290" text-anchor="middle">[IMPL:CONFIG_STRUCT]</text>

  <rect class="node" x="470" y="265" width="220" height="40" fill="#D2724D"/>
  <text class="node-text" x="580" y="290" text-anchor="middle">[IMPL:EXCLUDE_MERGE_FIX]</text>

  <rect class="node" x="780" y="265" width="220" height="40" fill="#D2724D"/>
  <text class="node-text" x="890" y="290" text-anchor="middle">[IMPL:CFG_006]</text>

  <rect class="node" x="1030" y="265" width="140" height="40" fill="#D2724D"/>
  <text class="node-text" x="1100" y="290" text-anchor="middle">[IMPL:CONFIG_OUTPUT_GROUPING]</text>

  <!-- Test nodes -->
  <rect class="node" x="470" y="345" width="220" height="40" fill="#59A14F"/>
  <text class="node-text" x="580" y="370" text-anchor="middle">[TEST:EXCLUDE_MERGE]</text>

  <rect class="node" x="820" y="345" width="220" height="40" fill="#59A14F"/>
  <text class="node-text" x="930" y="370" text-anchor="middle">Config Reflection Tests</text>

  <!-- Code nodes -->
  <rect class="node" x="120" y="425" width="220" height="40" fill="#BAB0AC"/>
  <text class="code-text" x="230" y="450" text-anchor="middle">config.go::DefaultConfig</text>

  <rect class="node" x="470" y="425" width="220" height="40" fill="#BAB0AC"/>
  <text class="code-text" x="580" y="450" text-anchor="middle">config.go::applyMergeStrategies</text>

  <rect class="node" x="780" y="425" width="220" height="40" fill="#BAB0AC"/>
  <text class="code-text" x="890" y="450" text-anchor="middle">config.go::reflectConfigFields</text>

  <rect class="node" x="1030" y="425" width="140" height="40" fill="#BAB0AC"/>
  <text class="code-text" x="1100" y="450" text-anchor="middle">main.go::handleConfigCommand</text>

  <!-- Arrows -->
  <line class="arrow" x1="340" y1="125" x2="360" y2="125"/> <!-- spacer -->
  <line class="arrow" x1="340" y1="125" x2="140" y2="205"/>

  <line class="arrow" x1="320" y1="205" x2="360" y2="205"/>
  <line class="arrow" x1="360" y1="205" x2="240" y2="265"/>
  <line class="arrow" x1="240" y1="305" x2="230" y2="425"/>

  <line class="arrow" x1="660" y1="125" x2="680" y2="125"/>
  <line class="arrow" x1="680" y1="125" x2="590" y2="185"/>
  <line class="arrow" x1="680" y1="205" x2="690" y2="205"/>
  <line class="arrow" x1="690" y1="205" x2="580" y2="265"/>
  <line class="arrow" x1="580" y1="305" x2="580" y2="345"/>
  <line class="arrow" x1="580" y1="385" x2="580" y2="425"/>

  <line class="arrow" x1="980" y1="125" x2="1000" y2="125"/>
  <line class="arrow" x1="1000" y1="125" x2="920" y2="185"/>
  <line class="arrow" x1="920" y1="225" x2="890" y2="265"/>
  <line class="arrow" x1="890" y1="305" x2="930" y2="345"/>
  <line class="arrow" x1="930" y1="385" x2="890" y2="425"/>

  <line class="arrow" x1="920" y1="225" x2="1100" y2="265"/>
  <line class="arrow" x1="1100" y1="305" x2="930" y2="345"/>
  <line class="arrow" x1="1100" y1="305" x2="1100" y2="425"/>
</svg>

