record_identity:
  change_request_id: INCREMENTAL-ANCHOR-MODE
  title: Full-anchored incremental archives (default) with chained opt-in
  recorded_at: "2026-10-21"
change_definition:
  current_behavior: |
    bkpdir inc compares the working tree to ReconstructArchiveState, which merges the latest
    full archive with every matching _update= incremental in name order (chained deltas). Each
    new inc zip contains only paths that differ from that chained effective state. Skip when
    diff against chained state is empty. Incremental names use minute-resolution timestamps;
    two inc runs in the same minute target the same path (overwrite risk).
  desired_behavior: |
    Default incremental_anchor_mode full: each inc zip lists every file that differs from the
    latest full snapshot (cumulative vs full). Skip and diff use effective state = full plus
    overlay of the latest matching incremental only (valid when incs are cumulative). Optional
    incremental_anchor_mode chained preserves today's merge-all-incrementals behavior for
    legacy archive sets. Config key incremental_anchor_mode (full|chained); inc and diff accept
    --incremental-anchor-mode override. When the resolved incremental path already exists,
    append -seqN before .zip until unused (same-minute disambiguation).
  non_goals:
    - Sub-second timestamp format change for archive names
    - Automatic detection of chained vs full-anchored archives on disk
    - Mixed-mode reconstruction in one archive directory without explicit config
  success_criteria:
    - Second bkpdir inc after two file changes (sponsor log pattern) includes all paths changed vs full in dry-run under default config
    - chained mode passes existing TestIncrementalSkipRequiresFullIncrementalChain and multi-incremental reconstruction tests unchanged
    - Same-minute two inc creates two distinct files via -seqN suffix
    - docs/user/specification.md and vocab aligned with default full-anchored semantics
    - TIED REQ/ARCH/IMPL LEAP complete; tied_validate_consistency pass
  unchanged_behavior: |
    Full archive creation, exclude patterns, git naming segments, deletion-only skip (no empty zip),
    incremental basename still derived from latest full archive name.
