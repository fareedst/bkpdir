    - criterion: "Default prefix is \"bkp\" when not specified"
    - criterion: "Incremental names include the _update= marker and reuse base full-archive naming segments"
    - criterion: "When the generated incremental path exists, the resolved name inserts -seqN before .zip with N >= 2 until unused"
  status: "Implemented"
  traceability:
    architecture:
