REQ-IMMUTABLE_ARCHIVE_NAMING:
  architecture: "tied-project/architecture-decisions/ARCH-ARCHIVE_FORMAT.yaml"
  category: "Functional"
  cross-references: "[REQ-INCREMENTAL_ANCHOR_MODE]"
  description: "Archive naming convention is fixed; breaking changes require a major version bump.\n\nFull archive: `[PREFIX-]YYYY-MM-DD-hh-mm[=BRANCH=HASH][=NOTE].zip`.\n\nIncremental archive: `BASENAME_update=YYYY-MM-DD-hh-mm[=BRANCH=HASH][=NOTE].zip` where BASENAME is the base full archive basename without `.zip`.\n\nOptional collision disambiguation ([REQ-INCREMENTAL_ANCHOR_MODE]): when the generated incremental path already exists on disk, bkpdir inserts `-seqN` immediately before `.zip` (N starts at 2 and increments until an unused path is found), for example `proj-2026-01-01-12-00_update=2026-01-01-12-01-seq2.zip`. The `_update=` marker and minute-resolution timestamp are unchanged; `-seqN` is not a user note segment and applies only when the candidate incremental filename collides."
  implementation: "tied-project/implementation-decisions/IMPL-ZIP_FORMAT.yaml"
  metadata:
    created:
      author: "MCP converter"
      date: "2026-03-12"
    last_updated:
      author: "AI agent"
      date: "2026-10-21"
      reason: "LEAP — document optional -seqN incremental path disambiguator"
    last_validated:
      date: "2026-03-12"
      result: "pass"
      validator: "MCP converter"
  name: "Archive Naming Convention (Immutable)"
  priority: "P0"
  rationale:
    benefits: []
    problems_solved: []
    why: "Users and scripts depend on this naming convention. Changing it would break existing workflows and integrations."
