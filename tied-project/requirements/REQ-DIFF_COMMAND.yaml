REQ-DIFF_COMMAND:
  architecture: "tied-project/architecture-decisions/ARCH-DIFF_COMMAND.yaml"
  category: "Functional"
  cross-references: "[REQ-INCREMENTAL_DUPLICATE_PREVENTION] (Incremental Archive Duplicate Prevention), [REQ-OUTPUT_FORMATTING] (Output Formatting), [REQ-CONFIGURATION] (Configuration Management), [REQ-CONTEXT_SUPPORT] (Context Support)"
  description: "Implement a CLI `diff` command that reports changes between the current directory and the effective archived state. Reconstruction follows [REQ-INCREMENTAL_ANCHOR_MODE] `incremental_anchor_mode`: default `full` applies the latest matching incremental on the most recent full archive only; opt-in `chained` applies every matching incremental for that full base in name order (oldest first). The command compares the reconstructed state against the current directory. Archive selection uses name-based sorting (timestamps in archive names are alphabetically sortable). CLI `--incremental-anchor-mode` overrides config for the invocation."
  implementation: "tied-project/implementation-decisions/IMPL-DIFF_COMMAND.yaml"
  metadata:
    created:
      author: "MCP converter"
      date: "2026-03-12"
    last_updated:
      author: "AI agent"
      date: "2026-10-21"
      reason: "LEAP — diff baseline follows incremental_anchor_mode"
    last_validated:
      date: "2026-03-12"
      result: "pass"
      validator: "MCP converter"
  name: "Diff Command Requirements"
  priority: "P1"
  rationale:
    benefits: []
    problems_solved: []
    why: "Provides users with visibility into what changes exist before creating a new incremental archive. Enables users to preview differences and understand what would be included in the next incremental backup. The diff analysis is also useful for preventing duplicate incremental archives when there are no observable changes. Name-based sorting is more reliable than file system modification times and consistent with archive naming conventions."
  related_requirements:
    depends_on:
      - "REQ-CONFIGURATION"
      - "REQ-CONTEXT_SUPPORT"
      - "REQ-INCREMENTAL_ANCHOR_MODE"
      - "REQ-INCREMENTAL_DUPLICATE_PREVENTION"
      - "REQ-OUTPUT_FORMATTING"
    related_to: []
    supersedes: []
  satisfaction_criteria:
    - criterion: "Archive selection uses name-based sorting (archive names include alphabetically sortable timestamps)"
    - criterion: "CLI command `bkpdir diff` reports changes between current directory and reconstructed archive state"
    - criterion: "Command respects exclude patterns from configuration"
    - criterion: "Command supports context cancellation for long-running operations"
    - criterion: "Command supports dry-run mode for preview"
    - criterion: "Handles cases where no archives exist (reports appropriate message)"
    - criterion: "Handles cases where no incremental archive exists (compares against full archive only)"
    - criterion: "Output shows added files, modified files, and deleted files"
    - criterion: "Output uses configurable format strings consistent with other commands"
    - criterion: "When incremental_anchor_mode is chained, reconstructs by applying every matching incremental on the most recent full archive in name order"
    - criterion: "When incremental_anchor_mode is full (default), reconstructs full plus latest matching incremental overlay only"
  status: "Implemented"
