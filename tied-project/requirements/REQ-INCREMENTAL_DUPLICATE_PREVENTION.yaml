REQ-INCREMENTAL_DUPLICATE_PREVENTION:
  architecture: "tied-project/architecture-decisions/ARCH-INCREMENTAL_DUPLICATE_PREVENTION.yaml"
  category: "Functional"
  cross-references: "[REQ-DIFF_COMMAND] (Diff Command), [REQ-OUTPUT_FORMATTING] (Output Formatting), [REQ-CONFIGURATION] (Configuration Management), [REQ-CONTEXT_SUPPORT] (Context Support)"
  description: "Prevent creation of duplicate incremental archives when there are no observable changes compared to the effective archived state. Effective state reconstruction follows [REQ-INCREMENTAL_ANCHOR_MODE] `incremental_anchor_mode`: default `full` overlays only the latest matching incremental on the most recent full archive; opt-in `chained` merges every matching incremental for that full base in name order (oldest first). Skip and diff must use the same mode-aware reconstruction as incremental creation. If no changes are detected, skip incremental creation with an appropriate message. Archive selection uses name-based sorting (timestamps in archive names are alphabetically sortable)."
  implementation: "tied-project/implementation-decisions/IMPL-INCREMENTAL_DUPLICATE_PREVENTION.yaml"
  metadata:
    created:
      author: "MCP converter"
      date: "2026-03-12"
    last_updated:
      author: "AI agent"
      date: "2026-10-21"
      reason: "LEAP — scope reconstruction to incremental_anchor_mode (full default, chained opt-in)"
    last_validated:
      date: "2026-03-12"
      result: "pass"
      validator: "MCP converter"
  name: "Incremental Archive Duplicate Prevention Requirements"
  priority: "P1"
  rationale:
    benefits: []
    problems_solved: []
    why: "Prevents unnecessary incremental archives from being created when no changes have occurred since the last incremental backup. This saves disk space and reduces archive clutter. Users should not have multiple identical incremental archives representing the same state. Name-based sorting is more reliable than file system modification times and consistent with archive naming conventions."
  related_requirements:
    depends_on:
      - "REQ-CONFIGURATION"
      - "REQ-CONTEXT_SUPPORT"
      - "REQ-DIFF_COMMAND"
      - "REQ-INCREMENTAL_ANCHOR_MODE"
      - "REQ-OUTPUT_FORMATTING"
    related_to: []
    supersedes: []
  satisfaction_criteria:
    - criterion: "Appropriate message displayed when archive creation is skipped due to no changes"
    - criterion: "Archive selection uses name-based sorting (archive names include alphabetically sortable timestamps)"
    - criterion: "Behavior is consistent with diff command output for the same incremental_anchor_mode"
    - criterion: "Comparison logic reuses diff command analysis for consistency"
    - criterion: "Comparison respects exclude patterns from configuration"
    - criterion: "Handles edge cases: no incremental exists (compare against full), no archives exist (error appropriately)"
    - criterion: "If no changes detected compared to reconstructed state, skip archive creation"
    - criterion: "When incremental_anchor_mode is chained, compares against full archive plus ordered incremental chain for that full base"
    - criterion: "When incremental_anchor_mode is full (default), compares against full archive plus overlay of latest matching incremental only"
  status: "Implemented"
  traceability:
