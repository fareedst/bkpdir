  implementation_approach:
    details:
      - "Display appropriate message using format strings"
      - "Exclude patterns respected via archiveConfig.GetExcludePatterns()"
      - "Fallback to old behavior when reconstruction fails (backward compatibility)"
      - "Reuse CalculateDiff() function from diff command implementation"
      - "Skip incremental archive creation if no changes detected"
      - "Use diff result to determine if changes exist"
      - "Use findLatestFullArchive() with name-based sorting"
      - "Use ReconstructArchiveStateWithMode() for effective state per incremental_anchor_mode"
    summary: "Skip creating incremental archives when reconstructed archive state (per incremental_anchor_mode and IMPL-DIFF_COMMAND) matches the working tree for archivable changes, using diff command primitives and a configurable skip message. Deletion-only diffs skip as well (incremental zips cannot record tombstones)."
