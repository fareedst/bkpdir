  description: "Implement diff command with archive state reconstruction and comparison engine. Reconstructs effective state by applying every matching incremental for the current full base in name order on top of the full archive snapshot; provides accurate change detection; reuses comparison logic for duplicate prevention consistency."
  implementation_approach:
    details:
      - "Archive Selection Strategy: All selection functions use name-based sorting (ISO 8601 timestamps are alphabetically sortable) instead of file modification times"
      - "Archive State Reconstruction: Load most recent full archive, apply every matching incremental in name order, return reconstructed DirectorySnapshot"
      - "Change Reporting: Use configurable format strings, display added/modified/deleted files, handle no-changes case"
      - "CLI Command Integration: diffCmd() in main.go, context cancellation support, added to knownCommands list for auto-detection"
      - "Directory Comparison: Create snapshot of current directory, compare against reconstructed state, identify added/modified/deleted files, respect exclude patterns"
    summary: "CLI diff command reconstructs effective archive state from latest full plus every matching incremental zip (chronological name order), compares cwd snapshot to that state, and prints configurable added/modified/deleted reports.\nINPUT: archiveDir, cwd, exclude patterns, context\nOUTPUT: DiffResult, stdout diff text\nDATA: DirectorySnapshot maps by RelativePath, name-sorted Archive list\nCanonical behavior: tied-project/implementation-decisions/IMPL-DIFF_COMMAND-pseudocode.md"
